services:
  postgres:
    image: postgres:16
    container_name: market-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_data}
      POSTGRES_USER: ${POSTGRES_USER:-market_data}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_data}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market_data}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: market-data-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-market_data}@postgres:5432/${POSTGRES_DB:-market_data}
      SCHEDULER_ENABLED: "false"
      WS_INGEST_ENABLED: "false"
      # Postgres is the source of truth; no CSV snapshots inside containers.
      CSV_WRITE_ENABLED: "0"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build: .
    container_name: market-data-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-market_data}@postgres:5432/${POSTGRES_DB:-market_data}
      SCHEDULER_ENABLED: "true"
      WS_INGEST_ENABLED: "true"
      CSV_WRITE_ENABLED: "0"
      FREQTRADE_URL: ${FREQTRADE_URL:-http://freqtrade:8080}
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:-worldwatcher}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:-}
      TRADER_MIRROR_ENABLED: ${TRADER_MIRROR_ENABLED:-1}
    volumes:
      # Model artifacts are trained on the host (python -m model.train);
      # the mount means retraining needs no image rebuild.
      - ./model/artifacts:/app/model/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  director:
    build: .
    container_name: market-data-director
    restart: unless-stopped
    # Salience-driven scene switching + commentary (Sprint 13). Opt-in, like
    # freqtrade: `docker compose --profile director up`. Kept out of the default
    # stack because it hard-depends on OBS, which runs on the HOST (not compose)
    # — so it reaches OBS via the docker host gateway and OBS must have its
    # websocket server enabled. Alternative: run director/service.py directly on
    # the host, the way the Sprint 11 watchdog runs as a systemd user unit.
    profiles: ["director"]
    command: python director/service.py
    environment:
      DIRECTOR_ENABLED: ${DIRECTOR_ENABLED:-1}
      DIRECTOR_STATE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-market_data}@postgres:5432/${POSTGRES_DB:-market_data}
      OBS_WS_URL: ${OBS_WS_URL:-ws://host.docker.internal:4455}
      OBS_WS_PASSWORD: ${OBS_WS_PASSWORD:-}
      STREAM_EVENT_SPOOL: /app/data/director_events.spool.jsonl
      PIPER_BIN: ${PIPER_BIN:-piper}
      PIPER_VOICE_DIR: /app/voices
    volumes:
      # Piper voice models (.onnx) live on the host — large, not committed. The
      # director degrades to silence if the dir is empty or the binary absent.
      - ./voices:/app/voices:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: market-data-freqtrade
    restart: unless-stopped
    # Opt-in: `docker compose --profile trader up`. Kept out of the default
    # stack so the core (postgres/api/scheduler/director) starts without
    # freqtrade secrets. Still fail-closed: config.json ships empty creds and
    # the empty-default injection below means freqtrade rejects its own config
    # unless a real FREQTRADE_JWT_SECRET is supplied — it never boots with a
    # repo-known credential.
    profiles: ["trader"]
    # GPL boundary: separate container, REST-only, never imported or vendored.
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy
    environment:
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET:-}
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_USERNAME:-worldwatcher}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_PASSWORD:-}
    volumes:
      - ./config/freqtrade:/freqtrade/user_data:ro
      - freqtrade_data:/freqtrade/user_data/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  freqtrade_data:
