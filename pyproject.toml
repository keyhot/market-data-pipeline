[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Automated market data ingestion and visualization platform"
authors = [
    {name = "keyhot",email = "azamatov0202@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "yfinance (>=1.0,<2.0)",
    "fastapi (>=0.128.0,<1.0.0)",
    "uvicorn (>=0.40.0,<1.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "psycopg[binary,pool] (>=3.3.4,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "websockets (>=16.1.1,<17.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "obsws-python (>=1.8.0,<2.0.0)",
    "google-api-python-client (>=2.180.0,<3.0.0)",
    "google-auth (>=2.40.0,<3.0.0)",
    "google-auth-oauthlib (>=1.2.0,<2.0.0)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
httpx = ">=0.28.1,<1.0.0"
ruff = ">=0.9.0"
pillow = "^12.3.0"
scikit-learn = "^1.8.0"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: end-to-end synthetic checks, several seconds each (E15 A6/DGP)"]

[tool.ruff.lint.per-file-ignores]
# Frozen / pre-registered research code stays byte-identical, so its lint is
# ignored per file and per rule instead of reformatted. No test hashes these
# files; the freeze is the vault pre-registration (whether its clause covers
# code is an open user question), so not editing them needs no decision.
# Every entry names only the rules that file actually trips today.

# E15c vol-target, FROZEN 2026-09-30 (vault Docs/e15c-preregistration.md);
# tests/unit/test_vol_target.py is its test-first pre-run commitment
"model/vol_target.py" = ["E501", "F401"]
"scripts/vol_target_report.py" = ["E501", "I001"]
"tests/unit/test_vol_target.py" = ["E501", "F401"]

# E15b vol-managed exposure, frozen 2026-09-29 (vault Docs/vol-managed-exposure-
# experiment.md)
"model/vol_managed.py" = ["E501"]
"scripts/vol_managed_report.py" = ["E501", "I001"]
"tests/unit/test_vol_managed.py" = ["E501", "F401", "F841", "I001"]

# E16 trend, frozen 2026-09-29 (vault Docs/trend-experiment.md)
"model/trend.py" = ["E501"]
"scripts/trend_report.py" = ["E501", "F401", "I001"]
"tests/unit/test_trend.py" = ["E501"]

# E15 range forecast, frozen 2026-09-29 (vault Docs/range-forecast-experiment.md)
