# and the rows keys against literal copies. e13_diagnostics.py asserts it reproduces
# that result
"model/cross_section.py" = ["E501"]
"scripts/cross_section_report.py" = ["E501", "E741", "I001"]
"scripts/e13_diagnostics.py" = ["E501", "I001"]

# R3-b wick catch, FROZEN 2026-10-05 + Amendment 1 (vault
