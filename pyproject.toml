[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Automated market data ingestion and visualization platform"
authors = [
    {name = "keyhot",email = "azamatov0202@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "yfinance (>=1.0,<2.0)",
    "fastapi (>=0.128.0,<1.0.0)",
    "uvicorn (>=0.40.0,<1.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "psycopg[binary,pool] (>=3.3.4,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "websockets (>=16.1.1,<17.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
httpx = ">=0.28.1,<1.0.0"
ruff = ">=0.9.0"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]