<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SYMBOL__ — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #131722; color: #d1d4dc;
           font-family: system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 1rem;
             padding: 1rem 1.5rem; }
    h1 { margin: 0; font-size: 1.4rem; }
    a { color: #5b9cf6; text-decoration: none; }
    #chart { height: 70vh; margin: 0 1.5rem; }
    #status { padding: 0.5rem 1.5rem; color: #787b86; }
    footer { padding: 1rem 1.5rem; font-size: 0.8rem; color: #787b86; }
  </style>
</head>
<body>
  <header>
    <h1>__SYMBOL__</h1>
    <a href="/dashboard">← dashboard</a>
  </header>
  <div id="chart"></div>
  <p id="status">Loading bars…</p>
  <footer>
    Charting by <a href="https://www.tradingview.com/">TradingView</a>
    Lightweight Charts
  </footer>
  <script src="/static/lightweight-charts-4.2.0.standalone.js"></script>
  <script>
    const SYMBOL = "__SYMBOL__";
    const INTERVAL = "__INTERVAL__";
    const status = document.getElementById("status");

    // Daily bars use a date string; intraday bars need UNIX seconds.
    function barTime(timestamp) {
      return INTERVAL === "1d"
        ? timestamp.slice(0, 10)
        : Math.floor(Date.parse(timestamp) / 1000);
    }

    function toCandle(bar) {
      return {
        time: barTime(bar.timestamp),
        open: bar.open, high: bar.high, low: bar.low, close: bar.close,
      };
    }

    // The model's calls, drawn on the chart at the bar they were made: ▲/▼ by
    // direction, grey while pending → green (win) / red (loss) once resolved 15
    // bars later. Markers are enrichment — never let a failure break the chart.
    const _OUTCOME_COLOR = { win: "#26a69a", loss: "#ef5350" };
    async function drawSignalMarkers(series) {
      try {
        const r = await fetch(`/signals/${SYMBOL}?limit=200&interval=${INTERVAL}`);
        if (!r.ok) return;
        const signals = (await r.json()).data.signals;
        const markers = signals.map((s) => ({
          time: barTime(s.signal_timestamp),
          position: s.direction === "up" ? "belowBar" : "aboveBar",
          shape: s.direction === "up" ? "arrowUp" : "arrowDown",
          color: _OUTCOME_COLOR[s.outcome] || "#787b86",   // pending -> grey
          text: `p=${s.probability.toFixed(2)}`,
        }));
        // Lightweight Charts requires markers sorted ascending by time.
        markers.sort((a, b) => (a.time > b.time ? 1 : a.time < b.time ? -1 : 0));
        series.setMarkers(markers);
      } catch (e) { /* markers are enrichment; the chart stands without them */ }
    }

    function watchLive(series) {
      const source = new EventSource(
        `/stream/bars/${SYMBOL}?interval=${INTERVAL}`
      );
      source.onmessage = (event) => {
        const bar = JSON.parse(event.data);
        series.update(toCandle(bar));
        status.textContent =
          `Live · last ${INTERVAL} bar ${bar.timestamp} close ${bar.close}`;
        drawSignalMarkers(series);   // recolor as calls resolve, same cadence
      };
      source.onerror = () => {
        status.textContent = "Live stream reconnecting…";
      };
    }

    async function draw() {
      const response = await fetch(
        `/bars/${SYMBOL}?limit=250&interval=${INTERVAL}`
      );
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        status.textContent =
          body.message || `No stored bars for ${SYMBOL} (HTTP ${response.status})`;
        return;
      }
      const { data } = await response.json();
      const candles = data.bars.map(toCandle);

      const chart = LightweightCharts.createChart(
        document.getElementById("chart"),
        {
          layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
          grid: {
            vertLines: { color: "#1e222d" },
            horzLines: { color: "#1e222d" },
          },
          autoSize: true,
          timeScale: { timeVisible: INTERVAL !== "1d" },
        }
      );
      const series = chart.addCandlestickSeries();
      series.setData(candles);
      chart.timeScale().fitContent();
      status.textContent = `${data.count} ${INTERVAL} bars from Postgres`;
      drawSignalMarkers(series);
      watchLive(series);
    }

    draw().catch((err) => { status.textContent = `Failed to load: ${err}`; });
  </script>
</body>
</html>
