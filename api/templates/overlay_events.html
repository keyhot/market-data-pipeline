<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Events — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    __TIER_STYLES__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    #feed { display: flex; flex-direction: column; gap: 0.5rem;
            padding: 1rem; max-width: 480px; }
    .event { display: flex; gap: 0.6rem; align-items: flex-start;
             padding: 0.5rem 0.7rem; background: #1e222d; border-radius: 6px;
             border-left: 4px solid var(--muted); }
    /* The border carries the severity tier (category); the injected .tier-*
       ramp carries the swell (glow/scale/opacity/weight, eased). */
    .event.tier-0 { border-left-color: var(--neutral); }
    .event.tier-1 { border-left-color: var(--accent); }
    .event.tier-2 { border-left-color: var(--accent); }
    .event.tier-3 { border-left-color: var(--down); }
    .body { display: flex; flex-direction: column; gap: 0.1rem; }
    .headline { font-size: 0.9rem; }
    .meta { color: var(--neutral); font-size: 0.72rem; }
    .event.fresh { animation: pop 0.6s ease-out; }
    @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  </style>
</head>
<body>
  <div id="feed"></div>
  <script>
    const feed = document.getElementById("feed");
    const MAX_ROWS = 20;

    // Severity -> tier (0 calm .. 3 dramatic), matching the world canvas and
    // world/state bands. The tier class drives both the border (category) and
    // the shared .tier-* swell ramp (glow/scale/opacity/weight).
    // Injected from world.state, never restated: severity is rule-specific, so
    // an absolute scale here disagreed with the server about how big an event
    // is and rendered every `signal_resolved` as tier 0 — the rail's most
    // common row, permanently in its calmest colour.
    const TIER_CUTS = __TIER_CUTS_JSON__;

    function tierOf(eventType, severity) {
      const cuts = TIER_CUTS.cuts[eventType] ?? TIER_CUTS.generic;
      return cuts.reduce((tier, cut) => tier + (severity >= cut ? 1 : 0), 0);
    }

    const HEADLINES = {
      big_move: (e) => `${e.symbol} big move — ${e.payload.sigmas?.toFixed(1)}σ bar`,
      volatility_spike: (e) => `${e.symbol} volatility spike — ${e.payload.ratio?.toFixed(1)}× calm`,
      gap_open: (e) => `${e.symbol} gap open — ${(e.payload.gap * 100).toFixed(2)}%`,
      volume_anomaly: (e) => `${e.symbol} volume anomaly — ${e.payload.volume_zscore?.toFixed(1)}σ`,
      streak: (e) => `${e.symbol} ${e.payload.direction} streak — ${e.payload.bars} bars`,
      signal_resolved: (e) => `model ${e.payload.outcome === "win" ? "won" : "lost"} on ${e.symbol}` +
        ` (called ${e.payload.direction} p=${e.payload.probability?.toFixed(2)})`,
      model_losing_streak: (e) => `model on a ${e.payload.streak}-loss streak (${e.symbol})`,
      stream_started: (e) => e.payload.recovery_seconds != null
        ? `stream back — recovered in ${Math.round(e.payload.recovery_seconds)}s`
        : "stream went live",
      stream_stopped: (e) => "stream stopped",
      stream_dropped: (e) => "stream dropped — recovering",
      trader_opened: (e) => e.payload.baseline
        ? `trader already holding ${e.payload.pair ?? "a position"}`
        : `trader opened ${e.payload.pair ?? "a position"}`,
      trader_closed: (e) => `trader closed ${e.payload.pair ?? "a position"} — ` +
        `${e.payload.profit_pct?.toFixed(2)}%`,
      trader_milestone: (e) => `trader P&L now ${e.payload.profit_pct?.toFixed(2)}%`,
      scene_switched: (e) => `— now showing ${e.payload.scene ?? "the world"} —`,
      commentary_spoken: (e) => `${e.payload.character ?? "someone"}: ${e.payload.text ?? ""}`,
      broadcast_created: (e) => "new broadcast prepared",
      broadcast_live: (e) => "we're live on YouTube",
      broadcast_ended: (e) => "broadcast ended — starting a new one",
    };

    function headline(e) {
      const fn = HEADLINES[e.event_type];
      try { return fn ? fn(e) : `${e.symbol || "market"} ${e.event_type}`; }
      catch { return `${e.symbol || "market"} ${e.event_type}`; }
    }

    function relTime(iso) {
      const secs = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
      if (secs < 90) return `${Math.round(secs)}s ago`;
      if (secs < 5400) return `${Math.round(secs / 60)}m ago`;
      return `${Math.round(secs / 3600)}h ago`;
    }

    function addEvent(e, fresh) {
      const row = document.createElement("div");
      row.className =
        `event tier tier-${tierOf(e.event_type, e.severity)}` + (fresh ? " fresh" : "");
      const body = document.createElement("div");
      body.className = "body";
      const head = document.createElement("div");
      head.className = "headline";
      head.textContent = headline(e);           /* textContent: payloads are data */
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent =
        `${e.event_type} · severity ${e.severity.toFixed(1)} · ${relTime(e.occurred_at)}`;
      body.append(head, meta);
      row.appendChild(body);
      feed.prepend(row);
      while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
    }

    async function initial() {
      const response = await fetch("/world/events?limit=20");
      if (!response.ok) return;
      const { data } = await response.json();
      data.events.slice().reverse().forEach((e) => addEvent(e, false));
    }

    initial().then(() => {
      const source = new EventSource("/stream/world/events");
      source.onmessage = (event) => addEvent(JSON.parse(event.data), true);
    });
  </script>
</body>
</html>
