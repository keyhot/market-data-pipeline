<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Events — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    __TIER_STYLES__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    /* Mounted at 480x960 (chart-focus) and 960x1080 (event-focus): the rail
       fills whatever source OBS gives it rather than a width picked for one. */
    /* OBS injects `body { background-color: rgba(0,0,0,0) }` into every
       browser source, so the page's own body background never reaches the
       stream — the rail carries its own surface. That is also what keeps it
       readable where it deliberately overlaps the chart: before this, live
       candles ran through the words. */
    #rail { display: flex; flex-direction: column; height: 100vh;
            box-sizing: border-box; padding: 0.9rem 1rem; gap: 0.8rem;
            background: var(--bg); }
    /* Newcomer legibility: a viewer who arrives mid-stream otherwise sees a
       column of rows with nothing naming what they are. */
    #legend { display: flex; align-items: baseline; gap: 0.6rem;
              border-bottom: 1px solid var(--muted); padding-bottom: 0.5rem; }
    #legend h1 { margin: 0; font-size: 1rem; font-weight: 600;
                 letter-spacing: 0.14em; text-transform: uppercase; }
    #legend p { margin: 0; color: var(--neutral); font-size: 0.82rem; }
    #feed { display: flex; flex-direction: column; gap: 0.45rem;
            width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    /* Sized to `100% / max-scale`, because the injected `.tier` ramp scales a
       row from `left center` and `transform` does not reflow: a full-width
       card at tier 3 rendered 22% wider than the rail and the overflow was
       clipped by the frame — `model lost on BTCUSDT (called up` cut mid-word
       on air (KI-031). At rest a row is short of the right edge; the biggest
       swell now lands exactly on it, so the rail visibly breathes with
       severity instead of running off the side of the screen. */
    .event { display: flex; gap: 0.6rem; align-items: flex-start;
             box-sizing: border-box; width: calc(100% / var(--tier-max-scale));
             padding: 0.55rem 0.8rem; background: var(--surface);
             border-radius: 7px; border-left: 5px solid var(--muted); }
    /* The border carries the severity tier (category); the injected .tier-*
       ramp carries the swell (glow/scale/opacity/weight, eased). */
    .event.tier-0 { border-left-color: var(--neutral); }
    .event.tier-1 { border-left-color: var(--accent); }
    .event.tier-2 { border-left-color: var(--accent); }
    .event.tier-3 { border-left-color: var(--down); }
    .body { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .headline { font-size: 1.45rem; line-height: 1.2; }
    .meta { color: var(--neutral); font-size: 0.86rem;
            font-variant-numeric: tabular-nums; }
    .age { color: var(--fg); }
    /* Age fade, so the newest row reads first. Deliberately on `color` alone:
       transform / opacity / box-shadow / font-weight belong to the injected
       tier ramp, and a second rule touching those would quietly fight the
       server's own severity signal (KI-019, one surface over). */
    .event.stale .headline { color: var(--neutral); }
    .event.stale .meta, .event.stale .age { color: var(--muted); }
    /* The entry motion rides on the inner element: a keyframe on the row
       itself overrides the tier `transform: scale()` for its whole duration
       (animation beats transition), so the biggest event would arrive at the
       wrong size and snap. */
    .event.quiet { border-left-color: var(--muted); }
    .event.quiet .headline { color: var(--neutral); }
    .event.fresh .body { animation: enter 0.55s cubic-bezier(0.16, 0.84, 0.44, 1); }
    @keyframes enter { from { transform: translateX(-12px); opacity: 0; } }
  </style>
</head>
<body>
  <div id="rail">
    <header id="legend">
      <h1>Live events</h1>
      <p>what the world noticed — newest first</p>
    </header>
    <div id="feed"></div>
  </div>
  <script>
    const feed = document.getElementById("feed");
    // An upper bound on what we keep in the DOM. How many actually *show* is
    // measured below, not guessed: the same rail is mounted 480x840 and
    // 960x1080, headlines wrap at the narrow one and don't at the wide one, so
    // any single number is wrong somewhere — and being wrong here means
    // `overflow: hidden` cutting a row in half with no indication it did.
    const MAX_ROWS = 11;
    const STALE_AFTER_SECONDS = 600;

    // Severity -> tier (0 calm .. 3 dramatic), matching the world canvas and
    // world/state bands. The tier class drives both the border (category) and
    // the shared .tier-* swell ramp (glow/scale/opacity/weight).
    // Injected from world.state, never restated: severity is rule-specific, so
    // an absolute scale here disagreed with the server about how big an event
    // is and rendered every `signal_resolved` as tier 0 — the rail's most
    // common row, permanently in its calmest colour.
    const TIER_CUTS = __TIER_CUTS_JSON__;

    __TIER_OF_JS__

    const HEADLINES = {
      big_move: (e) => `${e.symbol} big move — ${e.payload.sigmas?.toFixed(1)}σ bar`,
      volatility_spike: (e) => `${e.symbol} volatility spike — ${e.payload.ratio?.toFixed(1)}× calm`,
      gap_open: (e) => `${e.symbol} gap open — ${(e.payload.gap * 100).toFixed(2)}%`,
      volume_anomaly: (e) => `${e.symbol} volume anomaly — ${e.payload.volume_zscore?.toFixed(1)}σ`,
      streak: (e) => `${e.symbol} ${e.payload.direction} streak — ${e.payload.bars} bars`,
      signal_resolved: (e) => `model ${e.payload.outcome === "win" ? "won" : "lost"} on ${e.symbol}` +
        ` (called ${e.payload.direction} p=${e.payload.probability?.toFixed(2)})`,
      model_losing_streak: (e) => `model on a ${e.payload.streak}-loss streak (${e.symbol})`,
      stream_started: (e) => e.payload.recovery_seconds != null
        ? `stream back — recovered in ${Math.round(e.payload.recovery_seconds)}s`
        : "stream went live",
      stream_stopped: (e) => "stream stopped",
      stream_dropped: (e) => "stream dropped — recovering",
      trader_opened: (e) => e.payload.baseline
        ? `trader already holding ${e.payload.pair ?? "a position"}`
        : `trader opened ${e.payload.pair ?? "a position"}`,
      trader_closed: (e) => `trader closed ${e.payload.pair ?? "a position"} — ` +
        `${e.payload.profit_pct?.toFixed(2)}%`,
      trader_milestone: (e) => `trader P&L now ${e.payload.profit_pct?.toFixed(2)}%`,
      scene_switched: (e) => `— now showing ${e.payload.scene ?? "the world"} —`,
      commentary_spoken: (e) => `${e.payload.character ?? "someone"}: ${e.payload.text ?? ""}`,
      broadcast_created: (e) => "new broadcast prepared",
      broadcast_live: (e) => "we're live on YouTube",
      broadcast_ended: (e) => "broadcast ended — starting a new one",
    };

    function headline(e) {
      const fn = HEADLINES[e.event_type];
      try { return fn ? fn(e) : `${e.symbol || "market"} ${e.event_type}`; }
      catch { return `${e.symbol || "market"} ${e.event_type}`; }
    }

    function ageSeconds(iso) {
      return Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    }

    function relTime(secs) {
      if (secs < 5) return "just now";
      if (secs < 90) return `${Math.round(secs)}s ago`;
      if (secs < 5400) return `${Math.round(secs / 60)}m ago`;
      if (secs < 172800) return `${Math.round(secs / 3600)}h ago`;
      return `${Math.round(secs / 86400)}d ago`;
    }

    // KI-022. OBS keeps a browser source's page loaded for the life of the
    // process, so an age written once at insert is a lying number within the
    // minute and stays on air for hours. The row carries its own timestamp and
    // ONE timer re-renders every visible age — never a timer per row.
    function refreshAges() {
      for (const row of feed.children) {
        // The note row below has no timestamp and no age span. Without this
        // guard the timer throws every 10s for as long as the rail is in the
        // one state it was added for — an error loop during an outage, which
        // is precisely when someone is reading the logs.
        const age = row.querySelector(".age");
        if (!age || !row.dataset.occurredAt) continue;
        const secs = ageSeconds(row.dataset.occurredAt);
        age.textContent = relTime(secs);
        row.classList.toggle("stale", secs > STALE_AFTER_SECONDS);
      }
    }

    // Drop rows from the bottom until the feed fits its source. Measured with
    // bounding rects rather than scrollHeight because the injected tier ramp
    // scales a row *visually* past its layout box — a swelling bottom row is
    // the one thing scrollHeight cannot see, and the one most worth not
    // slicing in half. Guarded on length so an over-tall row can't empty the
    // rail; the last row is then clipped, which beats an empty feed.
    function overflowsSource() {
      const last = feed.lastElementChild;
      return last &&
        last.getBoundingClientRect().bottom > feed.getBoundingClientRect().bottom;
    }

    function trimToFit() {
      while (feed.children.length > 1 &&
             (feed.children.length > MAX_ROWS || overflowsSource())) {
        feed.lastChild.remove();
      }
    }

    function addEvent(e, fresh) {
      const row = document.createElement("div");
      row.className =
        `event tier tier-${tierOf(e.event_type, e.severity)}` + (fresh ? " fresh" : "");
      row.dataset.occurredAt = e.occurred_at;
      const body = document.createElement("div");
      body.className = "body";
      const head = document.createElement("div");
      head.className = "headline";
      head.textContent = headline(e);           /* textContent: payloads are data */
      const meta = document.createElement("div");
      meta.className = "meta";
      const age = document.createElement("span");
      age.className = "age";
      age.textContent = relTime(ageSeconds(e.occurred_at));
      const rest = document.createElement("span");
      rest.textContent = ` · ${e.event_type} · sev ${e.severity.toFixed(1)}`;
      meta.append(age, rest);
      body.append(head, meta);
      row.appendChild(body);
      feed.prepend(row);
      trimToFit();
    }

    // A rail with nothing in it looks identical whether the world is quiet or
    // the feed is broken, and this is the surface a viewer reads to know the
    // thing is alive. So it says which. Same rule as KI-020 one layer out: the
    // failure has to name itself.
    function note(text) {
      feed.replaceChildren();
      const row = document.createElement("div");
      row.className = "event tier tier-0 quiet";
      const body = document.createElement("div");
      body.className = "body";
      const head = document.createElement("div");
      head.className = "headline";
      head.textContent = text;
      body.appendChild(head);
      row.appendChild(body);
      feed.appendChild(row);
    }

    async function initial() {
      let response;
      try {
        response = await fetch("/world/events?limit=20");
      } catch (err) {
        note("can't reach the world — retrying");
        return;
      }
      if (!response.ok) { note("can't reach the world — retrying"); return; }
      const { data } = await response.json();
      if (!data.events.length) { note("nothing has happened yet"); return; }
      data.events.slice(0, MAX_ROWS).reverse().forEach((e) => addEvent(e, false));
      refreshAges();
      trimToFit();
    }

    // The live feed is opened whatever the backfill did: chaining it to a
    // resolved fetch means one bad response leaves the rail dead until someone
    // notices — and nobody refreshes a browser source that looks merely quiet.
    const source = new EventSource("/stream/world/events");
    source.onmessage = (event) => {
      if (feed.querySelector(".quiet")) feed.replaceChildren();
      addEvent(JSON.parse(event.data), true);
    };

    initial();

    setInterval(refreshAges, 10000);
  </script>
</body>
</html>
