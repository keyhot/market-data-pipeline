<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charts — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #131722; color: #d1d4dc;
           font-family: system-ui, sans-serif; overflow: hidden; }
    /* OBS injects `body { background-color: rgba(0,0,0,0) }` into every browser
       source, so the body rule above never reaches the stream — the grid has to
       paint itself. Until 2026-08-20 it didn't: the 6px padding, the 6px gap
       and the ~28px symbol title row all fell through to the black OBS canvas,
       and the home frame went out with a 34px black bar across its top
       (KI-029). Both overlays already carried this fix; this page never got it. */
    #grid { display: grid; height: 100vh; gap: 6px; padding: 6px; box-sizing: border-box;
            background: #131722;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            grid-auto-rows: 1fr; }   /* rows fill the height so charts get real px */
    .panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .title { padding: 0.2rem 0.5rem; font-size: 1rem; font-weight: 600; color: #d1d4dc; }
    .chart { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script src="/static/lightweight-charts-4.2.0.standalone.js"></script>
  <script>
    const SYMBOLS = __SYMBOLS__;
    const INTERVAL = "__INTERVAL__";
    const _OUTCOME_COLOR = { win: "#26a69a", loss: "#ef5350" };

    function barTime(ts) {
      return INTERVAL === "1d" ? ts.slice(0, 10) : Math.floor(Date.parse(ts) / 1000);
    }
    function toCandle(bar) {
      return { time: barTime(bar.timestamp),
               open: bar.open, high: bar.high, low: bar.low, close: bar.close };
    }

    // The model's calls on each panel: ▲/▼ by direction, grey pending → green
    // win / red loss once resolved. Only calls at or after the first loaded
    // candle: the page loads 250 bars but 200 calls, which reach further back,
    // and Lightweight Charts pins a marker with no bar to the nearest one — so
    // every older call stacked onto the first candle as a column of `p=`
    // labels down the chart's left edge, on air.
    function signalMarkers(signals, firstBarTime) {
      return signals
        .map((s) => ({
          time: barTime(s.signal_timestamp),
          position: s.direction === "up" ? "belowBar" : "aboveBar",
          shape: s.direction === "up" ? "arrowUp" : "arrowDown",
          color: _OUTCOME_COLOR[s.outcome] || "#787b86",
          text: `p=${s.probability.toFixed(2)}`,
        }))
        .filter((m) => m.time >= firstBarTime)
        .sort((a, b) => (a.time > b.time ? 1 : a.time < b.time ? -1 : 0));
    }

    // Enrichment — never breaks the chart.
    async function drawSignalMarkers(symbol, series, firstBarTime) {
      try {
        const r = await fetch(`/signals/${symbol}?limit=200&interval=${INTERVAL}`);
        if (!r.ok) return;
        const signals = (await r.json()).data.signals;
        series.setMarkers(signalMarkers(signals, firstBarTime));
      } catch (e) { /* the chart stands without markers */ }
    }

    async function buildPanel(symbol) {
      const panel = document.createElement("div");
      panel.className = "panel";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = symbol;          /* textContent: data, never markup */
      const chartEl = document.createElement("div");
      chartEl.className = "chart";
      panel.append(title, chartEl);
      document.getElementById("grid").appendChild(panel);

      const r = await fetch(`/bars/${symbol}?limit=250&interval=${INTERVAL}`);
      if (!r.ok) { title.textContent = `${symbol} — no bars`; return; }
      const { data } = await r.json();
      const chart = LightweightCharts.createChart(chartEl, {
        layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
        grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
        autoSize: true, timeScale: { timeVisible: INTERVAL !== "1d" },
      });
      const series = chart.addCandlestickSeries();
      const candles = data.bars.map(toCandle);
      series.setData(candles);
      chart.timeScale().fitContent();
      // Live updates only append, so the first candle stays the first. With no
      // bars at all there is nothing to annotate, and Infinity filters out
      // every marker.
      const firstBarTime = candles.length ? candles[0].time : Infinity;
      drawSignalMarkers(symbol, series, firstBarTime);

      const es = new EventSource(`/stream/bars/${symbol}?interval=${INTERVAL}`);
      es.onmessage = (e) => {
        series.update(toCandle(JSON.parse(e.data)));
        drawSignalMarkers(symbol, series, firstBarTime);
      };
    }

    SYMBOLS.forEach(buildPanel);
  </script>
</body>
</html>
