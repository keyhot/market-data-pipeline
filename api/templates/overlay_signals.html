<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signals — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    /* 120px tall, mounted 1920 wide twice and 960 wide once: the cells share
       whatever width is left after the label, so a third predict symbol
       narrows the strip instead of silently overflowing it. */
    /* Same reason as the rail: OBS drops the body background, so the band
       paints its own — a lower third has to sit on something. */
    #strip { display: flex; gap: 1.6rem; align-items: center; height: 120px;
             box-sizing: border-box; padding: 0 1.5rem; background: var(--bg); }
    #label { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0.15rem;
             border-right: 1px solid var(--muted); padding-right: 1.4rem; }
    #label .kicker { font-size: 1rem; font-weight: 600; letter-spacing: 0.14em;
                     text-transform: uppercase; }
    #label .sub { color: var(--neutral); font-size: 0.8rem; }
    .cell { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
            gap: 0.35rem; container-type: inline-size; }
    .row1 { display: flex; align-items: baseline; gap: 0.65rem; }
    .row2 { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
    .sym { font-weight: 700; font-size: 1.55rem; letter-spacing: 0.01em; }
    .dir { font-size: 1.35rem; }
    .dir-up { color: var(--up); } .dir-down { color: var(--down); }
    .prob { color: var(--neutral); font-size: 1.05rem;
            font-variant-numeric: tabular-nums; }
    .dots { display: flex; gap: 5px; flex: 0 0 auto; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
    .dot.win { background: var(--up); } .dot.loss { background: var(--down); }
    /* The dots are the model's record and nothing on screen said so. */
    .dotlabel { color: var(--muted); font-size: 0.78rem; white-space: nowrap;
                flex: 0 1 auto; min-width: 0; overflow: hidden; }
    .stats { color: var(--neutral); font-size: 0.92rem; white-space: nowrap;
             flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis;
             font-variant-numeric: tabular-nums; }
    /* event-focus mounts this strip at 960 instead of 1920, and at that width
       the row ran out of room and ellipsised the END of it — dropping the hit
       rate, the one number on this strip that is the whole point, to keep a
       caption. The caption goes first instead. */
    @container (max-width: 430px) {
      .dotlabel { display: none; }
      .dots { gap: 4px; }
      .dot { width: 11px; height: 11px; }
      .stats { font-size: 0.86rem; }
    }
    /* A resolution is the one moment this strip changes; without it the dots
       just differ between two glances. One dot, once — never a strip-wide flash. */
    .dot.settled { animation: settle 1.1s ease-out; }
    @keyframes settle { from { transform: scale(2.1); } }
    .note { position: fixed; right: 1rem; bottom: 0.3rem; color: var(--muted);
            font-size: 0.7rem; }
    /* Now playing. Sits at the right end of the strip, which is the one band
       on air in all three live scenes — so the credit rides along instead of
       costing three more browser sources (KI-013: they all share one Chromium
       and six connections per origin). Fixed width so a long title cannot
       squeeze the model cells, which are the point of the strip. */
    /* order, not DOM position: the model cells are appended to #strip at
       runtime, so without this the credit would sit between the label and the
       symbols instead of at the far end. */
    #np { order: 99; flex: 0 0 auto; display: none; align-items: center; gap: 0.55rem;
          max-width: 250px; padding-left: 1.2rem; margin-right: 0.5rem;
          /* Lifts the credit clear of the simulation disclaimer pinned to the
             bottom-right; touching, they read as one sentence about the music. */
          margin-bottom: 1.1rem;
          border-left: 1px solid var(--muted); }
    #np.on { display: flex; }
    #np .ico { font-size: 1.15rem; color: var(--neutral); flex: 0 0 auto; }
    #np .lines { min-width: 0; display: flex; flex-direction: column;
                 gap: 0.1rem; }
    #np .t, #np .a { overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
    #np .t { font-size: 0.9rem; font-weight: 600; }
    #np .a { font-size: 0.78rem; color: var(--neutral); }
    #np .k { font-size: 0.62rem; letter-spacing: 0.12em; color: var(--muted);
             text-transform: uppercase; }
    /* event-focus mounts this strip at 960: keep the credit (it is the whole
       reason this element exists) but give it less room. */
    @media (max-width: 1000px) {
      #np { max-width: 170px; padding-left: 0.8rem; }
      #np .k { display: none; }
    }
  </style>
</head>
<body>
  <div id="strip">
    <div id="label">
      <span class="kicker">Model calls</span>
      <span class="sub">live predictions, scored on the close</span>
    </div>
    <div id="np">
      <span class="ico">&#9835;</span>
      <div class="lines">
        <span class="k">Now playing</span>
        <span class="t" id="np-title"></span>
        <span class="a" id="np-artist"></span>
      </div>
    </div>
  </div>
  <p class="note">signal-based simulation — not broker P&amp;L</p>
  <script>
    const SYMBOLS = __SYMBOLS__;
    const strip = document.getElementById("strip");
    const cells = {};

    function makeCell(symbol) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const row1 = document.createElement("div");
      row1.className = "row1";
      const sym = document.createElement("span");
      sym.className = "sym";
      sym.textContent = symbol;
      const dir = document.createElement("span");
      dir.className = "dir";
      const prob = document.createElement("span");
      prob.className = "prob";
      row1.append(sym, dir, prob);
      const row2 = document.createElement("div");
      row2.className = "row2";
      const dots = document.createElement("div");
      dots.className = "dots";
      for (let i = 0; i < 10; i++) {
        const d = document.createElement("span");
        d.className = "dot";
        dots.appendChild(d);
      }
      const dotlabel = document.createElement("span");
      dotlabel.className = "dotlabel";
      dotlabel.textContent = "last 10 resolved";
      const stats = document.createElement("div");
      stats.className = "stats";
      row2.append(dots, dotlabel, stats);
      cell.append(row1, row2);
      strip.appendChild(cell);
      cells[symbol] = { dir, prob, dots, stats };
      return cells[symbol];
    }

    function render(symbol, data, settled) {
      const cell = cells[symbol] || makeCell(symbol);
      const latest = data.signals[0];
      if (latest) {
        cell.dir.textContent = latest.direction === "up" ? "▲" : "▼";
        cell.dir.className = "dir " + (latest.direction === "up" ? "dir-up" : "dir-down");
        cell.prob.textContent = "p=" + latest.probability.toFixed(2);
      }
      const resolved = data.signals.filter(s => s.outcome).slice(0, 10);
      const dots = cell.dots.children;
      for (let i = 0; i < 10; i++) {
        dots[i].className = "dot" +
          (resolved[i] ? " " + resolved[i].outcome : "");
      }
      if (settled && resolved[0]) dots[0].classList.add("settled");
      const acc = data.accuracy;
      cell.stats.textContent = acc.resolved
        ? `hit ${(acc.hit_rate * 100).toFixed(0)}% of ${acc.resolved}` +
          ` · streak ${acc.current_streak} ${acc.streak_outcome}`
        : "no resolved signals yet";
    }

    async function refresh(symbol, settled) {
      const response = await fetch(`/signals/${symbol}?limit=30`);
      if (!response.ok) { makeCell(symbol).stats.textContent = "no signals yet"; return; }
      const { data } = await response.json();
      render(symbol, data, settled);
    }

    SYMBOLS.forEach((symbol) => refresh(symbol, false));

    // The music credit. Polled, not an EventSource: this strip already holds
    // the page's one SSE connection open for signal resolutions, and a track
    // changes about every 90 seconds — a 15s poll is well inside the budget
    // and costs no persistent connection.
    const np = document.getElementById("np");
    const npTitle = document.getElementById("np-title");
    const npArtist = document.getElementById("np-artist");

    async function refreshNowPlaying() {
      try {
        const response = await fetch("/music/now-playing");
        if (!response.ok) { np.classList.remove("on"); return; }
        const { data } = await response.json();
        // No bed running is a legitimate state, not an error: show nothing
        // rather than a stale or empty credit.
        if (!data || !data.playing) { np.classList.remove("on"); return; }
        npTitle.textContent = data.playing.title;
        npArtist.textContent = data.playing.artist;
        np.classList.add("on");
      } catch (err) {
        np.classList.remove("on");
      }
    }

    refreshNowPlaying();
    setInterval(refreshNowPlaying, 15000);

    const source = new EventSource("/stream/world/events");
    source.onmessage = (event) => {
      const worldEvent = JSON.parse(event.data);
      if (worldEvent.event_type === "signal_resolved" &&
          SYMBOLS.includes(worldEvent.symbol)) {
        refresh(worldEvent.symbol, true);
      }
    };
  </script>
</body>
</html>
