<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The World — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    #room { width: 100vw; height: 100vh; }
    #fallback { position: absolute; top: 3rem; left: 1rem; color: var(--neutral);
                font-size: 0.85rem; }
    /* Newcomer legibility: an always-present line naming what this is. */
    #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
              padding: 0.55rem 1rem; background: rgba(19, 23, 34, 0.72);
              color: var(--fg); font-size: 0.9rem; letter-spacing: 0.01em;
              pointer-events: none; }
    #banner-syms { color: var(--accent); font-weight: 600; }
    #banner .tag { color: var(--neutral); }

    /* B5 — the stream has no audio, so a spoken line only exists if it can be
       READ. Bubbles sit above the floor line, left of the room, and stack
       upward so the newest is nearest the characters. DOM rather than canvas
       text: it is the surface OBS is most reliable with, and it stays crisp
       at any bitrate. */
    #speech { position: absolute; left: 3.5rem; bottom: 21rem; z-index: 3;
              display: flex; flex-direction: column-reverse; gap: 0.5rem;
              max-width: 34rem; pointer-events: none; }
    .bubble { background: rgba(19, 23, 34, 0.9); border-left: 3px solid var(--neutral);
              border-radius: 0.35rem; padding: 0.5rem 0.75rem;
              font-size: 1.05rem; line-height: 1.35;
              opacity: 0; transform: translateY(6px);
              transition: opacity 320ms ease, transform 320ms ease; }
    .bubble.in { opacity: 1; transform: translateY(0); }
    .bubble .who { display: block; font-size: 0.72rem; letter-spacing: 0.08em;
                   text-transform: uppercase; margin-bottom: 0.15rem; }
    .bubble .said { color: var(--fg); }

    /* B9 — the always-on band. A newcomer arriving mid-calm sees no events at
       all, so the room has to answer "what is this and how is it going?"
       without waiting for one to fire. Bottom-pinned, quiet, permanent. */
    #nowband { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
               display: flex; align-items: baseline; gap: 1.75rem;
               padding: 0.5rem 1.25rem;
               background: linear-gradient(to top, rgba(19,23,34,0.92), rgba(19,23,34,0));
               font-size: 0.95rem; pointer-events: none; }
    #nowband .sym { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
    #nowband .px { color: var(--fg); font-variant-numeric: tabular-nums; }
    #nowband .mood { color: var(--neutral); }
    #nowband .record { margin-left: auto; color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .record b { color: var(--fg); font-weight: 600; }
  </style>
</head>
<body>
  <div id="banner"><span id="banner-syms"></span><span class="tag">a model
    trades live, and the world remembers when it's wrong</span></div>
  <div id="room"></div>
  <div id="speech"></div>
  <div id="nowband"></div>
  <div id="fallback">Waking the world…</div>
  <script src="https://unpkg.com/pixi.js@8.19.0/dist/pixi.min.js"
          integrity="sha384-brfu63ZHzOfumoqQXzA4Wo7k9kQOaJ68C/E7+Uc8lgQB42dOOjA+urOyy/sOnKPq"
          crossorigin="anonymous"></script>
  <script>
    const SYMBOLS = __SYMBOLS__;
    const fallback = document.getElementById("fallback");

    // Name the room for a newcomer: the symbols in play + the one-line premise.
    document.getElementById("banner-syms").textContent =
      SYMBOLS.map((s) => s.replace(/USDT$/, "")).join(" · ") + " — ";

    // The mood -> colour map is injected from world/visuals.MOOD_COLORS (hex
    // strings) so this canvas and the DOM overlays share ONE palette; drift
    // between them was the old failure. Unknown moods stay grey rather than
    // throwing, so a new salience rule degrades quietly on screen.
    const MOOD_COLOR = __MOOD_COLORS_JSON__;
    const NEUTRAL = 0x787b86;
    const color = (mood) => {
      const hex = MOOD_COLOR[mood];
      return hex ? parseInt(hex.slice(1), 16) : NEUTRAL;
    };

    // Shared severity -> tier bands (mirror the overlay + world/state tiers) so
    // the "swell" reads the same on every surface: tier 0 barely stirs, tier 3
    // leaps. This is the calm-that-swells register in motion.
    function tierOf(severity) {
      if (severity >= 8) return 3;
      if (severity >= 5) return 2;
      if (severity >= 2) return 1;
      return 0;
    }

    // Declared here, constructed in boot(): character() needs app.screen and
    // the layer containers, neither of which exist until PIXI has initialised.
    let app, layers = {}, world = null, model = null, trader = null;

    async function boot() {
      if (typeof PIXI === "undefined") {
        fallback.textContent = "renderer unavailable — the world is still running";
        return;
      }
      app = new PIXI.Application();
      await app.init({ background: 0x131722, resizeTo: window, antialias: true });
      document.getElementById("room").appendChild(app.canvas);
      fallback.textContent = "";

      layers.room = new PIXI.Container();
      layers.chars = new PIXI.Container();
      layers.props = new PIXI.Container();
      app.stage.addChild(layers.room, layers.props, layers.chars);

      drawRoom();
      model = character("MODEL");
      trader = character("TRADER");
      cast.push(model, trader);
      positionCharacters();
      startAmbient();

      // B1 evaluation gate: `?gallery=1` lays out both styles against every
      // mood so the options can be compared in one screenshot. Aesthetics is
      // the thing no assertion grades, so it needs to be *lookable*.
      if (new URLSearchParams(location.search).get("gallery") === "1") {
        drawGallery();
        return;
      }
      // `?anims=1` — the other half of the eval gate, and the half that was
      // missing: sixteen named animations shipped without anyone ever seeing
      // one. Every animation, on both cast bodies, looping. LOCAL ONLY — 32
      // characters ticking is not something to point a browser source at.
      if (new URLSearchParams(location.search).get("anims")) {
        drawAnimationSheet();
        return;
      }

      await refresh();
      subscribe();
      setInterval(refresh, 60000);   // projection stays authoritative server-side
    }

    function drawGallery() {
      model.container.visible = false;
      trader.container.visible = false;
      layers.room.visible = false;   // the floor line is scenery, not a specimen
      layers.chars.scale.set(1);     // the gallery does its own fitting
      // A representative spread rather than all 23 moods: every style compared
      // across the emotional range they actually have to carry.
      const moods = ["elated", "focused", "anxious", "dejected", "idle",
                     "startled", "bullish", "bearish"];
      // Derive the pitch instead of hard-coding it: at a fixed one, adding the
      // fifth style pushed it off the bottom of the canvas, and an option that
      // can't be seen is an option that never gets evaluated.
      const top = 56;                                    // clear the banner
      const rowH = (app.screen.height - top) / STYLES.length;
      const colW = app.screen.width / moods.length;
      // A sample is ~220 units tall above its feet (the mood tag) and ~60
      // below (name + style), so 320 per row leaves a margin at any height.
      const fit = Math.min(1, rowH / 320, colW / 200);
      STYLES.forEach((style, row) => {
        moods.forEach((mood, col) => {
          const sample = character(mood, style);
          sample.container.scale.set(fit);
          sample.container.x = colW * (col + 0.5);
          sample.container.y = top + rowH * row + 220 * fit;
          sample.baseX = sample.container.x;
          sample.baseY = sample.container.y;
          sample.headBaseY = sample.head.y;
          setExpression(sample, mood);
          sample.moodTag.text = mood;
          sample.stat.text = style;
        });
      });
    }

    // Sixteen animations went live without anyone seeing one: a still frame
    // can't show motion, and three of them (wave, shake, flicker) are at or
    // near zero displacement at any phase you'd think to freeze. So the sheet
    // LOOPS them, through `advanceCharacters` — a sheet with its own player
    // would be showing me an animation nobody ships.
    function drawAnimationSheet() {
      model.container.visible = false;
      trader.container.visible = false;
      layers.room.visible = false;
      // Deliberately not the gallery's scale-1: `slump` moves a head 13.5px,
      // and whether that reads as dejected or as a head in a torso is a
      // question about broadcast size. Tier-3 amplitude, for the same reason.
      layers.chars.scale.set(CAST_SCALE);
      const amp = 0.6 + 3 * 0.25;
      // `?anims=slump` narrows to one animation across every body — iterating
      // on a single pose against 32 looping cells is how you miss things.
      const only = new URLSearchParams(location.search).get("anims");
      const names = ANIM[only] ? [only] : Object.keys(ANIM);
      const bodies = ANIM[only] ? STYLES : [CAST.MODEL, CAST.TRADER];
      const total = names.length * bodies.length;
      const cellW = 250;
      const cols = Math.max(1, Math.floor(app.screen.width / cellW));
      const rows = Math.ceil(total / cols);
      // A cell shorter than this overlaps its neighbour's labels. The sheet is
      // a local page, so it runs off the bottom of a short window rather than
      // shrinking the thing whose size is the question.
      const rowH = Math.max(330, (app.screen.height - 40) / rows);
      names.forEach((name, i) => {
        bodies.forEach((style, b) => {
          const idx = i * bodies.length + b;
          const sample = character(style, style);
          sample.container.x = cellW * ((idx % cols) + 0.5) / CAST_SCALE;
          sample.container.y =
            (40 + rowH * Math.floor(idx / cols) + rowH * 0.86) / CAST_SCALE;
          sample.baseX = sample.container.x;
          sample.baseY = sample.container.y;
          sample.headBaseY = sample.head.y;
          setExpression(sample, "focused");
          sample.moodTag.text = name;
          sample.stat.text = "";
          sample.loopAnim = name;
          sample.amp = amp;
          sample.duration = ANIM_DURATION[name] ?? 0.9;
          sample.phase = (idx * 0.13) % 1;   // stagger, so it isn't a chorus line
          cast.push(sample);
        });
      });
    }

    function label(text, x, y, size, tint) {
      const t = new PIXI.Text({ text, style: {
        fill: tint ?? 0xd1d4dc, fontFamily: "system-ui", fontSize: size,
      }});
      t.x = x; t.y = y;
      return t;
    }

    let floorLine;

    function drawRoom() {
      floorLine = new PIXI.Graphics();
      layers.room.addChild(floorLine);
      layoutRoom();
    }

    // The renderer follows the window (`resizeTo`), and the characters are
    // re-placed on every draw — so a floor drawn once at boot drifts off them
    // and they end up standing through it. Same expression, same moment.
    function layoutRoom() {
      if (!floorLine) return;
      floorLine.clear()
        .rect(0, app.screen.height * GROUND, app.screen.width, 3)
        .fill(0x2a2e39);
    }

    // --- B1: procedural characters ----------------------------------------
    // The inhabitants were colour-swatch circles: the room had a mood but no
    // face, and reactions.py's named animations (jolt/shake/hop/…) existed only
    // as strings. Both are real now. Procedural geometry only — no external
    // assets, so the CSP/SRI rule holds and there is no asset pipeline.
    const REACTIONS = __REACTIONS_JSON__;
    // The bodies are built from the market's own glyphs rather than from
    // anatomy. This world is made of price data; its inhabitants should be
    // too — and a candle or a bar cluster still reads at 120px on a stream,
    // where limbs turn to mush. The face is identical across all of them.
    const STYLES = ["bars", "figure", "candle", "monolith", "orb"];
    // The pick (2026-08-12). Not one style for everyone: the MODEL is a machine
    // built out of the market's own glyphs, the TRADER is a person. Two events
    // land on two silhouettes you can tell apart at a glance and across the
    // room — which is what makes "they disagreed" legible without labels.
    const CAST = { MODEL: "bars", TRADER: "figure" };
    // `?style=` overrides the whole cast — it exists for evaluation, so it has
    // to be able to put everyone in the same body for comparison.
    const STYLE_OVERRIDE = new URLSearchParams(location.search).get("style");

    // Where the floor is, and how big the cast stands on it. Both were spelled
    // 0.72 in three places, which is how the floor and its inhabitants came
    // apart in the first place.
    const GROUND = 0.66;
    // The pair read as two small icons on a wide dark plane — about a quarter
    // of the frame, which on a phone-sized YouTube window is nothing. The
    // LAYER carries the scale, not the characters: half the named animations
    // set `container.scale` themselves and would clobber a per-character one.
    const CAST_SCALE = 1.35;

    function styleFor(name) {
      const style = STYLE_OVERRIDE || CAST[name];
      return BODIES[style] ? style : "bars";
    }

    // Expression as two axes rather than 19 hand-drawn faces: valence bends
    // the mouth, arousal opens the eyes and lifts the brows. Every mood the
    // reactions registry can emit has an entry (page test enforces it); an
    // unknown one lands on neutral rather than a blank stare.
    const FACE = {
      elated:    { valence:  1.0, arousal: 0.9 },
      relieved:  { valence:  0.7, arousal: 0.2 },
      proud:     { valence:  0.8, arousal: 0.5 },
      eager:     { valence:  0.7, arousal: 0.8 },
      decisive:  { valence:  0.4, arousal: 0.7 },
      focused:   { valence:  0.0, arousal: 0.6 },
      attentive: { valence:  0.1, arousal: 0.5 },
      speaking:  { valence:  0.2, arousal: 0.5 },
      weighing:  { valence: -0.1, arousal: 0.3 },
      idle:      { valence:  0.0, arousal: 0.0 },
      neutral:   { valence:  0.0, arousal: 0.3 },
      surprised: { valence:  0.2, arousal: 1.0 },
      startled:  { valence: -0.2, arousal: 1.0 },
      alert:     { valence:  0.0, arousal: 0.9 },
      anxious:   { valence: -0.5, arousal: 0.8 },
      alarmed:   { valence: -0.7, arousal: 1.0 },
      resigned:  { valence: -0.4, arousal: 0.1 },
      dejected:  { valence: -0.9, arousal: 0.2 },
      grim:      { valence: -0.8, arousal: 0.4 },
      calm:      { valence:  0.1, arousal: 0.2 },
      bullish:   { valence:  0.8, arousal: 0.6 },
      bearish:   { valence: -0.8, arousal: 0.6 },
      panicked:  { valence: -1.0, arousal: 1.0 },
    };

    function faceFor(mood) {
      return FACE[mood] ?? FACE.neutral;
    }

    // Each body is a market glyph. `accents` are the parts that can move
    // independently of the mass — wicks, bars — which is what gives these
    // silhouettes something to act with in place of limbs.
    const BODIES = {
      // A candlestick: real body between two wicks. The project's own glyph,
      // and the one that reads most instantly as "this thing is the market".
      candle(body, accents) {
        body.roundRect(-27, -104, 54, 84, 8).fill(0x545862);
        // Wick thick enough to read as a neck at stream distance, and short
        // enough that the head sits ON the candle rather than floating over it.
        const wickTop = new PIXI.Graphics().roundRect(-3.5, -130, 7, 30, 3.5)
          .fill(0x545862);
        const wickLow = new PIXI.Graphics().roundRect(-3.5, -22, 7, 26, 3.5)
          .fill(0x545862);
        // A wick flicks by lengthening. It cannot swing: it's drawn in the
        // character's own space, so rotating it pivots about the feet.
        wickTop.gestureMode = wickLow.gestureMode = "pump";
        accents.push(wickTop, wickLow);
        return -142;
      },
      // A cluster of bars — volume, an equaliser, a heartbeat. The most
      // animatable body: the bars themselves can jump, ripple and settle.
      bars(body, accents) {
        const heights = [54, 86, 68, 96, 60];
        heights.forEach((h, i) => {
          const bar = new PIXI.Graphics()
            .roundRect(-6, -h, 12, h, 4).fill(0x545862);
          bar.x = -36 + i * 18;
          bar.restHeight = h;
          bar.gestureMode = "pump";   // the ripple IS the gesture for a cluster
          accents.push(bar);
        });
        // A static stem, so the head isn't left hovering over the cluster the
        // way it was. It can't be one of the bars: those ripple, and a neck
        // that stretches would pull the face off the body.
        body.roundRect(-6, -118, 12, 58, 6).fill(0x545862);
        return -138;
      },
      // A weighted column — deliberate, unhurried, hard to topple. The calm
      // end of the register; a piece that looks like it is thinking.
      monolith(body, accents) {
        body.roundRect(-26, -104, 52, 78, 20).fill(0x545862);
        const base = new PIXI.Graphics()
          .roundRect(-38, -30, 76, 30, 14).fill(0x545862);
        base.gestureMode = "shift";   // a weighted column doesn't wave, it leans
        base.restX = 0;
        accents.push(base);
        return -134;
      },
      // A person: torso, two legs, two arms. The one body here that is NOT a
      // market glyph, and that is the point — the trader is the human in the
      // room, so he doesn't get to be made of candles.
      figure(body, accents) {
        // The gap has to be wide enough to survive the stream: at 6 units the
        // two legs merged into one column and he read as a pedestal.
        body.roundRect(-19, -56, 13, 56, 6).fill(0x545862);
        body.roundRect(6, -56, 13, 56, 6).fill(0x545862);
        // Waist under a broader chest. The taper is what reads as a person —
        // one capsule reads as a pill — and the wider shoulders are what stop
        // the head (28px, shared with every other body) looking oversized.
        body.roundRect(-26, -86, 52, 40, 14).fill(0x545862);
        body.roundRect(-33, -128, 66, 54, 22).fill(0x545862);
        for (const side of [-1, 1]) {
          const arm = new PIXI.Graphics().roundRect(-7, -5, 14, 66, 7)
            .fill(0x545862);
          arm.x = side * 36; arm.y = -120;   // pivot at the shoulder
          // Not quite straight and not quite matching: dead-symmetrical arms
          // read as a mannequin, and the asymmetry costs two numbers.
          arm.restRotation = side < 0 ? -0.05 : 0.09;
          // v1's arms were the torso's exact colour, so a resting figure read
          // as a capsule and the arms only appeared mid-animation. A lighter
          // shade separates them from both the body and the dark room.
          arm.shadeFactor = 1.35;
          accents.push(arm);
        }
        // The head overlaps the torso rather than resting on it: a hairline gap
        // at this size reads as a floating head, not as a neck.
        return -152;
      },
      // The original: face on a single disc, no body. Kept as the baseline the
      // others are judged against.
      orb(body) {
        body.circle(0, -60, 46).fill(0x545862);
        return -66;
      },
    };

    // A machine and a person shouldn't wear the same face. The bodies built
    // out of market glyphs get a readout — visor, LED eyes, a stepped mouth,
    // and no brows, because a brow is a muscle. The figure keeps the human
    // one, and so does the orb, which is a face and nothing else.
    const FACE_KIND = {
      bars: "machine", candle: "machine", monolith: "machine",
      figure: "human", orb: "human",
    };

    // One inhabitant: a body whose colour is its mood, a face that reads at a
    // glance, and a label carrying the numbers.
    function character(name, style) {
      style = BODIES[style] ? style : styleFor(name);
      const container = new PIXI.Container();
      container.y = app.screen.height * GROUND;

      const body = new PIXI.Graphics();
      const head = new PIXI.Container();
      const skull = new PIXI.Graphics();
      const eyeL = new PIXI.Graphics();
      const eyeR = new PIXI.Graphics();
      const mouth = new PIXI.Graphics();
      const browL = new PIXI.Graphics();
      const browR = new PIXI.Graphics();
      const visor = new PIXI.Graphics();
      const accents = [];

      const headY = BODIES[style](body, accents);
      // The orb *is* the face; every other body carries a head above it.
      if (style !== "orb") skull.circle(0, 0, 28).fill(0x545862);
      head.y = headY;
      head.addChild(skull, visor, browL, browR, eyeL, eyeR, mouth);

      const nameTag = label(name, -40, 22, 18);
      const stat = label("", -80, 46, 14, 0x787b86);
      const moodTag = label("", -40, headY - 56, 16, 0x787b86);
      // Accents go behind the mass, so a wick reads as emerging from it.
      container.addChild(...accents, body, head, nameTag, stat, moodTag);
      layers.chars.addChild(container);

      const char = {
        container, body, head, skull, eyeL, eyeR, mouth, browL, browR, visor,
        accents, style, stat, moodTag, faceKind: FACE_KIND[style] ?? "human",
        baseY: container.y, mood: "neutral", anim: null, phase: 0,
      };
      setExpression(char, "neutral");
      restAccents(char);   // arms hang from their resting angle, not from zero
      return char;
    }

    // Limb-less bodies still need a gesture — but not the same one. Rotating a
    // bar about its own base swings it like a felled tree, and at tier-3
    // amplitude the cluster came apart on cheer/wave/shrug; the candle's wicks
    // were worse, pivoting about the character's *feet*. Only what hangs from
    // a joint swings. Everything else pumps or shifts its weight.
    const GESTURE = {
      swing: (a, amt) => { a.rotation = (a.restRotation ?? 0) + amt * 0.35; },
      pump: (a, amt) => { a.scale.y = 1 + Math.abs(amt) * 0.55; },
      shift: (a, amt) => { a.x = (a.restX ?? 0) + amt * 6; },
    };

    function gesture(char, amount, stagger) {
      char.accents.forEach((accent, i) => {
        const offset = stagger ? Math.sin(amount * Math.PI * 2 + i * 0.9) : 1;
        const amt = amount * (i % 2 ? 1 : -1) * (stagger ? offset : 1);
        (GESTURE[accent.gestureMode] ?? GESTURE.swing)(accent, amt);
      });
    }

    function restAccents(char) {
      for (const accent of char.accents) {
        // Rest is not necessarily zero: dead-straight symmetrical arms read as
        // a mannequin, so the figure's hang at a slight, uneven angle.
        accent.rotation = accent.restRotation ?? 0;
        accent.x = accent.restX ?? accent.x;
        accent.scale.set(1, 1);
      }
    }

    // Lighten or darken a mood colour without leaving its hue. Accents that
    // sit ON the body (arms) need to be a different value from it, or they
    // vanish into the mass at stream distance.
    function shade(tint, factor) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
      return (clamp((tint >> 16) & 0xff) << 16)
           | (clamp((tint >> 8) & 0xff) << 8)
           | clamp(tint & 0xff);
    }

    // Nothing in this room should sink into the background. The trader stays
    // dormant until freqtrade events exist, and his dormant colour is nearly
    // the wall — so put a floor under the luminance. This is a rendering
    // decision, not a mood one: the palette is untouched, and a dim character
    // stays dim, it just doesn't disappear.
    function liftDark(tint, floor) {
      const r = (tint >> 16) & 0xff, g = (tint >> 8) & 0xff, b = tint & 0xff;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum >= floor ? tint : shade(tint, floor / Math.max(lum, 0.05));
    }

    // Faces are redrawn rather than tweened: a handful of primitives per mood
    // change is far cheaper than keeping a rig, and OBS renders in software.
    function setExpression(char, mood) {
      char.mood = mood;
      const { valence, arousal } = faceFor(mood);
      const tint = liftDark(color(mood), 0.3);
      char.visor.clear();
      if (char.faceKind === "machine") {
        machineFace(char, valence, arousal, tint);
      } else {
        humanFace(char, valence, arousal);
      }
      applyTint(char, tint);
    }

    // A readout, not an expression: the same two axes, computed. Arousal lights
    // more of the LED; valence steps the mouth. No brows — a brow is a muscle.
    function machineFace(char, valence, arousal, tint) {
      // 0.14, not 0.35: the skull is a 0x545862 fill *tinted*, so it already
      // renders at roughly a third of the mood colour — a 0.35 visor came out
      // the same value as the head and was invisible on the real page.
      char.visor.roundRect(-21, -16, 42, 23, 8).fill(shade(tint, 0.14));
      const lit = 2 + arousal * 5;
      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        eye.roundRect(side * 10 - 6, -5 - lit / 2, 12, lit, 1.5).fill(0xd1d4dc);
      }
      char.browL.clear();
      char.browR.clear();
      const w = 10 + arousal * 3;
      const step = valence * 6;
      char.mouth.clear()
        .moveTo(-w, 12).lineTo(-w / 3, 12 + step)
        .lineTo(w / 3, 12 + step).lineTo(w, 12)
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    function humanFace(char, valence, arousal) {
      const open = 2.2 + arousal * 4.2;            // eyelid opening
      const eyeY = char.style === "orb" ? -4 : -4;
      const dx = char.style === "orb" ? 15 : 10;

      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        if (arousal < 0.08) {
          // Nearly asleep: a closed lid line reads better than a tiny dot.
          eye.roundRect(side * dx - 5, eyeY, 10, 2, 1).fill(0xd1d4dc);
        } else {
          eye.ellipse(side * dx, eyeY, 3.4, open / 2).fill(0xd1d4dc);
        }
      }
      for (const [brow, side] of [[char.browL, -1], [char.browR, 1]]) {
        brow.clear();
        // Worry raises the INNER brow (y grows downward). Positive moods stay
        // level — angling them the other way reads as anger, which is how the
        // first pass made every happy face look stern.
        const worry = valence < 0 ? -valence : 0;
        const lift = arousal * 3;
        const inner = eyeY - 9 - lift - worry * 4;
        const outer = eyeY - 9 - lift + worry * 3;
        brow.moveTo(side * (dx - 7), inner)
            .lineTo(side * (dx + 7), outer)
            .stroke({ width: 2, color: 0x9aa4b2 });
      }
      char.mouth.clear();
      const curve = valence * 7;
      const width = 9 + arousal * 3;
      char.mouth
        .moveTo(-width, 10)
        .quadraticCurveTo(0, 10 + curve, width, 10)
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    function applyTint(char, tint) {
      char.body.tint = tint;
      if (char.skull) char.skull.tint = tint;
      for (const accent of char.accents) {
        accent.tint = accent.shadeFactor ? shade(tint, accent.shadeFactor) : tint;
      }
    }

    // How far `slump` may drop a head, per body. It isn't a style choice: it's
    // how much room the body leaves. The figure's head already overlaps its
    // chest at rest, so the shared 10 buried a third of it and read blobby
    // instead of dejected; the bar cluster has a whole neck to spend.
    const HEAD_TRAVEL = { bars: 12, figure: 4, candle: 8, monolith: 8, orb: 5 };

    // Each named animation from reactions.py, made real. `phase` runs 0->1;
    // every one returns to rest so nothing is ever left sticky-amped.
    const ANIM = {
      idle:    (c, p) => { c.container.y = c.baseY + Math.sin(p * Math.PI * 2) * 2; },
      jolt:    (c, p, a) => { c.container.y = c.baseY - Math.sin(p * Math.PI) * 26 * a;
                              c.container.scale.set(1 + Math.sin(p * Math.PI) * 0.08 * a); },
      shake:   (c, p, a) => { c.container.x = c.baseX + Math.sin(p * 42) * 9 * a * (1 - p); },
      hop:     (c, p, a) => { const j = Math.sin(p * Math.PI);
                              c.container.y = c.baseY - j * 40 * a;
                              c.container.scale.set(1 + j * 0.05 * a, 1 - j * 0.05 * a); },
      pulse:   (c, p, a) => { c.container.scale.set(1 + Math.sin(p * Math.PI * 2) * 0.11 * a); },
      // 0.09, not 0.16: the container pivots at the feet, so a tall body's
      // head swings the full lever arm and 0.16 read as toppling, not leaning.
      lean:    (c, p, a) => { c.container.rotation = Math.sin(p * Math.PI) * 0.09 * a; },
      shrug:   (c, p, a) => { const u = Math.sin(p * Math.PI);
                              gesture(c, u * a, false);
                              c.container.y = c.baseY - u * 6 * a; },
      slump:   (c, p, a) => { const u = Math.sin(p * Math.PI);
                              c.container.y = c.baseY + u * 12 * a;
                              c.head.y = c.headBaseY
                                + u * (HEAD_TRAVEL[c.style] ?? 8) * a;
                              c.container.scale.set(1, 1 - u * 0.07 * a); },
      cheer:   (c, p, a) => { const u = Math.abs(Math.sin(p * Math.PI * 2));
                              c.container.y = c.baseY - u * 30 * a;
                              gesture(c, u * a, true); },
      wave:    (c, p, a) => { gesture(c, Math.sin(p * Math.PI * 6) * 0.6 * a, false);
                              c.head.rotation = Math.sin(p * Math.PI * 6) * 0.10 * a; },
      sleep:   (c, p) => { const b = Math.sin(p * Math.PI * 2) * 0.02;
                           c.container.scale.set(1 + b, 1 - b); },
      flicker: (c, p) => { c.container.alpha = p % 0.25 < 0.125 ? 0.35 : 1; },
      step:    (c, p, a) => { c.container.x = c.baseX + Math.sin(p * Math.PI) * 26 * a; },
      // A flat character can't rotate away, but it must not vanish trying: the
      // old cos() passed through zero twice a cycle and collapsed to a sliver.
      // Squash to 40% and turn the head — that reads as looking round.
      turn:    (c, p, a) => { const u = Math.cos(p * Math.PI * 2);
                              c.container.scale.x = 0.4 + 0.6 * Math.abs(u);
                              c.head.rotation = -u * 0.22 * a; },
      pan:     (c, p, a) => { c.container.x = c.baseX + Math.sin(p * Math.PI) * 10 * a; },
      talk:    (c, p) => { const o = Math.abs(Math.sin(p * Math.PI * 8));
                           c.mouth.scale.y = 1 + o * 1.6;
                           gesture(c, o * 0.25, true); },
    };

    function playAnimation(char, animation, tier) {
      if (!ANIM[animation]) animation = "idle";
      char.anim = animation;
      char.phase = 0;
      // Tier scales amplitude, not choice: the same reaction reads bigger when
      // the event is bigger — calm that swells, on the character itself.
      char.amp = 0.6 + Math.max(0, Math.min(tier, 3)) * 0.25;
      char.duration = (ANIM_DURATION[animation] ?? 0.9);
    }

    const ANIM_DURATION = {
      sleep: 4.0, idle: 3.2, talk: 1.6, wave: 1.4, flicker: 1.0, cheer: 1.2,
    };

    function restCharacter(char) {
      char.container.y = char.baseY;
      char.container.x = char.baseX;
      char.container.rotation = 0;
      char.container.alpha = 1;
      char.container.scale.set(1, 1);
      char.head.rotation = 0;
      char.mouth.scale.y = 1;
      restAccents(char);
      if (char.headBaseY != null) char.head.y = char.headBaseY;
    }

    // The two inhabitants, plus whatever an eval surface has added. A list
    // rather than a hard-coded pair so the animation sheet ticks through the
    // same code path the stream does — a sheet with its own player would be
    // showing me an animation nobody ships.
    const cast = [];

    function advanceCharacters(dt) {
      for (const char of cast) {
        if (!char) continue;
        if (char.loopAnim) {        // eval surface: run one animation forever
          char.phase = (char.phase + dt / char.duration) % 1;
          ANIM[char.loopAnim](char, char.phase, char.amp ?? 1);
          continue;
        }
        if (!char.anim) {           // at rest, breathe so nobody is a statue
          ANIM.idle(char, (ambient.t / 3.2) % 1, 1);
          continue;
        }
        char.phase += dt / char.duration;
        if (char.phase >= 1) {
          char.anim = null;
          restCharacter(char);
          continue;
        }
        ANIM[char.anim](char, char.phase, char.amp ?? 1);
      }
    }

    // Mirrors world/reactions.reaction_for so the canvas and the server agree
    // on what an event means — the registry itself is injected above.
    function reactionFor(event) {
      let entry = REACTIONS.base[event.event_type] ?? REACTIONS.fallback;
      const payload = event.payload ?? {};
      if (event.event_type === "signal_resolved" && REACTIONS.outcomes[payload.outcome]) {
        entry = REACTIONS.outcomes[payload.outcome];
      } else if (event.event_type === "streak" && REACTIONS.directions[payload.direction]) {
        entry = REACTIONS.directions[payload.direction];
      }
      return entry;
    }

    function positionCharacters() {
      layoutRoom();
      layers.chars.scale.set(CAST_SCALE);
      // Positions are therefore in layer space, which the scale then maps back
      // onto the screen fractions they're written as.
      model.container.x = app.screen.width * 0.32 / CAST_SCALE;
      trader.container.x = app.screen.width * 0.62 / CAST_SCALE;
      model.baseY = trader.baseY = app.screen.height * GROUND / CAST_SCALE;
      model.container.y = trader.container.y = model.baseY;
      // Animations displace from a remembered rest pose, so it has to be
      // recorded here — a resize must not leave a character drifting.
      for (const char of [model, trader]) {
        char.baseX = char.container.x;
        char.headBaseY = char.head.y;
      }
    }

    function draw(state) {
      positionCharacters();
      const m = state.model ?? {};
      const mood = m.reaction?.mood ?? "neutral";
      setExpression(model, mood);
      model.moodTag.text = mood;
      // KI-012: show the same last-N-resolved record as the overlay strips
      // (m.accuracy), labelled with its window, so the room and strips agree.
      const acc = m.accuracy ?? {};
      const rate = acc.hit_rate == null ? "—" : `${(acc.hit_rate * 100).toFixed(1)}%`;
      model.stat.text =
        `${acc.wins ?? 0}W ${acc.losses ?? 0}L · ${rate} · last ${acc.window ?? 0}`;

      // The trader stays dormant until trader_* events exist, so the room is
      // complete whether or not the freqtrade sidecar is running.
      const traderState = state.trader ?? null;
      // No sidecar running means asleep, not dead: a closed-eye idle face.
      setExpression(trader, traderState ? traderState.mood : "idle");
      trader.moodTag.text = traderState ? traderState.mood : "";
      trader.stat.text = traderState
        ? `${traderState.open_trades} open · ${traderState.profit_pct}%`
        : "asleep";

      layers.props.removeChildren();
      let y = 24;
      for (const [symbol, data] of Object.entries(state.symbols ?? {})) {
        if (!SYMBOLS.includes(symbol)) continue;
        const height = 12 + Math.abs(data.pressure) * 14;
        const pillar = new PIXI.Graphics()
          .rect(app.screen.width - 220, y, 90, Math.min(height, 90))
          .fill(color(data.mood));
        layers.props.addChild(pillar, label(`${symbol} · ${data.mood}`,
          app.screen.width - 220, y + 96, 14, 0x787b86));
        y += 140;
      }

      const h = state.history ?? {};
      // Sits above the now-band (B9), which owns the bottom strip of the page.
      layers.props.addChild(label(historyLine(h), 24, app.screen.height - 86, 14,
        0x787b86));

      renderNowBand(state);
      readAmbient(state);
    }

    function historyLine(h) {
      if (!h.total_events) return "";
      // "seen" is deliberate: these are folded over the served window, not the
      // whole table. Overstating them would be the one thing this project
      // refuses to do with its own numbers.
      const parts = [`${h.total_events} events remembered`];
      if (h.longest_streak) {
        parts.push(`longest streak seen ${h.longest_streak.bars} bars`);
      }
      if (h.worst_loss) {
        parts.push(
          `worst loss seen ${(h.worst_loss.realized_return * 100).toFixed(2)}%`);
      }
      if (h.outages) parts.push(`${h.outages} outages`);
      return parts.join(" · ");         /* set via .text: payloads are data */
    }

    // --- B6: continuous market-reactive ambient ----------------------------
    // A calm market used to mean a near-frozen frame for the best part of an
    // hour: the room only moved when an event fired. This is the *continuous*
    // half of calm-that-swells — every frame carries a little motion, and its
    // amplitude is market data rather than decoration. Pressure sets the
    // background's colour temperature, agitation sets the drift, and both stay
    // deliberately low-amplitude so quiet reads quiet.
    const ambient = { pressure: 0, agitation: 0, tier: 0, t: 0, drift: [] };
    const DRIFT_COUNT = 26;          // cheap enough for OBS's software renderer
    const BASE_BG = [0x13, 0x17, 0x22];
    const WARM_BG = [0x24, 0x18, 0x1c];   // stress: pressure negative
    const COOL_BG = [0x11, 0x1d, 0x28];   // ease: pressure positive

    function readAmbient(state) {
      const symbols = Object.values(state.symbols ?? {});
      if (!symbols.length) return;
      const mean = (pick) =>
        symbols.reduce((sum, s) => sum + (pick(s) ?? 0), 0) / symbols.length;
      ambient.pressure = mean((s) => s.pressure);
      ambient.agitation = mean((s) => s.agitation);
      ambient.tier = Math.max(...symbols.map((s) => s.tier ?? 0), 0);
    }

    function mixChannel(from, to, amount) {
      return Math.round(from + (to - from) * amount);
    }

    function startAmbient() {
      for (let i = 0; i < DRIFT_COUNT; i++) {
        const dot = new PIXI.Graphics().circle(0, 0, 1.6).fill(0x9aa4b2);
        dot.x = Math.random() * app.screen.width;
        dot.y = Math.random() * app.screen.height;
        dot.alpha = 0;
        // Each mote keeps its own speed so the field never pulses in lockstep.
        dot.speed = 4 + Math.random() * 10;
        layers.room.addChild(dot);
        ambient.drift.push(dot);
      }

      app.ticker.add((ticker) => {
        const dt = ticker.deltaMS / 1000;
        ambient.t += dt;

        // Colour temperature: warm as selling pressure builds, cool as it eases.
        const lean = Math.max(-1, Math.min(1, ambient.pressure / 3));
        const target = lean < 0 ? WARM_BG : COOL_BG;
        const amount = Math.abs(lean) * 0.85;
        app.renderer.background.color =
          (mixChannel(BASE_BG[0], target[0], amount) << 16) +
          (mixChannel(BASE_BG[1], target[1], amount) << 8) +
          mixChannel(BASE_BG[2], target[2], amount);

        // Room-wide sway: slow, sub-pixel at rest, a visible breath under load.
        const swayAmp = 1.5 + ambient.tier * 2.2;
        layers.chars.x = Math.sin(ambient.t * 0.21) * swayAmp;
        layers.chars.y = Math.cos(ambient.t * 0.17) * swayAmp * 0.5;
        layers.props.x = Math.sin(ambient.t * 0.13) * swayAmp * 0.4;

        // Characters: run any in-flight reaction animation, or breathe.
        advanceCharacters(dt);

        // Drift: density and speed track agitation, so a quiet market has a
        // barely-there field and a busy one visibly stirs.
        const energy = Math.max(0, Math.min(1, ambient.agitation / 6));
        for (const dot of ambient.drift) {
          dot.y -= dot.speed * energy * dt * 3;
          dot.alpha = 0.05 + energy * 0.28;
          if (dot.y < -4) {
            dot.y = app.screen.height + 4;
            dot.x = Math.random() * app.screen.width;
          }
        }
      });
    }

    // --- B9: the always-on now-band ---------------------------------------
    // Everything a newcomer needs in one glance, with no event required:
    // what's being traded, at what price, how the market feels, and — the
    // point of the whole project — how the model is actually doing.
    const nowband = document.getElementById("nowband");

    function formatPrice(value) {
      if (value == null) return "—";
      // Crypto spans 4 orders of magnitude; keep it readable at both ends.
      const digits = value >= 1000 ? 0 : value >= 1 ? 2 : 6;
      return value.toLocaleString("en-US", { minimumFractionDigits: digits,
                                             maximumFractionDigits: digits });
    }

    function bandCell(className, text, tint) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;          // payload data, never markup
      if (tint) span.style.color = tint;
      return span;
    }

    function renderNowBand(state) {
      const prices = state.prices ?? {};
      const symbols = state.symbols ?? {};
      nowband.textContent = "";
      for (const symbol of SYMBOLS) {
        const group = document.createElement("span");
        const mood = symbols[symbol]?.mood ?? "quiet";
        group.appendChild(bandCell("sym", symbol.replace(/USDT$/, "")));
        group.appendChild(document.createTextNode(" "));
        group.appendChild(bandCell("px", formatPrice(prices[symbol])));
        group.appendChild(document.createTextNode(" · "));
        group.appendChild(bandCell("mood", mood, MOOD_COLOR[mood]));
        nowband.appendChild(group);
      }
      // The honest record, on the same last-N basis as the strips (KI-012).
      const acc = state.model?.accuracy ?? {};
      const record = document.createElement("span");
      record.className = "record";
      const rate = acc.hit_rate == null
        ? "—" : `${(acc.hit_rate * 100).toFixed(1)}%`;
      record.appendChild(document.createTextNode("model "));
      const bold = document.createElement("b");
      bold.textContent = `${acc.wins ?? 0}W ${acc.losses ?? 0}L · ${rate}`;
      record.appendChild(bold);
      record.appendChild(document.createTextNode(` over last ${acc.window ?? 0}`));
      nowband.appendChild(record);
    }

    // --- B5: on-screen commentary -----------------------------------------
    // The director speaks through Piper, but TTS is a deferred ops step and the
    // stream is silent — so a line that isn't drawn may as well not exist. One
    // bubble per line: who said it, in their own accent colour, and what they
    // said, quoted verbatim from the payload.
    const CHARACTER_COLOR = __CHARACTER_COLORS_JSON__;
    const speech = document.getElementById("speech");
    const BUBBLE_MAX = 3;          // more than this and the room becomes a chat log
    const BUBBLE_HOLD_MS = 7000;   // long enough to read a full line aloud

    function speak(event) {
      const payload = event.payload ?? {};
      const text = payload.text;
      if (!text) return;
      const who = payload.character ?? "someone";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.style.borderLeftColor = CHARACTER_COLOR[who] ?? "var(--fg)";

      const name = document.createElement("span");
      name.className = "who";
      name.style.color = CHARACTER_COLOR[who] ?? "var(--fg)";
      // textContent only — payloads are data, never markup, on a public stream.
      name.textContent = who;

      const said = document.createElement("span");
      said.className = "said";
      said.textContent = text;

      bubble.appendChild(name);
      bubble.appendChild(said);
      speech.appendChild(bubble);
      // Next frame, so the transition actually runs instead of snapping in.
      requestAnimationFrame(() => bubble.classList.add("in"));

      while (speech.children.length > BUBBLE_MAX) {
        speech.removeChild(speech.firstChild);
      }
      setTimeout(() => {
        bubble.classList.remove("in");
        setTimeout(() => bubble.remove(), 400);
      }, BUBBLE_HOLD_MS);
    }

    // A live event nudges the room immediately; the next refresh reconciles it
    // with the authoritative server-side projection. The nudge scales with the
    // event's tier, so a calm event barely stirs and a tier-3 event visibly
    // swells (then settles back — never sticky-amped).
    function react(event) {
      // A spoken line is the director talking about an event, not an event the
      // room reacts to physically — it gets a bubble instead of a nudge.
      if (event.event_type === "commentary_spoken") {
        speak(event);
        return;
      }
      const target = event.event_type.startsWith("trader_") ? trader : model;
      const tier = tierOf(event.severity);
      // B1: the reaction registry decides the face and the movement; the tier
      // only decides how big it reads.
      const reaction = reactionFor(event);
      setExpression(target, reaction.mood);
      target.moodTag.text = reaction.mood;
      playAnimation(target, reaction.animation, tier);
    }

    async function refresh() {
      try {
        const response = await fetch("/world/state");
        if (!response.ok) return;
        world = (await response.json()).data;
        draw(world);
      } catch (e) {
        // A transient API blip must never blank the stream: keep the last frame.
      }
    }

    function subscribe() {
      const source = new EventSource("/stream/world/events");
      source.onmessage = (message) => react(JSON.parse(message.data));
    }

    boot().catch(() => {
      fallback.textContent = "renderer failed to start — the world is still running";
    });
  </script>
</body>
</html>
