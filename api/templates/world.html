<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The World — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    #room { width: 100vw; height: 100vh; }
    #fallback { position: absolute; top: 3rem; left: 1rem; color: var(--neutral);
                font-size: 0.85rem; }
    /* Newcomer legibility: an always-present line naming what this is.
       KI-053 (#25): it is THE answer to "what am I looking at?", so it is the
       loudest permanent text in the room - full foreground colour, at the size
       its manifest placement sets (inline, from `TEXT_PLACEMENTS.banner`),
       and one line only: a wrapped second line would hang over the ETH
       monitor's top edge (y~79), so it clips instead of covering the chart. */
    /* border-box: drawPlate sets min-height to the painted quiet strip, and
       under content-box the padding added ~23px of bar onto the room (KI-071). */
    #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
              box-sizing: border-box; padding: 0.55rem 1rem; background: rgba(19, 23, 34, 0.72);
              color: var(--fg); font-size: 0.9rem; letter-spacing: 0.01em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
              pointer-events: none; }
    #banner-syms { color: var(--accent); font-weight: 700; }
    #banner .tag { color: var(--fg); }

    /* B5 — the stream has no audio, so a spoken line only exists if it can be
       READ. Bubbles sit above the floor line, left of the room, and stack
       upward so the newest is nearest the characters. DOM rather than canvas
       text: it is the surface OBS is most reliable with, and it stays crisp
       at any bitrate. */
    #speech { position: absolute; left: 3.5rem; bottom: 21rem; z-index: 3;
              display: flex; flex-direction: column-reverse; gap: 0.5rem;
              max-width: 34rem; pointer-events: none; }
    .bubble { background: rgba(19, 23, 34, 0.9); border-left: 3px solid var(--neutral);
              border-radius: 0.35rem; padding: 0.5rem 0.75rem;
              font-size: 1.05rem; line-height: 1.35;
              opacity: 0; transform: translateY(6px);
              transition: opacity 320ms ease, transform 320ms ease; }
    .bubble.in { opacity: 1; transform: translateY(0); }
    .bubble .who { display: block; font-size: 0.72rem; letter-spacing: 0.08em;
                   text-transform: uppercase; margin-bottom: 0.15rem; }
    .bubble .said { color: var(--fg); }

    /* B9 — the always-on band. A newcomer arriving mid-calm sees no events at
       all, so the room has to answer "what is this and how is it going?"
       without waiting for one to fire. Bottom-pinned, quiet, permanent.

       Laid out here, in CSS, by decision (KI-070): one flex row whose cells
       are per-symbol groups the browser spaces, not fixed points a manifest
       could name. It still obeys "no text in the air" — the surface it sits
       on is the painted quiet strip `bands.bottom` reserves, and the bar is
       pinned to it — but it is not manifest-placed, and no placement
       pretends otherwise. */
    #nowband { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
               display: flex; align-items: baseline; gap: 1.75rem;
               padding: 0.5rem 1.25rem;
               background: linear-gradient(to top, rgba(19,23,34,0.92), rgba(19,23,34,0));
               font-size: 0.95rem; pointer-events: none; }
    #nowband .sym { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
    #nowband .px { color: var(--fg); font-variant-numeric: tabular-nums; }
    #nowband .mood { color: var(--neutral); }
    #nowband .trader { color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .trader b { color: var(--fg); font-weight: 600; }
    #nowband .record { margin-left: auto; color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .record b { color: var(--fg); font-weight: 600; }

    /* B8 — the tier-3 callout. Every other surface in this room is
       deliberately low-amplitude; this is the one moment it raises its voice,
       so it has to be the one unmissable thing on screen. Sized by the BOX,
       never by a transform: KI-031 clipped the very headlines the swell existed
       to emphasise, because `transform: scale` does not reflow and the overflow
       met the frame edge. The entry transform only ever scales *up to* 1, so it
       cannot exceed the layout box it was measured in. DOM, not canvas: it must
       stay crisp at 2200 kbps, and it must not ride the camera push. */
    #callout { position: absolute; left: 50%; top: 15%; z-index: 4;
               max-width: 68vw; overflow-wrap: anywhere; text-align: center;
               padding: 0.7rem 1.5rem; border-radius: 0.4rem;
               background: rgba(19, 23, 34, 0.86);
               border-bottom: 3px solid var(--accent);
               font-size: 2.4rem; font-weight: 700; line-height: 1.1;
               letter-spacing: 0.03em; text-transform: uppercase;
               opacity: 0; pointer-events: none;
               transform: translateX(-50%) translateY(10px) scale(0.97);
               transition: opacity 260ms ease, transform 380ms
                           cubic-bezier(0.16, 0.84, 0.44, 1); }
    #callout.in { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    #callout .where { display: block; margin-top: 0.4rem; font-size: 0.95rem;
                      font-weight: 600; letter-spacing: 0.16em;
                      color: var(--neutral); }
  </style>
</head>
<body>
  <div id="banner"><span id="banner-syms"></span><span class="tag">the robot
    is an AI predicting their next move; every hit and miss stays on the
    record</span></div>
  <div id="room"></div>
  <div id="speech"></div>
  <div id="nowband"></div>
  <div id="callout"></div>
  <div id="fallback">Waking the world…</div>
  <script type="application/json" id="world-config">__WORLD_CONFIG__</script>
  <script src="/static/pixi-8.19.0.min.js"></script>
  <script type="module" src="/static/world/main.js"></script>
  <script id="world-boot-fallback">
    // #42: retryBoot lives in the modules, so a module graph that never runs
    // (a module fetch dropped while the API restarts, or a stale module that
    // will not link) would latch "Waking the world…". Retry it from here, on
    // retryBoot's own counter, backoff and cap. main.js sets __worldModules
    // just before boot(), which owns every failure from then on.
    (function () {
      var BACKOFF_MS = [2000, 5000, 15000, 30000, 60000];
      var raw = Number(new URLSearchParams(location.search).get("boot_retry") || 0);
      var attempt = Number.isInteger(raw) && raw >= 0 ? raw : BACKOFF_MS.length;
      setTimeout(function () {
        if (window.__worldModules) return;
        if (attempt >= BACKOFF_MS.length) {
          document.getElementById("fallback").textContent =
            "renderer failed to load — the world is still running";
          return;
        }
        var next = new URL(location.href);
        next.searchParams.set("boot_retry", String(attempt + 1));
        location.replace(next.toString());
      }, 10000 + (BACKOFF_MS[attempt] || 0));
    })();
  </script>
</body>
</html>
