    // to a visible additive alpha. Deliberately not a copy of the ramp
    // itself — retuning this number changes only this canvas, never the
    // theme vars block or the overlays that read `room_light` directly
    // (KI-019's family).
    const GLOW_LIFT_TO_ALPHA = 3;

    // Built once, the moment the plate becomes ready (drawPlate, above) —
    // never inside the per-frame ticker. `applyGlow` runs ~60x/sec, and a
    // `new PIXI.Graphics()` per glow rect at that rate is exactly the
    // "full-canvas Graphics rebuilt per frame" cost B2's own comment (above,
    // "the room is built ONCE") warns against, on a box that also encodes
    // 1080p. `ambient.drift`'s dots and the vignette already show the right
    // shape for this ticker — build once, mutate a property per tick — so
    // the glow's own Graphics follow the same rule.
    let glows = [];

    function buildGlows() {
      // Defensive, not load-bearing today: the only caller is drawPlate's
      // try block, once. But a half-thrown call (this map throws partway
      // through, e.g. a bad rect) or a future retry path calling it twice
      // would otherwise leave orphaned Graphics stacked in layers.glow —
      // this makes a second call start clean instead of accumulating.
      layers.glow.removeChildren();
      glows = PLATE.glow.map((rect) => {
        const glow = new PIXI.Graphics()
          .rect(snap(rect.x), snap(rect.y), snap(rect.w), snap(rect.h))
          .fill({ color: GLOW_COLOR, alpha: 1 });
        glow.blendMode = "add";
        glow.alpha = 0;              // applyGlow sets the real value per tick
        layers.glow.addChild(glow);
        return glow;
      });
    }

    // `lift` must be the EASED `ambient.light.lift`, never `ROOM_LIGHT[tier]
    // .lift` directly — see the ticker's own call site for why.
    function applyGlow(lift) {
      if (!plateReady) return;   // no plate: nothing was ever built to light
      const alpha = Math.min(1, lift * GLOW_LIFT_TO_ALPHA);
      for (const glow of glows) glow.alpha = alpha;
    }

    // --- Task 14 (STRETCH): the painted city's window lights blink --------
    // The plate already paints a skyline through the room's own window; this
    // animates what is there rather than inventing anything new. A small
    // list of rects measured over painted glass, each fading on its own
    // phase and period — a shared clock would pulse the whole skyline in
    // unison, which reads as a fault rather than as a city.
    const AMBIENT_LIGHTS = (PLATE && PLATE.ambient_lights) || [];
    // The floor of the fade: dim, not zero. Additive light at alpha 0 IS the
    // plate's own painted light — correctly "off" — but never literal zero,
    // so a light is never left fully unlit for the low point of its cycle
    // either (a light that vanishes entirely reads as a rendering glitch,
    // not a window that is briefly dark).
    const AMBIENT_LIGHT_MIN_ALPHA = 0.12;

    // Built once, exactly like buildGlows/buildMonitorGraphics beside it —
    // never inside the per-frame ticker. Each light gets its own Graphics
    // (mutated only on .alpha per tick) and its own phase, seeded off the
    // light's index with the same rng32 the cast's breathing uses, so a
    // reload is reproducible but no two lights start in lockstep. Additive
    // blend, the same as buildGlows: an opaque fill at alpha near 1 would
    // paint FLAT OVER the plate's own painted detail (several of these
    // signs have an icon drawn inside the red field) the moment a light
    // reached peak brightness — the opposite of animating what is already
    // there. `filter` skips any entry missing a usable colour rather than
    // throwing mid-map — a malformed manifest entry degrades that ONE light
    // to unlit, never the whole room to procedural (buildMonitorGraphics's
    // `if (screen.quad)` guard is the same idea for a different builder).
    let ambientLightSprites = [];

    function buildAmbientLights() {
      ambientLightSprites = AMBIENT_LIGHTS
        .filter((light) => (
          light && /^#[0-9a-fA-F]{6}$/.test(light.colour || "")
          && light.w > 0 && light.h > 0
        ))
        .map((light, i) => {
          const graphics = new PIXI.Graphics()
            .rect(snap(light.x), snap(light.y), snap(light.w), snap(light.h))
            .fill({ color: parseInt(light.colour.slice(1), 16), alpha: 1 });
          graphics.blendMode = "add";
          layers.plate.addChild(graphics);
          return {
            graphics,
            period: light.period > 0 ? light.period : 4,
            phase: rng32(i + 1)(),
          };
        });
    }

    // `t` is `ambient.t`, the same running clock the swell/drift/breathing
    // already read — never a second clock of its own (KI-019's family).
    function tickAmbientLights(t) {
      if (!plateReady) return;   // no plate: nothing was ever built to light
      for (const light of ambientLightSprites) {
        const u = 0.5 + 0.5 * Math.sin((t / light.period + light.phase) * Math.PI * 2);
        light.graphics.alpha = AMBIENT_LIGHT_MIN_ALPHA + (1 - AMBIENT_LIGHT_MIN_ALPHA) * u;
      }
    }

    // --- M2: live candles in the painted monitors -------------------------
    // The plate paints two central monitors as flat dark glass. The rules for
    // whether/how much of that glass is worth drawing into — how many candles
    // fit an irregular painted frame, whether a frame is legible at all, and
    // when data is too old to be shown as the present — are decided in
    // world/monitors.py and injected here, both as constants AND as the
    // functions that read them: injecting only the numbers is the half-fix
    // that let KI-019 happen (the tier-cuts injection above this block is the
    // same lesson applied to tiers). This page must not re-derive any of it.
    //
    // NOTE: a placeholder token must never be spelled out in a comment below
    // its own substitution line — `_render_template` string-replaces EVERY
    // occurrence in the page, comments included, so a token named in prose
    // gets rewritten into JS mid-sentence. Found by `node --check` on this
    // exact block while writing it.
    const MONITOR_RULES = __MONITOR_RULES_JSON__;
    // The rule-reading functions themselves - barsThatFit, isDrawable and
    // staleAlpha - generated FROM the constants above by world/monitors.py,
    // so the page and the server cannot drift on how many candles fit or
    // when a screen is too old to be believed.
    __MONITOR_JS__

    // One Graphics per painted screen, created ONCE — on the plate-success
    // path, right after buildGlows() — and only cleared/redrawn per
    // poll. Rebuilding Graphics every tick or every poll is exactly what B2
    // warned would cost the stream frames on a box that also encodes 1080p.
    const monitorGraphics = {};

    function buildMonitorGraphics() {
      for (const screen of PLATE.screens || []) {
        const g = new PIXI.Graphics();
        // layers.monitors: its own container, built once here and never
        // wiped by anyone else (see the layer's own comment in boot()).
        layers.monitors.addChild(g);
        monitorGraphics[screen.id] = g;
        // KI-052: clip candles to the painted glass's own quad, not the
        // bounding rect drawCandles lays them out in - the rect can (and,
        // before this fix, did) reach past the quad's slanted bottom edge
        // at the bottom-right. Built once here, exactly like `g` itself:
        // drawCandles runs once per screen per poll, forever, so anything
        // it added to a layer would leak without bound (see that
        // function's own comment, and
        // test_the_monitor_graphics_are_built_once_not_per_poll_or_per_tick).
        // Guarded on `screen.quad` so a manifest entry with no quad (never
        // shipped today, but not schema-forbidden) fails closed to an
        // unmasked screen rather than throwing inside boot().
        if (screen.quad) {
          const glass = new PIXI.Graphics().poly(screen.quad.flat()).fill(0xffffff);
          g.mask = glass;
          layers.monitors.addChild(glass);
        }
      }
    }

    // Procedural pixel candles, on the same 4px grid as the cast. Not
    // Lightweight Charts: a smooth anti-aliased chart inside a pixel-art
    // monitor reads as a screenshot pasted into a painting.
    function drawCandles(screen, bars) {
      const g = monitorGraphics[screen.id];
      // A screen absent from monitorGraphics (never built, or a stale
      // manifest reference) fails closed rather than throwing inside a
      // render loop the whole page depends on.
      if (!g) return;
      g.clear();
      // barsThatFit / isDrawable are INJECTED from world/monitors.py — the
      // page must not re-derive them. A screen too small for a legible
      // candle stays dark glass: the plate's painted state is the honest
      // rendering of "nothing to say here".
      const fits = barsThatFit(screen.w);
      if (!isDrawable(screen)) return;
      if (!bars || !bars.length) return;

      const shown = bars.slice(-fits);
      const highs = shown.map((b) => b.high), lows = shown.map((b) => b.low);
      const top = Math.max(...highs), bottom = Math.min(...lows);
      const span = top - bottom;
      if (!(span > 0)) return;      // a flat span would divide by zero and draw a lie

      const newest = Date.parse(shown[shown.length - 1].timestamp);
      const ageSeconds = (Date.now() - newest) / 1000;
      g.alpha = staleAlpha(ageSeconds);   // INJECTED from world/monitors.py - see above

      const pad = MONITOR_RULES.pad_cells * CELL;
      const pitch = (MONITOR_RULES.body_cells + MONITOR_RULES.gap_cells) * CELL;
      const plotH = screen.h - 2 * pad;
      const yOf = (price) => snap(screen.y + pad + (top - price) / span * plotH);

      shown.forEach((bar, i) => {
        const x = snap(screen.x + pad + i * pitch);
        const up = bar.close >= bar.open;
        const clr = up ? 0x26a69a : 0xef5350;
        const bodyTop = yOf(Math.max(bar.open, bar.close));
        const bodyBottom = yOf(Math.min(bar.open, bar.close));
        g.rect(x + CELL, yOf(bar.high), CELL, yOf(bar.low) - yOf(bar.high)).fill(clr);
        g.rect(x, bodyTop, MONITOR_RULES.body_cells * CELL,
               Math.max(CELL, bodyBottom - bodyTop)).fill(clr);
      });
    }

    // Polling, not SSE (KI-013): subscribe() below already spends one of
    // Chromium's six same-origin connections on this page's live event
    // stream, and OBS's browser sources all share that one network stack. A
    // second EventSource here is how the room went blank for a week.
    // /music/now-playing set this precedent. 20s is well inside a 1m bar and
    // costs one short-lived fetch per screen per tick.
    const BARS_POLL_MS = 20000;
    async function pollBars() {
      if (!plateReady || !PLATE.screens) return;
      for (const screen of PLATE.screens) {
        if (screen.role !== "chart" || !screen.symbol) continue;
        try {
          const res = await fetch(`/bars/${screen.symbol}?interval=1m&limit=120`);
          if (!res.ok) { drawCandles(screen, []); continue; }
          const body = await res.json();
          drawCandles(screen, (body.data && body.data.bars) || []);
        } catch (err) {
          drawCandles(screen, []);   // dark glass, never a stale claim
        }
      }
    }

    // --- B9: the always-on now-band ---------------------------------------
    // Everything a newcomer needs in one glance, with no event required:
    // what's being traded, at what price, how the market feels, and — the
    // point of the whole project — how the model is actually doing.
    const nowband = document.getElementById("nowband");

    function formatPrice(value) {
      if (value == null) return "—";
      // Crypto spans 4 orders of magnitude; keep it readable at both ends.
      const digits = value >= 1000 ? 0 : value >= 1 ? 2 : 6;
      return value.toLocaleString("en-US", { minimumFractionDigits: digits,
                                             maximumFractionDigits: digits });
    }

    function bandCell(className, text, tint) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;          // payload data, never markup
      if (tint) span.style.color = tint;
      return span;
    }

    function renderNowBand(state) {
      const prices = state.prices ?? {};
      const symbols = state.symbols ?? {};
      nowband.textContent = "";
      for (const symbol of SYMBOLS) {
        const group = document.createElement("span");
        const mood = symbols[symbol]?.mood ?? "quiet";
        group.appendChild(bandCell("sym", symbol.replace(/USDT$/, "")));
        group.appendChild(document.createTextNode(" "));
        group.appendChild(bandCell("px", formatPrice(prices[symbol])));
        group.appendChild(document.createTextNode(" · "));
        group.appendChild(bandCell("mood", mood, MOOD_COLOR[mood]));
        nowband.appendChild(group);
      }
      // KI-065: the trader's own numbers. Task 10 deleted this readout from
      // the room - rightly, it floated beside the figure with no surface
      // under it - and nothing else in the room or the overlays carried it.
      // The show's premise is that an AI trades crypto live, loses money and
      // publishes every loss forever: this is the loss, so it gets a home
      // rather than staying dropped.
      //
      // `state.trader` is null until a `trader_*` event arrives, and those
      // come from the freqtrade sidecar - an opt-in compose profile. The slot
      // then reads "—" instead of vanishing, exactly as the model's record
      // does when its accuracy is unknown: a named empty slot says "no
      // positions reported", an absent one silently un-publishes the premise.
      const traderState = state.trader;
      const pnl =
        traderState && Number.isFinite(traderState.profit_pct)
          ? traderState.profit_pct
          : null;
      const trader = document.createElement("span");
      trader.className = "trader";
      trader.appendChild(document.createTextNode("trader "));
      const positions = document.createElement("b");
      positions.textContent = traderState
        ? `${traderState.open_trades ?? 0} open · ` +
          (pnl == null ? "—" : `${pnl >= 0 ? "+" : ""}${pnl.toFixed(2)}%`)
        : "—";
      trader.appendChild(positions);
      nowband.appendChild(trader);

      // The honest record, on the same last-N basis as the strips (KI-012).
      const acc = state.model?.accuracy ?? {};
      const record = document.createElement("span");
      record.className = "record";
      const rate = acc.hit_rate == null
        ? "—" : `${(acc.hit_rate * 100).toFixed(1)}%`;
      record.appendChild(document.createTextNode("model "));
      const bold = document.createElement("b");
      bold.textContent = `${acc.wins ?? 0}W ${acc.losses ?? 0}L · ${rate}`;
      record.appendChild(bold);
      record.appendChild(document.createTextNode(` over last ${acc.window ?? 0}`));
      nowband.appendChild(record);
    }

    // --- B5: on-screen commentary -----------------------------------------
    // The director speaks through Piper, but TTS is a deferred ops step and the
    // stream is silent — so a line that isn't drawn may as well not exist. One
    // bubble per line: who said it, in their own accent colour, and what they
    // said, quoted verbatim from the payload.
    const CHARACTER_COLOR = __CHARACTER_COLORS_JSON__;
    const speech = document.getElementById("speech");
    const BUBBLE_MAX = 3;          // more than this and the room becomes a chat log
    const BUBBLE_HOLD_MS = 7000;   // long enough to read a full line aloud

    function speak(event) {
      const payload = event.payload ?? {};
      const text = payload.text;
      if (!text) return;
      const who = payload.character ?? "someone";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.style.borderLeftColor = CHARACTER_COLOR[who] ?? "var(--fg)";

      const name = document.createElement("span");
      name.className = "who";
      name.style.color = CHARACTER_COLOR[who] ?? "var(--fg)";
      // textContent only — payloads are data, never markup, on a public stream.
      name.textContent = who;

      const said = document.createElement("span");
      said.className = "said";
      said.textContent = text;

      bubble.appendChild(name);
      bubble.appendChild(said);
      speech.appendChild(bubble);
      // Next frame, so the transition actually runs instead of snapping in.
      requestAnimationFrame(() => bubble.classList.add("in"));

      while (speech.children.length > BUBBLE_MAX) {
        speech.removeChild(speech.firstChild);
      }
      setTimeout(() => {
        bubble.classList.remove("in");
        setTimeout(() => bubble.remove(), 400);
      }, BUBBLE_HOLD_MS);
    }


    // --- B8: the tier-3 swell ----------------------------------------------
    //
    // The room's whole register is calm-that-swells, and until now the swell
    // was a brightness ramp and a bigger reaction. This is the beat: push ->
    // spike -> callout -> decay, choreographed with explicit timings so it
    // reads as a *moment* rather than as a setting that changed. The character
    // spike is already react()'s job; this puts the camera and the words
    // around it.
    //
    // Only tier 3 earns it. A swell that fired on the room's ordinary traffic
    // would be a swell that means nothing, which is the same mistake as a
    // glance that happens constantly (B7).
    const SWELL_TIER = 3;
    const SWELL_PUSH = 0.055;      // 5.5%: a push-in, not a zoom
    const SWELL_PUSH_S = 0.7;
    const SWELL_HOLD_S = 2.6;
    const SWELL_DECAY_S = 1.8;
    // The floor between two swells. Without it a burst of tier-3 events reads
    // as a strobe, and the room's biggest moment becomes its most annoying one
    // — the dwell guard the director already has, applied to the camera.
    const SWELL_FLOOR_S = 20;
    const CALLOUT_LEAD_S = 0.18;   // the body moves first; the words land after
    const swell = { active: false, t: 0, last: -1e9 };

    const calloutEl = document.getElementById("callout");
    const calloutText = document.createElement("span");
    const calloutWhere = document.createElement("span");
    calloutWhere.className = "where";
    calloutEl.appendChild(calloutText);
    calloutEl.appendChild(calloutWhere);

    function swellEase(x) {
      const t = Math.max(0, Math.min(1, x));
      return t * t * (3 - 2 * t);
    }

    function swellHeadline(event) {
      // Derived from the type, not a second copy of overlay_events.html's
      // HEADLINES map — two hand-kept copies of one vocabulary is how KI-019
      // happened, and a headline that drifts between two surfaces of the same
      // stream is worse than a plain one. Short by construction, which is also
      // what keeps it inside its box (KI-031).
      return (event.event_type || "").replace(/_/g, " ");
    }

    function emitSwellCue(event) {
      // The music cue. There is no audio bed yet — choosing DMCA-safe music is
      // a human step still open from Sprint 11 — so this fires an event and
      // nothing listens. Deliberately not a `playSwell()` stub: a function that
      // looks like it makes a sound and doesn't is a lie the next reader has to
      // discover. When the bed lands, it subscribes here.
      window.dispatchEvent(new CustomEvent("world:swell", {
        detail: {
          event_type: event.event_type,
          symbol: event.symbol ?? null,
          hold_seconds: SWELL_PUSH_S + SWELL_HOLD_S + SWELL_DECAY_S,
        },
      }));
    }

    function restCamera() {
      // Exactly rest. A push that lands on 0.999 leaves the room fractionally
      // more zoomed after every swell and nothing on screen would ever say so
      // — the failure `turn` and `hop` already taught this page, on the stage.
      app.stage.scale.set(1);
      app.stage.position.set(0, 0);
    }

    function startSwell(event) {
      if (swell.active) return;              // one push per moment
      if (ambient.t - swell.last < SWELL_FLOOR_S) return;
      swell.active = true;
      swell.t = 0;
      swell.last = ambient.t;
      calloutText.textContent = swellHeadline(event);
      calloutWhere.textContent = event.symbol ?? "";
      emitSwellCue(event);
    }

    function swellTick(dt) {
      if (!swell.active) return;
      swell.t += dt;
      const t = swell.t;
      const held = SWELL_PUSH_S + SWELL_HOLD_S;
      let push;
      if (t < SWELL_PUSH_S) {
        push = swellEase(t / SWELL_PUSH_S);
      } else if (t < held) {
        push = 1;
      } else if (t < held + SWELL_DECAY_S) {
        push = 1 - swellEase((t - held) / SWELL_DECAY_S);
      } else {
        swell.active = false;
        calloutEl.classList.remove("in");
        restCamera();
        return;
      }
      if (t >= CALLOUT_LEAD_S && t < held) calloutEl.classList.add("in");
      if (t >= held) calloutEl.classList.remove("in");
      const scale = 1 + SWELL_PUSH * push;
      // Push in on the room's centre. Scaling the stage on its own would drag
      // the frame down and to the right, which reads as a camera falling over
      // rather than leaning in.
      app.stage.scale.set(scale);
      app.stage.position.set(
        (1 - scale) * app.screen.width / 2,
        (1 - scale) * app.screen.height / 2,
      );
    }

    // A live event nudges the room immediately; the next refresh reconciles it
    // with the authoritative server-side projection. The nudge scales with the
    // event's tier, so a calm event barely stirs and a tier-3 event visibly
    // swells (then settles back — never sticky-amped).
    function react(event) {
      // A spoken line is the director talking about an event, not an event the
      // room reacts to physically — it gets a bubble instead of a nudge.
      if (event.event_type === "commentary_spoken") {
        speak(event);
        return;
      }
      const target = event.event_type.startsWith("trader_") ? trader : model;
      const tier = tierOf(event.event_type, event.severity);
      // B1: the reaction registry decides the face and the movement; the tier
      // only decides how big it reads.
      const reaction = reactionFor(event);
      setExpression(target, reaction.mood);
      // Sprint 16 Task 10: no floating mood text on a live reaction either —
      // `setExpression` is the room's only mood channel now.
      playAnimation(target, reaction.animation, tier);
      // B7: the one who didn't act notices the one who did. Only from tier 1 —
      // at tier 0 the pair would spend the day turning to look at each other,
      // and a glance that happens constantly stops meaning anything.
      if (tier >= 1) lookAt(target === model ? trader : model, target, 0.25);
      // B8: the top tier earns the whole room — camera, callout and a cue.
      if (tier >= SWELL_TIER) startSwell(event);
    }

    async function refresh() {
      try {
        const response = await fetch("/world/state");
        if (!response.ok) return;
        world = (await response.json()).data;
        draw(world);
      } catch (e) {
        // A transient API blip must never blank the stream: keep the last frame.
      }
    }

    function subscribe() {
      const source = new EventSource("/stream/world/events");
      source.onmessage = (message) => react(JSON.parse(message.data));
    }

    boot().catch(() => {
      retryBoot("renderer failed to start");
    });
  </script>
</body>
</html>
