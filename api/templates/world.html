<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The World — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    #room { width: 100vw; height: 100vh; }
    #fallback { position: absolute; top: 3rem; left: 1rem; color: var(--neutral);
                font-size: 0.85rem; }
    /* Newcomer legibility: an always-present line naming what this is. */
    #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
              padding: 0.55rem 1rem; background: rgba(19, 23, 34, 0.72);
              color: var(--fg); font-size: 0.9rem; letter-spacing: 0.01em;
              pointer-events: none; }
    #banner-syms { color: var(--accent); font-weight: 600; }
    #banner .tag { color: var(--neutral); }

    /* B5 — the stream has no audio, so a spoken line only exists if it can be
       READ. Bubbles sit above the floor line, left of the room, and stack
       upward so the newest is nearest the characters. DOM rather than canvas
       text: it is the surface OBS is most reliable with, and it stays crisp
       at any bitrate. */
    #speech { position: absolute; left: 3.5rem; bottom: 21rem; z-index: 3;
              display: flex; flex-direction: column-reverse; gap: 0.5rem;
              max-width: 34rem; pointer-events: none; }
    .bubble { background: rgba(19, 23, 34, 0.9); border-left: 3px solid var(--neutral);
              border-radius: 0.35rem; padding: 0.5rem 0.75rem;
              font-size: 1.05rem; line-height: 1.35;
              opacity: 0; transform: translateY(6px);
              transition: opacity 320ms ease, transform 320ms ease; }
    .bubble.in { opacity: 1; transform: translateY(0); }
    .bubble .who { display: block; font-size: 0.72rem; letter-spacing: 0.08em;
                   text-transform: uppercase; margin-bottom: 0.15rem; }
    .bubble .said { color: var(--fg); }

    /* B9 — the always-on band. A newcomer arriving mid-calm sees no events at
       all, so the room has to answer "what is this and how is it going?"
       without waiting for one to fire. Bottom-pinned, quiet, permanent. */
    #nowband { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
               display: flex; align-items: baseline; gap: 1.75rem;
               padding: 0.5rem 1.25rem;
               background: linear-gradient(to top, rgba(19,23,34,0.92), rgba(19,23,34,0));
               font-size: 0.95rem; pointer-events: none; }
    #nowband .sym { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
    #nowband .px { color: var(--fg); font-variant-numeric: tabular-nums; }
    #nowband .mood { color: var(--neutral); }
    #nowband .record { margin-left: auto; color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .record b { color: var(--fg); font-weight: 600; }

    /* B8 — the tier-3 callout. Every other surface in this room is
       deliberately low-amplitude; this is the one moment it raises its voice,
       so it has to be the one unmissable thing on screen. Sized by the BOX,
       never by a transform: KI-031 clipped the very headlines the swell existed
       to emphasise, because `transform: scale` does not reflow and the overflow
       met the frame edge. The entry transform only ever scales *up to* 1, so it
       cannot exceed the layout box it was measured in. DOM, not canvas: it must
       stay crisp at 2200 kbps, and it must not ride the camera push. */
    #callout { position: absolute; left: 50%; top: 15%; z-index: 4;
               max-width: 68vw; overflow-wrap: anywhere; text-align: center;
               padding: 0.7rem 1.5rem; border-radius: 0.4rem;
               background: rgba(19, 23, 34, 0.86);
               border-bottom: 3px solid var(--accent);
               font-size: 2.4rem; font-weight: 700; line-height: 1.1;
               letter-spacing: 0.03em; text-transform: uppercase;
               opacity: 0; pointer-events: none;
               transform: translateX(-50%) translateY(10px) scale(0.97);
               transition: opacity 260ms ease, transform 380ms
                           cubic-bezier(0.16, 0.84, 0.44, 1); }
    #callout.in { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    #callout .where { display: block; margin-top: 0.4rem; font-size: 0.95rem;
                      font-weight: 600; letter-spacing: 0.16em;
                      color: var(--neutral); }
  </style>
</head>
<body>
  <div id="banner"><span id="banner-syms"></span><span class="tag">a model
    trades live, and the world remembers when it's wrong</span></div>
  <div id="room"></div>
  <div id="speech"></div>
  <div id="nowband"></div>
  <div id="callout"></div>
  <div id="fallback">Waking the world…</div>
  <script src="/static/pixi-8.19.0.min.js"></script>
  <script>
    const SYMBOLS = __SYMBOLS__;
    // The plate's measured anchors, or null when there is no plate. Every
    // layout number below reads from here rather than from canvas fractions.
    // Same-origin by construction (KI-045/KI-047): the manifest names a bare
    // filename and the page prefixes /static/ itself, so no manifest edit can
    // put a third party into the on-air load path.
    const PLATE = __PLATE_JSON__;
    const PLATE_SRC = PLATE ? "/static/" + PLATE.plate : null;
    const fallback = document.getElementById("fallback");

    // Name the room for a newcomer: the symbols in play + the one-line premise.
    document.getElementById("banner-syms").textContent =
      SYMBOLS.map((s) => s.replace(/USDT$/, "")).join(" · ") + " — ";

    // The mood -> colour map is injected from world/visuals.MOOD_COLORS (hex
    // strings) so this canvas and the DOM overlays share ONE palette; drift
    // between them was the old failure. Unknown moods stay grey rather than
    // throwing, so a new salience rule degrades quietly on screen.
    const MOOD_COLOR = __MOOD_COLORS_JSON__;
    const NEUTRAL = 0x787b86;
    const color = (mood) => {
      const hex = MOOD_COLOR[mood];
      return hex ? parseInt(hex.slice(1), 16) : NEUTRAL;
    };

    // KI-028: the cast measured 1.19:1 (trader) and 1.00:1 against its own
    // background, versus WCAG's 3:1 floor — the bodies were the same luminance
    // as the room and only the faces read. A body's colour is NOT its mood
    // colour: PixiJS tint multiplies, so what renders is BODY_FILL x tint. The
    // old code floored the luminance of the *tint*, which is not the number a
    // viewer sees, and with the previous fill of 0x545862 the brightest body
    // obtainable — a pure white tint — was still only 2.51:1. The ceiling was
    // below the floor, so no tint could have fixed it; the fill had to move.
    // Both now come from world/visuals.py, which does the contrast maths and
    // is test-asserted over every mood.
    const BODY_TINT = __BODY_TINTS_JSON__;
    const BODY_FILL = __BODY_BASE_FILL__;
    // A lit edge, drawn brighter than the fill so the difference survives being
    // tinted by the same multiplier. Inner alignment so the rim costs the
    // silhouette no width — shadow sizes and head placement are tuned to these
    // exact rects. This is also the detail a 2200 kbps VBR encoder keeps best:
    // it spends its fewest bits on the near-black gradients that used to be the
    // only thing separating the cast from the room.
    const BODY_RIM = { width: 1.5, color: __BODY_RIM_FILL__, alignment: 1 };
    const bodyTint = (mood) => {
      const hex = BODY_TINT[mood];
      return hex ? parseInt(hex.slice(1), 16) : NEUTRAL;
    };

    // Shared severity -> tier bands (mirror the overlay + world/state tiers) so
    // the "swell" reads the same on every surface: tier 0 barely stirs, tier 3
    // leaps. This is the calm-that-swells register in motion.
    // The tier scale is the server's, injected — never restated here. Severity
    // is rule-specific: 1.6 is tier 2 for a `signal_resolved` and tier 0 for a
    // `big_move`. An absolute 2/5/8 scale in this file quietly pinned the most
    // frequent event in the world to tier 0, so the room never swelled for it.
    const TIER_CUTS = __TIER_CUTS_JSON__;

    __TIER_OF_JS__

    // 4px cells at 1920x960. Every coordinate the cast draws or moves to is
    // quantised here, so motion reads as pixel STEPS rather than smooth
    // slides — the one drawing rule the whole cast obeys. Falls back to a
    // literal 4 when there is no plate (PLATE is null): CELL must not throw
    // on the no-manifest path any more than anchorFor does. Top-level scope,
    // not inside boot(), so playAnimation, the cast helpers, and (Tasks 7/8)
    // drawCandles/applyGlow can all reach it.
    const CELL = (PLATE && PLATE.cell) || 4;
    function snap(v) { return Math.round(v / CELL) * CELL; }

    // Declared here, constructed in boot(): character() needs app.screen and
    // the layer containers, neither of which exist until PIXI has initialised.
    let app, layers = {}, world = null, model = null, trader = null;

    // This page is unattended and on air. Every failure below used to latch:
    // the card was painted once and the room stayed blank until a human
    // refreshed the browser source. So a boot failure now reloads on a bounded
    // backoff. The window it covers is small but recurring — a browser source
    // reloading while the API container restarts, i.e. every deploy.
    const RETRY_BACKOFF_MS = [2000, 5000, 15000, 30000, 60000];

    function retryBoot(reason) {
      // The counter rides in the URL, so treat it as untrusted input: anything
      // that is not a clean non-negative integer counts as exhausted rather
      // than as zero. `Number("abc")` is NaN, and NaN fails every comparison
      // below — it would slip past the cap and then increment to NaN forever,
      // which is the reload storm this cap exists to prevent.
      const raw = Number(
        new URLSearchParams(location.search).get("boot_retry") || 0
      );
      const attempt =
        Number.isInteger(raw) && raw >= 0 ? raw : RETRY_BACKOFF_MS.length;
      if (attempt >= RETRY_BACKOFF_MS.length) {
        // Out of retries: say so plainly and stop. A reload storm against an
        // API that is genuinely down helps nobody.
        fallback.textContent = reason + " — the world is still running";
        return;
      }
      fallback.textContent = reason + " — retrying…";
      const next = new URL(location.href);
      next.searchParams.set("boot_retry", String(attempt + 1));
      setTimeout(() => location.replace(next.toString()), RETRY_BACKOFF_MS[attempt]);
    }

    // Called only once the room is fully built. Clearing the counter any
    // earlier defeats the cap: anything that throws *after* the reset but
    // before boot() resolves lands in the catch with a fresh budget, and the
    // page reload-loops forever against the API instead of stopping after
    // five tries. The reset has to be the last thing, not the first.
    function bootSucceeded() {
      if (!new URLSearchParams(location.search).has("boot_retry")) return;
      const clean = new URL(location.href);
      clean.searchParams.delete("boot_retry");
      history.replaceState(null, "", clean.toString());
    }

    async function boot() {
      if (typeof PIXI === "undefined") {
        retryBoot("renderer unavailable");
        return;
      }
      app = new PIXI.Application();
      await app.init({ background: 0x131722, resizeTo: window, antialias: false });
      document.getElementById("room").appendChild(app.canvas);
      fallback.textContent = "";

      // KI-046: the room can be dark while every light is green. The count is
      // incremented by the RENDER loop, so a page whose setInterval still fires
      // over a dead renderer reports a frozen frame count rather than health.
      let framesDrawn = 0;
      app.ticker.add(() => { framesDrawn++; });

      // Below the room: the painted backdrop, when there is one.
      layers.plate = new PIXI.Container();
      layers.room = new PIXI.Container();
      // Task 9: additive light (applyGlow) falls ON the room but must never
      // land over the cast's faces, so it sits above layers.room — and,
      // since M2's live chart candles (layers.monitors) must never be washed
      // out by the glow, this sits below that layer too.
      layers.glow = new PIXI.Container();
      // M2: the monitors get their OWN container, a stage sibling exactly
      // like layers.glow — built once (buildMonitorGraphics, called from
      // drawPlate's success path) and never wiped by anyone else. It does
      // NOT share layers.props: that container has a per-cycle
      // wipe-and-rebuild contract (drawPillars calls removeChildren() on
      // every draw()), which is a different lifecycle than "build once,
      // never cleared" — putting both contracts in one container is how a
      // future props consumer forgets to preserve the monitors and the room
      // goes blank on air with no text-reading test able to see it. Placed
      // above layers.glow (so it never washes the candles out) and below props
      // (so pillars/labels still paint over it exactly as before, since they
      // never spatially overlap the painted screens anyway).
      layers.monitors = new PIXI.Container();
      layers.chars = new PIXI.Container();
      layers.props = new PIXI.Container();
      // Shadows are a *child* of the cast layer, not of any character: they
      // inherit CAST_SCALE and the layer's coordinate space for free, so a
      // shadow's x is just the character's x — but they are siblings of the
      // bodies, so a lean, a squash or a hop moves the body without dragging
      // its shadow off the floor with it. Added first, so they stay behind.
      layers.shadows = new PIXI.Container();
      layers.chars.addChild(layers.shadows);
      app.stage.addChild(
        layers.plate, layers.room, layers.glow, layers.monitors,
        layers.props, layers.chars);
      // Pixel-art rule: no sub-pixel compositing for anything the cast or its
      // furniture draws. The plate and the vignette stay off this list on
      // purpose — they are painted art and a soft light falloff, not part of
      // the grid. The glow layer is additive light too, for the same reason.
      layers.chars.roundPixels = true;
      layers.props.roundPixels = true;
      layers.monitors.roundPixels = true;

      await drawPlate();
      model = character("MODEL");
      trader = character("TRADER");
      cast.push(model, trader);
      positionCharacters();
      startAmbient();
      bootSucceeded();

      // M2: polled, not streamed (KI-013 — see pollBars's own comment). Runs
      // regardless of which boot branch follows; pollBars is a no-op with no
      // plate, so this is as safe on the preview/gallery paths as it is live.
      pollBars();
      setInterval(pollBars, BARS_POLL_MS);

      // KI-046: posted every 15s regardless of which boot branch runs below —
      // the beat is about whether the renderer is alive, which is equally true
      // of a preview surface as of the on-air room. Keyed by Host server-side,
      // so a developer tab never covers for a dead on-air shard (see
      // world_heartbeat's docstring).
      setInterval(() => {
        fetch("/world/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ page: "world", frames: framesDrawn }),
        }).catch(() => {});   // a failed beat is the watchdog's problem, not the room's
      }, 15000);

      // B1 evaluation gate: `?gallery=1` lays out both styles against every
      // mood so the options can be compared in one screenshot. Aesthetics is
      // the thing no assertion grades, so it needs to be *lookable*.
      if (new URLSearchParams(location.search).get("gallery") === "1") {
        drawGallery();
        return;
      }
      // `?anims=1` — the other half of the eval gate, and the half that was
      // missing: sixteen named animations shipped without anyone ever seeing
      // one. Every animation, on both cast bodies, looping. LOCAL ONLY — 32
      // characters ticking is not something to point a browser source at.
      if (new URLSearchParams(location.search).get("anims")) {
        drawAnimationSheet();
        return;
      }

      // B8's evaluation gate. The plan said "trigger via a synthetic tier-3
      // world event" — but `world_events` is append-only and its entire worth
      // is that it is true, which is the trade B4 already refused. So the
      // choreography runs here instead, on a LOCAL-ONLY surface the way
      // `?anims=1` does: no row is written, and nothing points a browser source
      // at it. Returns before subscribe(), which is also what makes it
      // screenshottable — headless Chrome hangs on this page's SSE.
      //
      // The severity is taken from the injected cuts rather than typed in, so
      // the preview swells for the same reason the live room does.
      if (new URLSearchParams(location.search).get("swell")) {
        const cuts = TIER_CUTS.cuts["model_losing_streak"] ?? TIER_CUTS.generic;
        const rehearse = () => {
          swell.last = -1e9;        // the floor guards the live room, not this
          react({
            event_type: "model_losing_streak",
            symbol: SYMBOLS[0] ?? "BTCUSDT",
            severity: cuts[cuts.length - 1] + 1,
            payload: {},
          });
        };
        rehearse();
        setInterval(rehearse, 12000);
        return;
      }

      await refresh();
      subscribe();
      setInterval(refresh, 60000);   // projection stays authoritative server-side
    }

    function drawGallery() {
      setCharacterVisible(model, false);
      setCharacterVisible(trader, false);
      layers.room.visible = false;   // the floor line is scenery, not a specimen
      layers.plate.visible = false;  // and so is the painted backdrop
      layers.chars.scale.set(1);     // the gallery does its own fitting
      // A representative spread rather than all 23 moods: every style compared
      // across the emotional range they actually have to carry.
      const moods = ["elated", "focused", "anxious", "dejected", "idle",
                     "startled", "bullish", "bearish"];
      // Derive the pitch instead of hard-coding it: at a fixed one, adding the
      // fifth style pushed it off the bottom of the canvas, and an option that
      // can't be seen is an option that never gets evaluated.
      const top = 56;                                    // clear the banner
      const rowH = (app.screen.height - top) / STYLES.length;
      const colW = app.screen.width / moods.length;
      // A sample is ~220 units tall above its feet (the mood tag) and ~60
      // below (name + style), so 320 per row leaves a margin at any height.
      const fit = Math.min(1, rowH / 320, colW / 200);
      STYLES.forEach((style, row) => {
        moods.forEach((mood, col) => {
          const sample = character(mood, style);
          sample.container.scale.set(fit);
          sample.container.x = colW * (col + 0.5);
          sample.container.y = top + rowH * row + 220 * fit;
          sample.baseX = sample.container.x;
          sample.baseY = sample.container.y;
          sample.headBaseY = sample.head.y;
          setExpression(sample, mood);
          sample.moodTag.text = mood;
          sample.stat.text = style;
        });
      });
    }

    // Sixteen animations went live without anyone seeing one: a still frame
    // can't show motion, and three of them (wave, shake, flicker) are at or
    // near zero displacement at any phase you'd think to freeze. So the sheet
    // LOOPS them, through `advanceCharacters` — a sheet with its own player
    // would be showing me an animation nobody ships.
    // C2 review round 1, Finding 2b: this sheet is the ticket's own
    // prescribed check ("check that in every frame of every trader animation
    // the figure stays in the chair") - the real query param is `?anims=`,
    // not the brief's invented `?sheet=1`. Before this fix it was
    // unperformable: `character(style, style)` passes a BODY-STYLE name
    // ("figure") where `anchorFor` wants a CHARACTER name ("trader"), so
    // every sample resolved pose:"standing" and seatedRig never ran here,
    // and `asleep`/`gesture`/`breathe` aren't ANIM keys at all, so they
    // could not even be listed.
    function drawAnimationSheet() {
      setCharacterVisible(model, false);
      setCharacterVisible(trader, false);
      layers.room.visible = false;
      layers.plate.visible = false;
      // Deliberately not the gallery's scale-1: `slump` moves a head 13.5px,
      // and whether that reads as dejected or as a head in a torso is a
      // question about broadcast size. Tier-3 amplitude, for the same reason.
      layers.chars.scale.set(CAST_SCALE);
      const amp = 0.6 + 3 * 0.25;
      // `?anims=slump` narrows to one animation across every body — iterating
      // on a single pose against 32 looping cells is how you miss things.
      const only = new URLSearchParams(location.search).get("anims");
      // Cells are (character-name, body-style, animation-name) triples, not
      // a name x style cross product: `gesture`/`breathe`/`asleep` only mean
      // anything for the trader, and trying them against the model's bars
      // body would call `SEATED_ANIMATIONS[name] || ANIM[name]` with both
      // sides undefined and throw.
      let cells;
      if (ANIM[only]) {
        // Unchanged from before this fix: one animation surveyed across
        // every candidate body, standing, for comparing body TYPES rather
        // than casting - `style` stays the sample's own name here on purpose.
        cells = STYLES.map((style) => [style, style, only]);
      } else if (SEATED_ANIMATIONS[only] && !ANIM[only]) {
        cells = [["TRADER", CAST.TRADER, only]];
      } else {
        cells = [
          ...Object.keys(ANIM).map((name) => [CAST.MODEL, CAST.MODEL, name]),
          // "TRADER", not CAST.TRADER twice - the one change that makes
          // `anchorFor("trader")` resolve `pose: "seated"` and seatedRig run.
          ...Object.keys(ANIM).map((name) => ["TRADER", CAST.TRADER, name]),
          // The three names ANIM doesn't have at all - otherwise declared
          // and never once seen, the exact defect this ticket is about.
          ...Object.keys(SEATED_ANIMATIONS)
            .filter((name) => !ANIM[name])
            .map((name) => ["TRADER", CAST.TRADER, name]),
        ];
      }
      const total = cells.length;
      const cellW = 250;
      const cols = Math.max(1, Math.floor(app.screen.width / cellW));
      const rows = Math.ceil(total / cols);
      // A cell shorter than this overlaps its neighbour's labels. The sheet is
      // a local page, so it runs off the bottom of a short window rather than
      // shrinking the thing whose size is the question.
      const rowH = Math.max(330, (app.screen.height - 40) / rows);
      cells.forEach(([name, style, anim], idx) => {
        const sample = character(name, style);
        sample.container.x = cellW * ((idx % cols) + 0.5) / CAST_SCALE;
        sample.container.y =
          (40 + rowH * Math.floor(idx / cols) + rowH * 0.86) / CAST_SCALE;
        sample.baseX = sample.container.x;
        sample.baseY = sample.container.y;
        sample.headBaseY = sample.head.y;
        setExpression(sample, "focused");
        sample.moodTag.text = anim;
        sample.stat.text = "";
        sample.loopAnim = anim;
        sample.amp = amp;
        sample.duration = ANIM_DURATION[anim] ?? 0.9;
        sample.phase = (idx * 0.13) % 1;   // stagger, so it isn't a chorus line
        cast.push(sample);
      });
    }

    function label(text, x, y, size, tint) {
      const t = new PIXI.Text({ text, style: {
        fill: tint ?? 0xd1d4dc, fontFamily: "system-ui", fontSize: size,
      }});
      t.x = x; t.y = y;
      return t;
    }

    // B2: the room is built ONCE and only its alpha and tint are animated.
    // OBS renders this in software on a box that also encodes 1080p, and a
    // full-canvas Graphics rebuilt per frame is the one way this ticket could
    // cost the stream frames — it currently drops zero.
    let floorLine, wall, floorPlane, vignette;

    // Scene-wide lighting per tier, from world/visuals.py — a canvas-shaped
    // ramp, deliberately not the DOM one (see `room_light`). Eased toward,
    // never snapped to: escalate and decay are the *ambient* half of
    // calm-that-swells, so the room brightens over seconds, not on a frame.
    const ROOM_LIGHT = __ROOM_LIGHT_JSON__;

    // The vignette only. PIXI v8 *does* have `FillGradient` (the wall below
    // uses it) — but its radial path cannot express a transparent centre:
    // `buildRadialGradient` pre-fills the whole gradient texture with the LAST
    // colour stop before painting the ramp over it, and our last stop is opaque
    // black, so a source-over ramp of transparent-black changes nothing and the
    // room renders as a solid black rectangle. Measured, not guessed: against
    // the canvas version this came out max delta 255/255, mean 51.5.
    // Faking it with stacked Graphics bands was the other thing tried, and it
    // reads as a wireframe. So: canvas texture, built on layout only (boot +
    // resize), never per frame.
    function gradientSprite(paint, w, h) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(w));
      canvas.height = Math.max(1, Math.ceil(h));
      paint(canvas.getContext("2d"), canvas.width, canvas.height);
      return new PIXI.Sprite(PIXI.Texture.from(canvas));
    }

    let plateReady = false;

    // The plate is a new hard on-air dependency, which is precisely the shape
    // of KI-045 — and KI-047 is the same page going white for 36 hours because
    // nothing noticed a dead renderer. So the failure path is written first and
    // the success path is the special case: no plate, no manifest, or a texture
    // that will not decode all land in the procedural room the stream already
    // ships.
    async function drawPlate() {
      if (!PLATE_SRC) { drawProceduralRoom(); return; }
      try {
        const texture = await PIXI.Assets.load(PLATE_SRC);
        const sprite = new PIXI.Sprite(texture);
        sprite.width = PLATE.canvas[0];
        sprite.height = PLATE.canvas[1];
        // Nearest-neighbour: the plate is pixel art, and smoothing it is the
        // one thing guaranteed to make it look worse than the room it replaces.
        texture.source.scaleMode = "nearest";
        layers.plate.addChild(sprite);
        // Built once, right here — never inside the per-frame ticker. See
        // buildGlows's own comment for why.
        buildGlows();
        // M2: one Graphics per painted monitor, same "build once" rule —
        // never inside drawCandles or the poll loop. See buildMonitorGraphics
        // below.
        buildMonitorGraphics();
        // Claimed only once BOTH builders have actually succeeded — not
        // before them. Every other read of `plateReady` (the vignette gate,
        // applyGlow, drawCandles) treats it as "the room is safe to light as
        // painted"; claiming it before the builders ran let a throw inside
        // either leave the flag true while the catch below drew the
        // procedural room on top of the still-added plate sprite — plate and
        // procedural room composited together, a darkened double-exposure.
        plateReady = true;
        // The plate reserves a quiet strip at the top for the newcomer line.
        // Bind the banner to the measurement so a repaint moves the text with
        // the art instead of hanging it over a painted detail.
        // The bottom band has no element on this page yet — /world has no
        // price band — so nothing is bound to PLATE.bands.bottom rather than
        // shipping a guard that can never fire.
        const banner = document.getElementById("banner");
        const bandHeight = bannerMinHeight();
        if (banner && bandHeight) {
          banner.style.minHeight = bandHeight + "px";
        }
      } catch (err) {
        // Deliberately NOT retryBoot(): a reload cannot conjure a missing
        // texture, and a reload storm against a 404 helps nobody (the cap in
        // retryBoot exists for exactly that). Degrade and carry on.
        console.warn("plate failed to load", err);
        // `plateReady` is still false here by construction (see the comment
        // above) — but the sprite may already be sitting in `layers.plate`
        // if the throw came from a builder rather than the texture load
        // itself. Strip it before drawing the fallback, or the room reads as
        // plate-and-procedural-room composited rather than a clean degrade.
        layers.plate.removeChildren();
        drawProceduralRoom();
      }
    }

    function drawProceduralRoom() {
      wall = new PIXI.Graphics();
      floorPlane = new PIXI.Graphics();
      floorLine = new PIXI.Graphics();
      vignette = new PIXI.Container();
      layers.room.addChild(wall, floorPlane, floorLine);
      // Above everything, including the characters: a vignette the cast stood
      // in front of would be a grey rectangle, not a darkened room.
      app.stage.addChild(vignette);
      layoutRoom();
    }

    // The renderer follows the window (`resizeTo`), and the characters are
    // re-placed on every draw — so a floor drawn once at boot drifts off them
    // and they end up standing through it. Same expression, same moment.
    function layoutRoom() {
      if (!floorLine) return;
      const w = app.screen.width, h = app.screen.height, ground = h * GROUND;
      floorLine.clear().rect(0, ground, w, 3).fill(0x2a2e39);

      // Depth in three pieces: a back wall darkening toward the ceiling, a
      // floor plane a shade lighter, and a vignette closing the corners.
      // `textureSpace: "global"` takes the same pixel coordinates the canvas-2D
      // version did, so this is a straight port — verified pixel-for-pixel
      // against it (max delta 1/255, and that one is a sub-pixel row the canvas
      // version gained by rounding `ground` up).
      wall.clear().rect(0, 0, w, ground).fill(new PIXI.FillGradient({
        textureSpace: "global",
        start: { x: 0, y: 0 },
        end: { x: 0, y: ground },
        colorStops: [
          { offset: 0, color: "rgba(0,0,0,0.42)" },
          { offset: 1, color: "rgba(0,0,0,0)" },
        ],
      }));

      floorPlane.clear().rect(0, ground, w, h - ground)
        .fill({ color: 0xffffff, alpha: 0.022 });

      vignette.removeChildren();
      vignette.addChild(gradientSprite((ctx, cw, ch) => {
        const g = ctx.createRadialGradient(
          cw / 2, ch / 2, Math.min(cw, ch) * 0.32,
          cw / 2, ch / 2, Math.max(cw, ch) * 0.72,
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(0.6, "rgba(0,0,0,0.45)");
        g.addColorStop(1, "rgba(0,0,0,1)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, cw, ch);
      }, w, h));
    }

    // The symbol pillars — and they are pillars now. They were horizontal bars
    // pinned to the top-right at a fixed 140px pitch, which clipped the first
    // one clean off the canvas at 1080p and read as stray UI rather than as
    // anything in the room. Now they stand ON the floor the characters stand
    // on, sized from the canvas, behind the cast (`layers.props`), so the room
    // has a background made of the market itself.
    // --- P5: the layout is read off the plate, not off the canvas ----------
    // With a plate, every position here is a measurement taken from the
    // painted room (world/plate.py, checked against the PNG itself). Without
    // one — a missing manifest, a texture that will not decode, KI-045's shape
    // — they fall back to the canvas fractions the procedural room has always
    // used, so the degraded path stays exactly as watchable as it is today.
    // Both branches are executed in node by tests/api/test_world_page.py;
    // substring checks over the page could not tell them apart.
    const CAST_FRACTIONS = { model: 0.32, trader: 0.62 };

    function anchorFor(name) {
      const painted = plateReady && PLATE && PLATE.cast ? PLATE.cast[name] : null;
      if (painted) {
        // `pose` is the plate's answer to "is there a chair here" — the trader
        // is seated on this plate. C2 rebuilds the rig around it; it is
        // returned rather than assigned so there is no dead write waiting for
        // that ticket.
        return {
          x: painted.x,
          baseY: painted.base_y,
          pose: painted.pose || "standing",
        };
      }
      return {
        x: app.screen.width * (CAST_FRACTIONS[name] ?? 0.5),
        baseY: app.screen.height * GROUND,
        pose: "standing",
      };
    }

    // How tall the newcomer banner must be to sit on the strip the plate left
    // quiet for it. `null` means "no plate — leave the CSS alone". A value
    // rather than a branch inside drawPlate, because a test can only run a
    // value: asserting the manifest key appears in the function passed
    // identically with the height hardcoded.
    function bannerMinHeight() {
      if (!plateReady || !PLATE || !PLATE.bands || !PLATE.bands.top) return null;
      return PLATE.bands.top;
    }

    function tubeFor(symbol) {
      if (!plateReady || !PLATE || !PLATE.tubes) return null;
      return PLATE.tubes.find((tube) => tube.symbol === symbol) || null;
    }

    // Where one pressure pillar goes. Separated from the drawing so it can be
    // run without PIXI: an off-by-tens against the painted bore is the whole
    // risk of this ticket, and it is the kind of thing only arithmetic can
    // catch before X2 puts it on air.
    function pillarGeometry(symbol, pressure, index) {
      const tube = tubeFor(symbol);
      const ground = app.screen.height * GROUND;
      const tallest = Math.min(ground - 120, app.screen.height * 0.42);
      const baseY = tube ? tube.base_y : ground;
      const width = tube ? tube.width : 54;
      // A painted tube is a housing with a visible end: the bar may fill it,
      // never overrun it. Without a plate the old ceiling still applies.
      const maxHeight = tube ? tube.height : tallest;
      // Tall enough to be architecture. At 70px they read as bins next to a
      // 240px cast; a pillar has to give the room a vertical.
      const height = Math.min(190 + Math.abs(Number(pressure) || 0) * 70, maxHeight);
      // Right of the cast and marching off toward the corner when procedural,
      // so they read as depth rather than as a chart; centred in the bore when
      // the plate painted one.
      const x = tube ? tube.x - width / 2 : app.screen.width * 0.80 + index * 132;
      return { x, baseY, width, height };
    }

    function drawPillars(state) {
      // M2: the monitor Graphics live in their OWN layer (layers.monitors),
      // never in layers.props — this removeChildren() only ever touches
      // pillars/caps/labels, the things drawPillars/draw() itself put here.
      layers.props.removeChildren();
      const symbols = Object.entries(state.symbols ?? {})
        .filter(([symbol]) => SYMBOLS.includes(symbol));
      if (!symbols.length) return;
      symbols.forEach(([symbol, data], i) => {
        const geo = pillarGeometry(symbol, data.pressure, i);
        // The tube fill is a column of discrete cells, not a smooth
        // roundRect — decided 2026-08-25 from the reference image, which
        // draws it as stacked units. One cell of gap every two blocks so the
        // column reads as filled units rather than a single bar.
        const pillar = new PIXI.Graphics();
        const blocks = Math.floor(geo.height / (CELL * 2));
        for (let b = 0; b < blocks; b++) {
          pillar.rect(snap(geo.x), snap(geo.baseY - (b + 1) * CELL * 2), geo.width, CELL)
                .fill({ color: color(data.mood), alpha: 0.85 });
        }
        // A cap catches the light: without it a flat column reads as a bar
        // chart, which is the model's body, not the room's furniture.
        const cap = new PIXI.Graphics()
          .roundRect(geo.x - 4, geo.baseY - geo.height - 6, geo.width + 8, 8, 3)
          .fill({ color: color(data.mood), alpha: 0.8 });
        layers.props.addChild(pillar, cap,
          label(symbol, geo.x - 6, geo.baseY + 12, 13, 0x787b86),
          label(data.mood, geo.x - 6, geo.baseY + 30, 13, 0x5a6472));
      });
    }

    // --- B1: procedural characters ----------------------------------------
    // The inhabitants were colour-swatch circles: the room had a mood but no
    // face, and reactions.py's named animations (jolt/shake/hop/…) existed only
    // as strings. Both are real now. Procedural geometry only — no external
    // assets, so the CSP/SRI rule holds and there is no asset pipeline.
    const REACTIONS = __REACTIONS_JSON__;
    // The bodies are built from the market's own glyphs rather than from
    // anatomy. This world is made of price data; its inhabitants should be
    // too — and a candle or a bar cluster still reads at 120px on a stream,
    // where limbs turn to mush. The face is identical across all of them.
    const STYLES = ["bars", "figure", "candle", "monolith", "orb"];
    // The pick (2026-08-12). Not one style for everyone: the MODEL is a machine
    // built out of the market's own glyphs, the TRADER is a person. Two events
    // land on two silhouettes you can tell apart at a glance and across the
    // room — which is what makes "they disagreed" legible without labels.
    const CAST = { MODEL: "bars", TRADER: "figure" };
    // `?style=` overrides the whole cast — it exists for evaluation, so it has
    // to be able to put everyone in the same body for comparison.
    const STYLE_OVERRIDE = new URLSearchParams(location.search).get("style");

    // Where the floor is, and how big the cast stands on it. Both were spelled
    // 0.72 in three places, which is how the floor and its inhabitants came
    // apart in the first place.
    const GROUND = 0.66;
    // The pair read as two small icons on a wide dark plane — about a quarter
    // of the frame, which on a phone-sized YouTube window is nothing. The
    // LAYER carries the scale, not the characters: half the named animations
    // set `container.scale` themselves and would clobber a per-character one.
    //
    // 1.5, not 1.35 (review round 1, Finding 1): `positionCharacters` divides
    // every anchor by CAST_SCALE before assigning it, and this layer then
    // re-multiplies by the same factor — rendered position on the painted
    // plate is provably invariant to CAST_SCALE, so changing it moves nothing
    // and only resizes the cast. What it DOES change is the on-screen size of
    // the cast's own 4px local grid: at 1.35 that renders as 5.4 screen px,
    // which `roundPixels` then rounds to 5 or 6 depending on phase — the step
    // JITTERS, worse than a fixed off-grid value. At 1.5 it renders as an
    // exact 6 screen px: integer, uniform, no jitter, and every `snap()` call
    // site in the cast stays correct with the one CELL/snap definition — no
    // second snap function for a second coordinate space, which is a second
    // definition of the same rule that later tickets would have to choose
    // between.
    //
    // Known residual, left deliberate rather than hidden: the cast now renders
    // on a uniform 6px cell while the props (pillars) render on a true 4px
    // cell — a consistent grid PER SURFACE, not one 4px grid across the whole
    // room. Strict single-grid conformance needs CAST_SCALE = 1, a 26% shrink
    // of the only two figures on screen, which trades this sprint's headline
    // goal (watchability) for a parenthetical. One constant to reverse after
    // a visual check, not a redesign.
    const CAST_SCALE = 1.5;

    function styleFor(name) {
      const style = STYLE_OVERRIDE || CAST[name];
      return BODIES[style] ? style : "bars";
    }

    // Expression as two axes rather than 19 hand-drawn faces: valence bends
    // the mouth, arousal opens the eyes and lifts the brows. Every mood the
    // reactions registry can emit has an entry (page test enforces it); an
    // unknown one lands on neutral rather than a blank stare.
    const FACE = {
      elated:    { valence:  1.0, arousal: 0.9 },
      relieved:  { valence:  0.7, arousal: 0.2 },
      proud:     { valence:  0.8, arousal: 0.5 },
      eager:     { valence:  0.7, arousal: 0.8 },
      decisive:  { valence:  0.4, arousal: 0.7 },
      focused:   { valence:  0.0, arousal: 0.6 },
      attentive: { valence:  0.1, arousal: 0.5 },
      speaking:  { valence:  0.2, arousal: 0.5 },
      weighing:  { valence: -0.1, arousal: 0.3 },
      idle:      { valence:  0.0, arousal: 0.0 },
      neutral:   { valence:  0.0, arousal: 0.3 },
      surprised: { valence:  0.2, arousal: 1.0 },
      startled:  { valence: -0.2, arousal: 1.0 },
      alert:     { valence:  0.0, arousal: 0.9 },
      anxious:   { valence: -0.5, arousal: 0.8 },
      alarmed:   { valence: -0.7, arousal: 1.0 },
      resigned:  { valence: -0.4, arousal: 0.1 },
      dejected:  { valence: -0.9, arousal: 0.2 },
      grim:      { valence: -0.8, arousal: 0.4 },
      calm:      { valence:  0.1, arousal: 0.2 },
      bullish:   { valence:  0.8, arousal: 0.6 },
      bearish:   { valence: -0.8, arousal: 0.6 },
      panicked:  { valence: -1.0, arousal: 1.0 },
    };

    function faceFor(mood) {
      return FACE[mood];
    }

    // Each body is a market glyph. `accents` are the parts that can move
    // independently of the mass — wicks, bars — which is what gives these
    // silhouettes something to act with in place of limbs.
    const BODIES = {
      // A candlestick: real body between two wicks. The project's own glyph,
      // and the one that reads most instantly as "this thing is the market".
      candle(body, accents) {
        body.roundRect(snap(-27), snap(-104), 54, 84, 8).fill(BODY_FILL).stroke(BODY_RIM);
        // Wick thick enough to read as a neck at stream distance, and short
        // enough that the head sits ON the candle rather than floating over it.
        const wickTop = new PIXI.Graphics().roundRect(snap(-3.5), snap(-130), 7, 30, 3.5)
          .fill(BODY_FILL).stroke(BODY_RIM);
        const wickLow = new PIXI.Graphics().roundRect(snap(-3.5), snap(-22), 7, 26, 3.5)
          .fill(BODY_FILL).stroke(BODY_RIM);
        // A wick flicks by lengthening. It cannot swing: it's drawn in the
        // character's own space, so rotating it pivots about the feet.
        wickTop.gestureMode = wickLow.gestureMode = "pump";
        accents.push(wickTop, wickLow);
        return -142;
      },
      // A cluster of bars — volume, an equaliser, a heartbeat. The most
      // animatable body: the bars themselves can jump, ripple and settle.
      bars(body, accents) {
        const heights = [54, 86, 68, 96, 60];
        heights.forEach((h, i) => {
          const bar = new PIXI.Graphics()
            .roundRect(snap(-6), snap(-h), 12, h, 4).fill(BODY_FILL).stroke(BODY_RIM);
          bar.x = -36 + i * 18;
          bar.restHeight = h;
          bar.gestureMode = "pump";   // the ripple IS the gesture for a cluster
          accents.push(bar);
        });
        // A static stem, so the head isn't left hovering over the cluster the
        // way it was. It can't be one of the bars: those ripple, and a neck
        // that stretches would pull the face off the body.
        body.roundRect(snap(-6), snap(-118), 12, 58, 6).fill(BODY_FILL).stroke(BODY_RIM);
        return -138;
      },
      // A weighted column — deliberate, unhurried, hard to topple. The calm
      // end of the register; a piece that looks like it is thinking.
      monolith(body, accents) {
        body.roundRect(snap(-26), snap(-104), 52, 78, 20).fill(BODY_FILL).stroke(BODY_RIM);
        const base = new PIXI.Graphics()
          .roundRect(snap(-38), snap(-30), 76, 30, 14).fill(BODY_FILL).stroke(BODY_RIM);
        base.gestureMode = "shift";   // a weighted column doesn't wave, it leans
        base.restX = 0;
        accents.push(base);
        return -134;
      },
      // A person: torso, two legs, two arms. The one body here that is NOT a
      // market glyph, and that is the point — the trader is the human in the
      // room, so he doesn't get to be made of candles.
      figure(body, accents) {
        // The gap has to be wide enough to survive the stream: at 6 units the
        // two legs merged into one column and he read as a pedestal.
        body.roundRect(snap(-19), snap(-56), 13, 56, 6).fill(BODY_FILL).stroke(BODY_RIM);
        body.roundRect(snap(6), snap(-56), 13, 56, 6).fill(BODY_FILL).stroke(BODY_RIM);
        // Waist under a broader chest. The taper is what reads as a person —
        // one capsule reads as a pill — and the wider shoulders are what stop
        // the head (28px, shared with every other body) looking oversized.
        body.roundRect(snap(-26), snap(-86), 52, 40, 14).fill(BODY_FILL).stroke(BODY_RIM);
        body.roundRect(snap(-33), snap(-128), 66, 54, 22).fill(BODY_FILL).stroke(BODY_RIM);
        for (const side of [-1, 1]) {
          const arm = new PIXI.Graphics().roundRect(snap(-7), snap(-5), 14, 66, 7)
            .fill(BODY_FILL).stroke(BODY_RIM);
          arm.x = side * 36; arm.y = -120;   // pivot at the shoulder
          // Not quite straight and not quite matching: dead-symmetrical arms
          // read as a mannequin, and the asymmetry costs two numbers.
          arm.restRotation = side < 0 ? -0.05 : 0.09;
          // v1's arms were the torso's exact colour, so a resting figure read
          // as a capsule and the arms only appeared mid-animation. A lighter
          // shade separates them from both the body and the dark room.
          arm.shadeFactor = 1.35;
          accents.push(arm);
        }
        // The head overlaps the torso rather than resting on it: a hairline gap
        // at this size reads as a floating head, not as a neck.
        return -152;
      },
      // The original: face on a single disc, no body. Kept as the baseline the
      // others are judged against.
      orb(body) {
        body.circle(snap(0), snap(-60), 46).fill(BODY_FILL).stroke(BODY_RIM);
        return -66;
      },
    };

    // A machine and a person shouldn't wear the same face. The bodies built
    // out of market glyphs get a readout — visor, LED eyes, a stepped mouth,
    // and no brows, because a brow is a muscle. The figure keeps the human
    // one, and so does the orb, which is a face and nothing else.
    const FACE_KIND = {
      bars: "machine", candle: "machine", monolith: "machine",
      figure: "human", orb: "human",
    };

    // One inhabitant: a body whose colour is its mood, a face that reads at a
    // glance, and a label carrying the numbers.
    // How wide a body's contact patch is, per style — the same registry shape
    // as HEAD_TRAVEL, and checked against STYLES for the same reason: a new
    // body that silently inherits someone else's footprint reads as floating.
    const SHADOW_WIDTH = { bars: 34, figure: 30, candle: 22, monolith: 26, orb: 20 };

    // One soft blob, built once and shared. A hard ellipse reads as a sticker
    // and three stacked ellipses band visibly (the same thing that made the
    // first vignette look like a wireframe) — and `FillGradient` cannot do a
    // radial alpha ramp, which is exactly the limitation the wall port found.
    let shadowTexture = null;
    function softShadow() {
      if (!shadowTexture) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(0,0,0,0.85)");
        g.addColorStop(0.5, "rgba(0,0,0,0.42)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        shadowTexture = PIXI.Texture.from(canvas);
      }
      const sprite = new PIXI.Sprite(shadowTexture);
      sprite.anchor.set(0.5);
      return sprite;
    }

    // Light is overhead, so height off the floor spreads the shadow and
    // thins it. This is the whole grounding cue: without it a jump is a body
    // sliding up the screen, and with it the floor is somewhere real.
    // A shadow lives on its own layer, so hiding a character's container does
    // *not* hide it. The animation sheet caught two of them hanging in mid-air
    // where MODEL and TRADER had been. Visibility is a property of the
    // character; both eval surfaces go through here.
    function setCharacterVisible(char, visible) {
      char.container.visible = visible;
      if (char.shadow) char.shadow.visible = visible;
    }

    function shadowTick(char) {
      if (!char.shadow) return;
      const lift = Math.max(0, char.baseY - char.container.y);
      const spread = 1 + lift * 0.004;
      char.shadow.x = char.container.x;
      char.shadow.y = char.baseY + 3;
      char.shadow.width = char.shadowW * 2 * spread;
      char.shadow.height = char.shadowW * 0.46 * spread;
      char.shadow.alpha = 0.55 / (1 + lift * 0.014);
    }

    function character(name, style) {
      style = BODIES[style] ? style : styleFor(name);
      const container = new PIXI.Container();
      container.y = app.screen.height * GROUND;
      // C2: which anchor this name paints against decides the rig. Only the
      // trader is ever seated — the plate's `pose` is the one thing that says
      // so, not a second decision made here. Every other `name` this function
      // is ever called with (moods and styles, from the gallery/sheet eval
      // surfaces) misses PLATE.cast entirely and gets "standing" back.
      container.pose = anchorFor(name.toLowerCase()).pose;

      const body = new PIXI.Graphics();
      const head = new PIXI.Container();
      const skull = new PIXI.Graphics();
      const eyeL = new PIXI.Graphics();
      const eyeR = new PIXI.Graphics();
      const mouth = new PIXI.Graphics();
      const browL = new PIXI.Graphics();
      const browR = new PIXI.Graphics();
      const visor = new PIXI.Graphics();
      const accents = [];

      const headY = container.pose === "seated"
        ? seatedRig(body, accents)
        : BODIES[style](body, accents);
      // The orb *is* the face; every other body carries a head above it.
      if (style !== "orb") skull.circle(snap(0), snap(0), 28).fill(BODY_FILL).stroke(BODY_RIM);
      head.y = headY;
      head.addChild(skull, visor, browL, browR, eyeL, eyeR, mouth);

      const nameTag = label(name, -40, 22, 18);
      const stat = label("", -80, 46, 14, 0x787b86);
      const moodTag = label("", -40, headY - 56, 16, 0x787b86);
      // Accents go behind the mass, so a wick reads as emerging from it.
      container.addChild(...accents, body, head, nameTag, stat, moodTag);
      layers.chars.addChild(container);

      // Seeded off the name, so MODEL and TRADER don't blink in unison — two
      // characters sharing a timer read as one animation on two puppets.
      let seed = 0;
      for (const ch of name) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;

      const shadow = softShadow();
      layers.shadows.addChild(shadow);

      const char = {
        container, body, head, skull, eyeL, eyeR, mouth, browL, browR, visor,
        accents, style, stat, moodTag, faceKind: FACE_KIND[style],
        baseY: container.y, mood: "neutral", anim: null, phase: 0,
        rand: rng32(seed || 1),
        shadow, shadowW: SHADOW_WIDTH[style],
      };
      // The two arms `seatedRig` pushed onto `accents` are real Graphics,
      // already children of `container` — aliased under their own names so
      // the seated animations below have one to reach for by name instead of
      // indexing into the array.
      if (container.pose === "seated") {
        char.armNear = accents[0];
        char.armFar = accents[1];
      }
      // Two characters breathing on one clock read as one animation played on
      // two puppets — the exact thing the blink seed already avoids. Offset
      // the phase *and* vary the period, so they never drift into step either.
      char.phaseOffset = char.rand();
      char.breath = 3.2 * (0.85 + char.rand() * 0.3);
      setExpression(char, "neutral");
      restAccents(char);   // arms hang from their resting angle, not from zero
      return char;
    }

    // Limb-less bodies still need a gesture — but not the same one. Rotating a
    // bar about its own base swings it like a felled tree, and at tier-3
    // amplitude the cluster came apart on cheer/wave/shrug; the candle's wicks
    // were worse, pivoting about the character's *feet*. Only what hangs from
    // a joint swings. Everything else pumps or shifts its weight.
    const GESTURE = {
      swing: (a, amt) => { a.rotation = (a.restRotation ?? 0) + amt * 0.35; },
      pump: (a, amt) => { a.scale.y = 1 + Math.abs(amt) * 0.55; },
      shift: (a, amt) => { a.x = snap((a.restX ?? 0) + amt * 6); },
    };

    function gesture(char, amount, stagger) {
      char.accents.forEach((accent, i) => {
        const offset = stagger ? Math.sin(amount * Math.PI * 2 + i * 0.9) : 1;
        const amt = amount * (i % 2 ? 1 : -1) * (stagger ? offset : 1);
        (GESTURE[accent.gestureMode] ?? GESTURE.swing)(accent, amt);
      });
    }

    function restAccents(char) {
      for (const accent of char.accents) {
        // Rest is not necessarily zero: dead-straight symmetrical arms read as
        // a mannequin, so the figure's hang at a slight, uneven angle.
        accent.rotation = accent.restRotation ?? 0;
        accent.x = snap(accent.restX ?? accent.x);
        accent.scale.set(1, 1);
      }
    }

    // Lighten or darken a mood colour without leaving its hue. Accents that
    // sit ON the body (arms) need to be a different value from it, or they
    // vanish into the mass at stream distance.
    function shade(tint, factor) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
      return (clamp((tint >> 16) & 0xff) << 16)
           | (clamp((tint >> 8) & 0xff) << 8)
           | clamp(tint & 0xff);
    }

    // `liftDark` used to live here: a luminance floor applied to the TINT.
    // It was the right instinct aimed one step short of the pixel — the tint is
    // multiplied by the base fill before anyone sees it, so a tint comfortably
    // above the floor still rendered a body at 1.19:1. It also used the NTSC
    // luma weights on raw sRGB rather than WCAG relative luminance, so its
    // "floor" was not the quantity anyone measures. Both are now done in
    // world/visuals.py against the rendered colour, and the answer arrives
    // precomputed in BODY_TINT (KI-028).

    // Faces are redrawn rather than tweened: a handful of primitives per mood
    // change is far cheaper than keeping a rig, and OBS renders in software.
    function setExpression(char, mood) {
      char.mood = mood;
      const { valence, arousal } = faceFor(mood);
      // Remembered so a blink can redraw the eyes alone and put them back
      // exactly as the mood had them.
      char.face = { valence, arousal };
      char.blinkClosed = false;
      const tint = bodyTint(mood);
      char.visor.clear();
      if (char.faceKind === "machine") {
        machineFace(char, valence, arousal, tint);
      } else {
        humanFace(char, valence, arousal);
      }
      applyTint(char, tint);
    }

    // A readout, not an expression: the same two axes, computed. Arousal lights
    // more of the LED; valence steps the mouth. No brows — a brow is a muscle.
    function machineFace(char, valence, arousal, tint) {
      // 0.14, not 0.35: the skull is a 0x545862 fill *tinted*, so it already
      // renders at roughly a third of the mood colour — a 0.35 visor came out
      // the same value as the head and was invisible on the real page.
      char.visor.roundRect(snap(-21), snap(-16), 42, 23, 8).fill(shade(tint, 0.14));
      machineEyes(char, arousal);
      char.browL.clear();
      char.browR.clear();
      const w = 10 + arousal * 3;
      const step = valence * 6;
      char.mouth.clear()
        .moveTo(snap(-w), snap(12)).lineTo(snap(-w / 3), snap(12 + step))
        .lineTo(snap(w / 3), snap(12 + step)).lineTo(snap(w), snap(12))
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    // Eyes are drawn on their own so a blink can close them without disturbing
    // the mood: `arousal` is passed in rather than read, and a blink passes 0.
    function machineEyes(char, arousal) {
      const lit = 2 + arousal * 5;
      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        eye.roundRect(snap(side * 10 - 6), snap(-5 - lit / 2), 12, lit, 1.5).fill(0xd1d4dc);
      }
    }

    function humanEyes(char, arousal) {
      const open = 2.2 + arousal * 4.2;            // eyelid opening
      const eyeY = -4;
      const dx = char.style === "orb" ? 15 : 10;
      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        if (arousal < 0.08) {
          // Nearly asleep: a closed lid line reads better than a tiny dot.
          eye.roundRect(snap(side * dx - 5), snap(eyeY), 10, 2, 1).fill(0xd1d4dc);
        } else {
          eye.ellipse(snap(side * dx), snap(eyeY), 3.4, open / 2).fill(0xd1d4dc);
        }
      }
    }

    function drawEyes(char, arousal) {
      if (char.faceKind === "machine") machineEyes(char, arousal);
      else humanEyes(char, arousal);
    }

    function humanFace(char, valence, arousal) {
      const eyeY = -4;
      const dx = char.style === "orb" ? 15 : 10;
      humanEyes(char, arousal);
      for (const [brow, side] of [[char.browL, -1], [char.browR, 1]]) {
        brow.clear();
        // Worry raises the INNER brow (y grows downward). Positive moods stay
        // level — angling them the other way reads as anger, which is how the
        // first pass made every happy face look stern.
        const worry = valence < 0 ? -valence : 0;
        const lift = arousal * 3;
        const inner = eyeY - 9 - lift - worry * 4;
        const outer = eyeY - 9 - lift + worry * 3;
        brow.moveTo(snap(side * (dx - 7)), snap(inner))
            .lineTo(snap(side * (dx + 7)), snap(outer))
            .stroke({ width: 2, color: 0x9aa4b2 });
      }
      char.mouth.clear();
      const curve = valence * 7;
      const width = 9 + arousal * 3;
      char.mouth
        .moveTo(snap(-width), snap(10))
        .quadraticCurveTo(snap(0), snap(10 + curve), snap(width), snap(10))
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    function applyTint(char, tint) {
      char.body.tint = tint;
      if (char.skull) char.skull.tint = tint;
      for (const accent of char.accents) {
        accent.tint = accent.shadeFactor ? shade(tint, accent.shadeFactor) : tint;
      }
    }

    // How far `slump` may drop a head, per body. It isn't a style choice: it's
    // how much room the body leaves. The figure's head already overlaps its
    // chest at rest, so the shared 10 buried a third of it and read blobby
    // instead of dejected; the bar cluster has a whole neck to spend.
    const HEAD_TRAVEL = { bars: 12, figure: 4, candle: 8, monolith: 8, orb: 5 };

    // Each named animation from reactions.py, made real. `phase` runs 0->1;
    // every one returns to rest so nothing is ever left sticky-amped.
    // Motion curves. `Math.sin(p * PI)` — a symmetric bump — is what every
    // animation here used, and a symmetric curve is most of what makes
    // procedural motion read as procedural: bodies gather before they move and
    // settle after they arrive. These are applied **per animation**, not as a
    // blanket substitution: `anticipate` and `snap` deliberately return
    // negative values, and several animations feed the curve straight into a
    // scale, where a big enough negative would drive it through zero — the bug
    // `turn` already shipped once. Ranges are noted for that reason.
    const EASE = {
      // -0.18 .. 1 — gathers downward before it rises.
      anticipate: (p) => (p < 0.22
        ? -0.18 * Math.sin((p / 0.22) * Math.PI)
        : Math.sin(((p - 0.22) / 0.78) * Math.PI)),
      // -0.15 .. 1 — hits hard in the first sixth, then rings down to nothing.
      snap: (p) => (p < 0.16
        ? Math.sin((p / 0.16) * (Math.PI / 2))
        : Math.cos(((p - 0.16) / 0.84) * Math.PI * 1.5) * Math.exp(-(p - 0.16) * 3.4)),
      // 0 .. 1 — arrives fast and hangs there. A body that drops doesn't bounce.
      settle: (p) => 1 - Math.pow(1 - Math.sin(p * Math.PI), 2),
    };

    const ANIM = {
      // Breathing, not bobbing. The inhale takes ~40% of the cycle and the
      // exhale the rest, because an even in-and-out is the tell that nothing
      // is alive in there. The chest rises and widens fractionally; at this
      // amplitude it is felt rather than seen, which is the point — it runs
      // 24/7 behind everything else.
      idle:    (c, p) => { const u = p < 0.4
                              ? Math.sin((p / 0.4) * Math.PI - Math.PI / 2)
                              : Math.sin(((p - 0.4) / 0.6) * Math.PI + Math.PI / 2);
                           c.container.y = snap(c.baseY - u * 1.6);
                           c.container.scale.set(1 - u * 0.006, 1 + u * 0.012); },
      jolt:    (c, p, a) => { const u = EASE.snap(p);
                              c.container.y = snap(c.baseY - u * 26 * a);
                              c.container.scale.set(1 + u * 0.08 * a); },
      shake:   (c, p, a) => { c.container.x = snap(c.baseX + Math.sin(p * 42) * 9 * a * (1 - p)); },
      // Crouches before it leaves the floor, and the squash was inverted: it
      // went wide-and-short at the apex and tall-and-thin in the crouch, which
      // is backwards on both. A body in the air stretches along its travel.
      hop:     (c, p, a) => { const j = EASE.anticipate(p);
                              c.container.y = snap(c.baseY - j * 40 * a);
                              c.container.scale.set(1 - j * 0.05 * a, 1 + j * 0.05 * a); },
      pulse:   (c, p, a) => { c.container.scale.set(1 + Math.sin(p * Math.PI * 2) * 0.11 * a); },
      // 0.09, not 0.16: the container pivots at the feet, so a tall body's
      // head swings the full lever arm and 0.16 read as toppling, not leaning.
      lean:    (c, p, a) => { c.container.rotation = Math.sin(p * Math.PI) * 0.09 * a; },
      shrug:   (c, p, a) => { const u = Math.sin(p * Math.PI);
                              gesture(c, u * a, false);
                              c.container.y = snap(c.baseY - u * 6 * a); },
      slump:   (c, p, a) => { const u = EASE.settle(p);
                              c.container.y = snap(c.baseY + u * 12 * a);
                              c.head.y = snap(c.headBaseY
                                + u * HEAD_TRAVEL[c.style] * a);
                              c.container.scale.set(1, 1 - u * 0.07 * a); },
      cheer:   (c, p, a) => { const u = Math.abs(Math.sin(p * Math.PI * 2));
                              c.container.y = snap(c.baseY - u * 30 * a);
                              gesture(c, u * a, true); },
      wave:    (c, p, a) => { gesture(c, Math.sin(p * Math.PI * 6) * 0.6 * a, false);
                              c.head.rotation = Math.sin(p * Math.PI * 6) * 0.10 * a; },
      sleep:   (c, p) => { const b = Math.sin(p * Math.PI * 2) * 0.02;
                           c.container.scale.set(1 + b, 1 - b); },
      flicker: (c, p) => { c.container.alpha = p % 0.25 < 0.125 ? 0.35 : 1; },
      step:    (c, p, a) => { c.container.x = snap(c.baseX + Math.sin(p * Math.PI) * 26 * a); },
      // A flat character can't rotate away, but it must not vanish trying: the
      // old cos() passed through zero twice a cycle and collapsed to a sliver.
      // Squash to 40% and turn the head — that reads as looking round.
      turn:    (c, p, a) => { const u = Math.cos(p * Math.PI * 2);
                              c.container.scale.x = 0.4 + 0.6 * Math.abs(u);
                              c.head.rotation = -u * 0.22 * a; },
      pan:     (c, p, a) => { c.container.x = snap(c.baseX + Math.sin(p * Math.PI) * 10 * a); },
      talk:    (c, p) => { const o = Math.abs(Math.sin(p * Math.PI * 8));
                           c.mouth.scale.y = 1 + o * 1.6;
                           gesture(c, o * 0.25, true); },
    };

    function playAnimation(char, animation, tier) {
      // A reaction takes the body back off idle: a half-finished weight shift
      // left under an animation is a character reacting from a crooked stance.
      resetIdle(char);
      char.anim = animation;
      char.phase = 0;
      // Tier scales amplitude, not choice: the same reaction reads bigger when
      // the event is bigger — calm that swells, on the character itself.
      char.amp = 0.6 + Math.max(0, Math.min(tier, 3)) * 0.25;
      char.duration = (ANIM_DURATION[animation] ?? 0.9);
    }

    const ANIM_DURATION = {
      sleep: 4.0, idle: 3.2, talk: 1.6, wave: 1.4, flicker: 1.0, cheer: 1.2,
    };

    // --- C2: TRADER, seated -------------------------------------------------
    // Everything from the neck up is untouched — `character()` still builds
    // the head, the face and the blink the same way for every body. Only
    // what's below the neck is re-drawn here, hips at the container's own
    // origin: `positionCharacters` puts that on the seat of the painted
    // chair, not on a floor 148px below it (Task 7's Override 2).
    function seatedRig(body, accents) {
      // Thighs: short and low, at the front edge of the seat rather than
      // dropping to a floor this plate doesn't give the chair.
      body.roundRect(snap(-22), snap(-6), 18, 16, 6).fill(BODY_FILL).stroke(BODY_RIM);
      body.roundRect(snap(4), snap(-6), 18, 16, 6).fill(BODY_FILL).stroke(BODY_RIM);
      // Waist and chest, stacked straight up off the hips rather than off a
      // standing pair of legs. Review round 1, Finding 1: the seat measures
      // 79 screen px wide (`PLATE.cast.trader.seat.width`), and 58 units of
      // chest was 87px at CAST_SCALE 1.5 (still 78.3px at the pre-ticket
      // 1.35 - the rig's own width was the overflow, not the scale). Chest
      // is 48 (not the naive 50 - snap(-24)=-24 exactly, snap(-25) rounds to
      // -24 too but off-centre, pushing one edge to 26; picking start/width
      // that land clean on the 4px grid keeps the shape actually symmetric)
      // - 48*1.5=72px, inside the seat with margin.
      // `test_the_seated_rig_fits_inside_the_painted_seat_not_just_the_
      // backrest` (page) and `test_the_seated_rig_fits_inside_the_manifest_
      // seat` (manifest) both compute this from the real roundRect calls
      // against the manifest's measurement, rather than trusting this
      // comment's arithmetic.
      body.roundRect(snap(-20), snap(-42), 40, 34, 14).fill(BODY_FILL).stroke(BODY_RIM);
      body.roundRect(snap(-24), snap(-80), 48, 40, 20).fill(BODY_FILL).stroke(BODY_RIM);
      // Forearms bent up toward the desk, not hanging at the sides — shorter
      // than the standing figure's (66 units). Pivot at 14: the arm's own
      // local rect snaps to [-4, 8], so a wider pivot pushes its outer edge
      // past the chest and becomes the new widest part.
      for (const side of [-1, 1]) {
        const arm = new PIXI.Graphics().roundRect(snap(-6), snap(0), 12, 40, 6)
          .fill(BODY_FILL).stroke(BODY_RIM);
        arm.x = side * 14; arm.y = -76;
        arm.restRotation = side < 0 ? -0.55 : 0.5;
        arm.shadeFactor = 1.35;
        accents.push(arm);
      }
      // Chair back measures ~220 screen px above the seat (backrest crown at
      // plate y≈462 vs the seat anchor y≈682) — 147 local units at
      // CAST_SCALE 1.5. -108 leaves the 42px head crown at screen y≈478:
      // inside the backrest. Unaffected by the width change - orthogonal axis.
      return -108;
    }

    // Every write below moves the torso (`body`), the head, or an arm —
    // never `container`, the hips, fixed to the chair by
    // `positionCharacters`. A standing animation moves the whole body, which
    // is how a seated one sinks through the cushion or slides out of it.
    const SEATED_ANIMATIONS = {
      // The rotation leads on purpose: `HEAD_TRAVEL.figure` is exactly one
      // CELL, so the snapped head-drop alone can round back to nothing for
      // most of the phase at tier 0. `body.rotation` isn't quantised.
      slump:   (c, p, a) => { const u = EASE.settle(p);
                              c.body.rotation = u * 0.16 * a;
                              c.head.rotation = u * 0.10 * a;
                              c.head.y = snap(c.headBaseY + u * HEAD_TRAVEL[c.style] * a); },
      lean:    (c, p, a) => { const u = Math.sin(p * Math.PI) * a;
                              c.body.x = snap(u * 4);
                              c.head.x = snap(u * 6); },
      // No shoulder swing — the desk is in the way. One forearm lifts and
      // turns instead: the gesture a seated person has room to make.
      gesture: (c, p, a) => { const u = Math.sin(p * Math.PI) * a;
                              c.armFar.rotation = (c.armFar.restRotation ?? 0) - u * 0.6; },
      // The seated ambient loop. Full CELL, not half: `body.y` rests at 0,
      // already on the grid, so a smaller delta snaps straight back to it.
      breathe: (c, p) => { c.body.y = snap(Math.sin(p * Math.PI * 2) * CELL); },
      // Head drops, eyes close via the same closed-lid draw the idle blink
      // uses (`setBlink`) — not `visible = false`, which reads as empty
      // sockets rather than a person asleep.
      asleep:  (c, p, a) => { const u = EASE.settle(p);
                              c.head.rotation = 0.22 * u;
                              c.head.y = snap(c.headBaseY + CELL * 3 * u);
                              setBlink(c, u > 0.5); },
      // `trader_milestone`'s own beat, not borrowed: both forearms pump up
      // together, twice within the phase — the double-lift standing `cheer`
      // uses — kept off `container` so the trader stays seated at the desk
      // it just closed a profitable position at. `trader_opened` fires on
      // every cold sidecar start, so unlike the other trader_* reactions
      // this one is guaranteed to run the moment the opt-in profile is ever
      // enabled, and "proud" deserves to read as distinct from "resigned".
      cheer:   (c, p, a) => { const u = Math.abs(Math.sin(p * Math.PI * 2)) * a;
                              c.armNear.rotation = (c.armNear.restRotation ?? 0) - u * 0.5;
                              c.armFar.rotation = (c.armFar.restRotation ?? 0) + u * 0.5;
                              c.body.y = snap(-u * CELL); },
    };
    // The registry (world/reactions.py) dispatches `sleep`/`shrug`, never
    // the literal `asleep`/`gesture` — aliased onto the names that actually
    // arrive so the re-author is live on real events, not just declared.
    // `shrug` especially: standing writes `container.y`, the hip-lift this
    // table exists to stop.
    SEATED_ANIMATIONS.sleep = SEATED_ANIMATIONS.asleep;
    SEATED_ANIMATIONS.shrug = SEATED_ANIMATIONS.gesture;
    // `trader_*` (world/reactions.py: trader_opened -> step, trader_closed ->
    // turn, trader_milestone -> cheer) is the vocabulary EVERY event routed
    // to the trader can carry — `react()` sends every trader_* type there,
    // never through `model`. None of `step`/`turn` had a seated match: a
    // standing `step` slides the body 26px off the cushion, and `turn`
    // squashes `scale.x` to 0.4 inside a full-width chair — both landed on
    // `container`, the exact write this table exists to stop. `step`
    // ("decisive") reuses the seated lean; `turn` ("weighing") reuses the
    // seated gesture — a considering forearm motion reads as weighing a
    // decision at least as well as it reads as a shrug. `cheer` is defined
    // directly above rather than aliased: milestones are the one distinctly
    // celebratory trader reaction and deserve their own beat.
    SEATED_ANIMATIONS.step = SEATED_ANIMATIONS.lean;
    SEATED_ANIMATIONS.turn = SEATED_ANIMATIONS.gesture;

    function restCharacter(char) {
      if (char.container.pose === "seated") {
        restSeatedCharacter(char);
        return;
      }
      char.container.y = snap(char.baseY);
      char.container.x = snap(char.baseX);
      char.container.rotation = 0;
      char.container.alpha = 1;
      char.container.scale.set(1, 1);
      setGaze(char, 0, 0, 0);
      char.mouth.scale.y = 1;
      restAccents(char);
      if (char.headBaseY != null) char.head.y = snap(char.headBaseY);
    }

    // The seated counterpart: puts back everything SEATED_ANIMATIONS can
    // touch (body, head, the arms via restAccents, blink), and leaves
    // `container` alone — it's the chair, not the body, and the standing
    // reset above would yank the trader back to a floor this pose doesn't
    // stand on.
    function restSeatedCharacter(char) {
      char.body.rotation = 0;
      char.body.x = 0;
      char.body.y = 0;
      char.head.rotation = 0;
      setGaze(char, 0, 0, 0);
      char.mouth.scale.y = 1;
      restAccents(char);
      if (char.headBaseY != null) char.head.y = snap(char.headBaseY);
      setBlink(char, false);
      char.container.alpha = 1;
    }

    // --- B7: idle life, and attention -------------------------------------
    // Seeded, not ad-hoc: the eval gate for calm is one quiet frame compared
    // against another, and unseeded drift makes two calm frames incomparable.
    // The director already treats RNG as something you inject; so does the room.
    function rng32(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Each behaviour owns exactly one property and eases 0->1->0, so two can
    // overlap the way they do in life (you shift your weight while looking
    // somewhere) without fighting over the same transform.
    const IDLE_ACTIONS = {
      blink: {
        every: [2.4, 6.5], dur: 0.16,
        run: (c, u) => setBlink(c, u > 0.45),
      },
      glance: {
        every: [5.0, 13.0], dur: 1.8,
        run: (c, u, dir) => setGaze(c, dir * 2.5 * u, dir * 0.05 * u, 0),
      },
      shift: {
        every: [7.0, 17.0], dur: 2.6,
        run: (c, u, dir) => {
          // Task 7's Override 3: for a seated character `container` IS the
          // chair (`positionCharacters` anchors it to the plate's seat), so
          // the weight-shift this idle action stages moves the torso
          // instead — same amplitude, same "under one CELL" reasoning C1
          // used to leave it unsnapped, applied to the write this ticket's
          // whole table exists to keep off the hips.
          if (c.container.pose === "seated") { c.body.x = dir * 3 * u; return; }
          c.container.x = c.baseX + dir * 3 * u;
        },
      },
    };

    // Looking is done with the eyes, not by sliding the skull sideways: a head
    // that translates reads as a part coming loose, on the machine especially,
    // where it sits on a visible stem. The head only rotates.
    //
    // Review round 1, Finding 2: the idle glance (IDLE_ACTIONS.glance) and the
    // B7 deliberate look (watchTick) both drive `dx`/`headShift` through a
    // continuous sin() ease, and watchTick's amplitude (4) is exactly one
    // CELL — unsnapped, that is the sub-pixel crawl this ticket exists to
    // remove. Not literally named in the brief's Step 4 list, but the same
    // reasoning that put `restCharacter` and the `ANIM` table under `snap()`
    // reaches every displacement write, and this is one: wrapped once here so
    // every caller (glance, watchTick, resetIdle) is covered without each of
    // them having to remember to.
    function setGaze(char, dx, rot, headShift) {
      char.eyeL.x = char.eyeR.x = snap(dx);
      char.head.rotation = rot;
      char.head.x = snap(headShift);
    }

    function setBlink(char, closed) {
      if (char.blinkClosed === closed || !char.face) return;   // edges only
      char.blinkClosed = closed;
      drawEyes(char, closed ? 0 : char.face.arousal);
    }

    // Hoisted: this runs per character per frame, and OBS renders in software.
    const IDLE_ENTRIES = Object.entries(IDLE_ACTIONS);

    function idleTick(char, dt) {
      char.idle ??= {};
      for (const [name, spec] of IDLE_ENTRIES) {
        const st = (char.idle[name] ??= { wait: spec.every[0] * char.rand(), t: 0 });
        if (!st.active) {
          st.wait -= dt;
          if (st.wait > 0) continue;
          st.active = true;
          st.t = 0;
          st.dir = char.rand() < 0.5 ? -1 : 1;
        }
        st.t += dt;
        const done = st.t >= spec.dur;
        spec.run(char, done ? 0 : Math.sin((st.t / spec.dur) * Math.PI), st.dir);
        if (done) {
          st.active = false;
          const [lo, hi] = spec.every;
          st.wait = lo + char.rand() * (hi - lo);
        }
      }
    }

    // "Disagreement is the content" — but the trader is a dry-run sidecar that
    // stays dormant until its own events exist, so handing it a reaction to an
    // event it had no part in would be inventing activity, which is the one
    // thing this room must never do. It looks. It does not act: no mood, no
    // animation, no numbers. The delay is what makes it read as *noticing*.
    function lookAt(observer, subject, delay) {
      if (!observer || !subject || observer === subject || observer.anim) return;
      observer.watch = {
        t: -delay, dur: 2.8,
        dir: Math.sign(subject.container.x - observer.container.x) || 1,
      };
    }

    function watchTick(char, dt) {
      const w = char.watch;
      if (!w) return;
      w.t += dt;
      if (w.t < 0) return;                       // still the stagger
      const u = Math.sin(Math.min(w.t / w.dur, 1) * Math.PI);
      // A deliberate look is bigger than an idle glance and does carry the
      // head a little — that difference is what makes it read as directed.
      setGaze(char, w.dir * 4 * u, w.dir * 0.12 * u, w.dir * 3 * u);
      if (w.t >= w.dur) { char.watch = null; setGaze(char, 0, 0, 0); }
    }

    function resetIdle(char) {
      setGaze(char, 0, 0, 0);
      char.watch = null;
      setBlink(char, false);
      for (const st of Object.values(char.idle ?? {})) st.active = false;
    }

    // The two inhabitants, plus whatever an eval surface has added. A list
    // rather than a hard-coded pair so the animation sheet ticks through the
    // same code path the stream does — a sheet with its own player would be
    // showing me an animation nobody ships.
    const cast = [];

    function advanceCharacters(dt) {
      for (const char of cast) {
        if (!char) continue;
        if (char.loopAnim) {        // eval surface: run one animation forever
          char.phase = (char.phase + dt / char.duration) % 1;
          // C2 review round 1, Finding 2a: this branch was left pointed at
