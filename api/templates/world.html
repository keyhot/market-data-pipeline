<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The World — Market Data Pipeline</title>
  <style>
    :root { color-scheme: dark; }
    __THEME_VARS__
    body { margin: 0; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; overflow: hidden; }
    #room { width: 100vw; height: 100vh; }
    #fallback { position: absolute; top: 3rem; left: 1rem; color: var(--neutral);
                font-size: 0.85rem; }
    /* Newcomer legibility: an always-present line naming what this is. */
    #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
              padding: 0.55rem 1rem; background: rgba(19, 23, 34, 0.72);
              color: var(--fg); font-size: 0.9rem; letter-spacing: 0.01em;
              pointer-events: none; }
    #banner-syms { color: var(--accent); font-weight: 600; }
    #banner .tag { color: var(--neutral); }

    /* B5 — the stream has no audio, so a spoken line only exists if it can be
       READ. Bubbles sit above the floor line, left of the room, and stack
       upward so the newest is nearest the characters. DOM rather than canvas
       text: it is the surface OBS is most reliable with, and it stays crisp
       at any bitrate. */
    #speech { position: absolute; left: 3.5rem; bottom: 21rem; z-index: 3;
              display: flex; flex-direction: column-reverse; gap: 0.5rem;
              max-width: 34rem; pointer-events: none; }
    .bubble { background: rgba(19, 23, 34, 0.9); border-left: 3px solid var(--neutral);
              border-radius: 0.35rem; padding: 0.5rem 0.75rem;
              font-size: 1.05rem; line-height: 1.35;
              opacity: 0; transform: translateY(6px);
              transition: opacity 320ms ease, transform 320ms ease; }
    .bubble.in { opacity: 1; transform: translateY(0); }
    .bubble .who { display: block; font-size: 0.72rem; letter-spacing: 0.08em;
                   text-transform: uppercase; margin-bottom: 0.15rem; }
    .bubble .said { color: var(--fg); }

    /* B9 — the always-on band. A newcomer arriving mid-calm sees no events at
       all, so the room has to answer "what is this and how is it going?"
       without waiting for one to fire. Bottom-pinned, quiet, permanent.

       Laid out here, in CSS, by decision (KI-070): one flex row whose cells
       are per-symbol groups the browser spaces, not fixed points a manifest
       could name. It still obeys "no text in the air" — the surface it sits
       on is the painted quiet strip `bands.bottom` reserves, and the bar is
       pinned to it — but it is not manifest-placed, and no placement
       pretends otherwise. */
    #nowband { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
               display: flex; align-items: baseline; gap: 1.75rem;
               padding: 0.5rem 1.25rem;
               background: linear-gradient(to top, rgba(19,23,34,0.92), rgba(19,23,34,0));
               font-size: 0.95rem; pointer-events: none; }
    #nowband .sym { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
    #nowband .px { color: var(--fg); font-variant-numeric: tabular-nums; }
    #nowband .mood { color: var(--neutral); }
    #nowband .trader { color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .trader b { color: var(--fg); font-weight: 600; }
    #nowband .record { margin-left: auto; color: var(--neutral);
                       font-variant-numeric: tabular-nums; }
    #nowband .record b { color: var(--fg); font-weight: 600; }

    /* B8 — the tier-3 callout. Every other surface in this room is
       deliberately low-amplitude; this is the one moment it raises its voice,
       so it has to be the one unmissable thing on screen. Sized by the BOX,
       never by a transform: KI-031 clipped the very headlines the swell existed
       to emphasise, because `transform: scale` does not reflow and the overflow
       met the frame edge. The entry transform only ever scales *up to* 1, so it
       cannot exceed the layout box it was measured in. DOM, not canvas: it must
       stay crisp at 2200 kbps, and it must not ride the camera push. */
    #callout { position: absolute; left: 50%; top: 15%; z-index: 4;
               max-width: 68vw; overflow-wrap: anywhere; text-align: center;
               padding: 0.7rem 1.5rem; border-radius: 0.4rem;
               background: rgba(19, 23, 34, 0.86);
               border-bottom: 3px solid var(--accent);
               font-size: 2.4rem; font-weight: 700; line-height: 1.1;
               letter-spacing: 0.03em; text-transform: uppercase;
               opacity: 0; pointer-events: none;
               transform: translateX(-50%) translateY(10px) scale(0.97);
               transition: opacity 260ms ease, transform 380ms
                           cubic-bezier(0.16, 0.84, 0.44, 1); }
    #callout.in { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    #callout .where { display: block; margin-top: 0.4rem; font-size: 0.95rem;
                      font-weight: 600; letter-spacing: 0.16em;
                      color: var(--neutral); }
  </style>
</head>
<body>
  <div id="banner"><span id="banner-syms"></span><span class="tag">a model
    trades live, and the world remembers when it's wrong</span></div>
  <div id="room"></div>
  <div id="speech"></div>
  <div id="nowband"></div>
  <div id="callout"></div>
  <div id="fallback">Waking the world…</div>
  <script src="/static/pixi-8.19.0.min.js"></script>
  <script>
    const SYMBOLS = __SYMBOLS__;
    // The plate's measured anchors, or null when there is no plate. Every
    // layout number below reads from here rather than from canvas fractions.
    // Same-origin by construction (KI-045/KI-047): the manifest names a bare
    // filename and the page prefixes /static/ itself, so no manifest edit can
    // put a third party into the on-air load path.
    const PLATE = __PLATE_JSON__;
    // The cast, already sorted into people and settings by world/plate.py's
    // `cast_payload()` — `{ characters: {...}, scale }`, or null with no plate.
    // Indexing `PLATE.cast` here instead would find `scale` for a name and
    // build an anchor out of `undefined` (KI-076); pinned by
    // test_the_page_never_indexes_the_raw_cast_block.
    const PAINTED_CAST = __CAST_JSON__;
    const PLATE_SRC = PLATE ? "/static/" + PLATE.plate : null;
    // Sprint 16 Task 10: where text is allowed to sit, already resolved to
    // absolute canvas coordinates by `world/text_layout.py::as_json` — read
    // THIS, never `PLATE.text`/`PLATE.text_surfaces` (Task 9's own surface
    // union is inside `PLATE` too, but re-deriving band-top/band-bottom from
    // it here would restate `_band_surfaces`' arithmetic in a second
    // language). A placement whose surface could not be resolved is already
    // dropped by `as_json` before this page ever sees it, so a missing key
    // here just means "nothing is drawn there" — never a throw.
    const TEXT_PLACEMENTS = __TEXT_JSON__;
    // The painted key light (the amber desk lamp): direction, warmth and
    // ramp measured off the plate, or the neutral default when unmeasured.
    // Distinct from ROOM_LIGHT below, which is the severity-tier ambient
    // swell — this one shapes the cast, via shade()/paint() below.
    //
    // AUTHORITATIVE OVER `PLATE.light`. `PLATE` (above) is the raw manifest,
    // substituted verbatim as `manifest.as_dict()`, so `PLATE.light` is
    // whatever the JSON file says, unvalidated. `LIGHT` is
    // `light_for(manifest)`'s output — the same measurement, but only after
    // it has passed the shape check, the monotonic-ramp check, and the
    // missing-manifest/missing-block degrade, all of which land on
    // `DEFAULT_LIGHT` rather than a bad number reaching a draw call
    // (`world/light.py`). Reaching for `PLATE.light` instead of `LIGHT`
    // silently steps around that whole contract. Every draw call below reads
    // `LIGHT`; nothing in this file should ever read `PLATE.light`.
    const LIGHT = __LIGHT_JSON__;
    const fallback = document.getElementById("fallback");

    // Name the room for a newcomer: the symbols in play + the one-line premise.
    document.getElementById("banner-syms").textContent =
      SYMBOLS.map((s) => s.replace(/USDT$/, "")).join(" · ") + " — ";

    // The mood -> colour map is injected from world/visuals.MOOD_COLORS (hex
    // strings) so this canvas and the DOM overlays share ONE palette; drift
    // between them was the old failure. Unknown moods stay grey rather than
    // throwing, so a new salience rule degrades quietly on screen.
    const MOOD_COLOR = __MOOD_COLORS_JSON__;
    const NEUTRAL = __NEUTRAL_COLOR__;
    // The same grey after `visuals.lift_to_silhouette_floor` — what an
    // un-mooded figure is PAINTED in. Identity colour and body colour are
    // different jobs and only one of them has a contrast floor (KI-060).
    const NEUTRAL_TINT = __NEUTRAL_TINT__;
    const color = (mood) => {
      const hex = MOOD_COLOR[mood];
      return hex ? parseInt(hex.slice(1), 16) : NEUTRAL_TINT;
    };

    // KI-028: the cast measured 1.19:1 (trader) and 1.00:1 against its own
    // background, versus WCAG's 3:1 floor — the bodies were the same luminance
    // as the room and only the faces read. A body's colour is NOT its mood
    // colour: PixiJS tint multiplies, so what renders is BODY_FILL x tint. The
    // old code floored the luminance of the *tint*, which is not the number a
    // viewer sees, and with the previous fill of 0x545862 the brightest body
    // obtainable — a pure white tint — was still only 2.51:1. The ceiling was
    // below the floor, so no tint could have fixed it; the fill had to move.
    // Both now come from world/visuals.py, which does the contrast maths and
    // is test-asserted over every mood.
    const BODY_TINT = __BODY_TINTS_JSON__;
    const BODY_FILL = __BODY_BASE_FILL__;
    // A lit edge, drawn brighter than the fill so the difference survives being
    // tinted by the same multiplier. Inner alignment so the rim costs the
    // silhouette no width — shadow sizes and head placement are tuned to these
    // exact rects. This is also the detail a 2200 kbps VBR encoder keeps best:
    // it spends its fewest bits on the near-black gradients that used to be the
    // only thing separating the cast from the room.
    const BODY_RIM = { width: 1.5, color: __BODY_RIM_FILL__, alignment: 1 };

    // The trader's own palette, sampled off the pre-Sprint-16 reference
    // (`Docs/char-redesign-reference/REFERENCE-characters.jpeg` in the vault):
    // brown hair, warm skin, a grey-blue sweater, blue-grey jeans, dark shoes.
    //
    // These are authored colours and are NOT the mood — they are painted with
    // `paint(..., keepFill = true)`, so a mood change re-lights their rim and
    // leaves the person a person. This is the brief's "mood has to move to face
    // + posture (+ a rim light)" as a constant rather than a comment: the day
    // the trader stopped being one flat mood-coloured silhouette is the day it
    // needed a palette of its own.
    //
    // Deliberately NOT in world/visuals.py with the mood palette: nothing here
    // is contrast-lifted per mood (KI-028), because none of it varies with
    // mood. A sweater is grey-blue when the model is elated and when it is
    // panicked; what changes is the light on its edge.
    const HUMAN = {
      hair:    0x33261f,
      skin:    0xc08f68,
      sweater: 0x3f5a70,
      jeans:   0x34495c,
      // Darker than the floor they stand on, which is the only way a shoe
      // reads at this size (increment 16). `#2a2e3c` rendered at 1.5-1.8x the
      // floor's luminance and read as a puddle round the ankles; that colour
      // was chosen before `matte`, when a darker shoe only dragged the lamp's
      // band to a skin hue. Graded against the plate's own floor by
      // `test_both_shoes_are_darker_than_the_floor_they_stand_on`.
      shoes:   0x181a22,
      // The shadow between two fingers — the only place on this figure where
      // one volume has to read as two. Sampled off the reference rather than
      // picked: its far hand measures `#262127` between the fingers against
      // `#a67265` on the lit slab above them, a luminance ratio of 0.28. Held
      // against skin's own lit rung (`#ce975e`, L 0.63) that asks for L 0.18,
      // which was `#3a2a22`. Warm, not neutral: a crease in a hand is skin
      // the light did not reach, and a blue-black one reads as a crack.
      //
      // That ratio did not survive the frame. The reference's separations are
      // one or two pixels wide; ours are 2 units x the figure scale, and at
      // that width a near-black line three times over reads as a BARCODE
      // stamped on the hand. Lifted to a deep skin shadow — still clearly
      // darker than the slab, so the four fingers still count (A/B 1:1 and
      // 4x, `data/visual-qa/char-redesign/inc17-*`).
      crease:  0x6e4a34,
    };

    // The MODEL's palette, and it holds exactly ONE colour — which is the
    // point. The trader has skin and hair and denim, so he cannot be
    // recoloured and gave up carrying mood in his body (increment 8). A
    // machine can be recoloured, and the MODEL's mood is the LIVE one:
    // `react()` moods it from real model events, where `draw()` re-pins the
    // trader to "idle" on every update. So every plate stays on `BODY_FILL`
    // and only the cuts between them are pinned to a colour of their own.
    //
    // `seam` is computed, not picked: it is `lightenTint(BODY_FILL, 0.14)`
    // evaluated out (0xd0d0d0 -> 0x1d1d1d), which is the recess
    // `machineFace` already cuts for the visor — this page's own shipped
    // answer to "what does a hollow in this machine look like", rather than
    // a second opinion about it. Neutral rather than warm, deliberately, and
    // this is where the machine departs from `HUMAN.crease`: a crease in a
    // hand is skin the lamp did not reach and has to stay skin-coloured,
    // while a gap between two steel plates is not made of steel.
    //
    // It has to be a LITERAL rather than that call. `repaint` stores a
    // keepFill volume's authored colour and replays it, so a seam derived
    // from the mood at boot would freeze at the first mood's recess while
    // the plates around it went on changing colour.
    const MACHINE = {
      seam: 0x28303a,
      // The MODEL's head (increment 13): an oblique box. `x/y/w/h` is the
      // FRONT face, the one `machineFace`'s visor, eyes and mouth are drawn
      // onto — they were authored against the 56-unit ball this replaces, so
      // the face is 56 across and reaches y +24 to clear the mouth's lowest
      // step (`snap(12 + 6)` = 20, plus its stroke). `depth` is how far the
      // top and the near side show, up and to the LEFT, which is the
      // reference's own direction (`ref-model.png`, same room, same lamp).
      head: { x: -28, y: -28, w: 56, h: 52, depth: 8, radius: 4 },
    };

    // --- KI-051: light the cast with the room's own lamp -------------------
    // Every volume used to be one flat fill and one hard rim — the figures
    // read as stickers laid over the painting rather than objects standing
    // in it. `shade`/`paint` below replace the fill rule only: the shapes,
    // positions and animations they are called from are untouched.
    //
    // `function` declarations (not `const … = () =>`), deliberately: they
    // are hoisted, so `BODY_RIM_SHADED` below can call `shade()` regardless
    // of source order, and no later reordering of this block can reintroduce
    // a temporal-dead-zone `ReferenceError` — the failure mode that a
    // `boot().catch()` swallows into a silent reload loop (KI seen in Task 2
    // of this sprint), invisible to every test that only inspects page
    // source rather than running it.

    // Two colours, blended toward `b` by `t` in [0, 1]. Channel-wise, not a
    // library: this file mixes hex nowhere else.
    //
    // Guards its OWN parsed inputs, not its output: `<<`/`|` coerce a NaN
    // operand to 0 (`NaN << 16` is `0`, not `NaN`), so a bad colour does NOT
    // make this return a non-finite number — it silently returns a wrong but
    // perfectly finite one (black, in the simplest case). A `Number.isFinite`
    // check on the RESULT can never see that; it has to happen here, before
    // the bitwise math ever runs. A colour that fails to parse degrades to
    // the OTHER colour, unmixed — "no light contribution from the broken
    // side" rather than a wrong colour nobody asked for.
    function mixHex(a, b, t) {
      const pa = typeof a === "number" ? a : parseInt(String(a).slice(1), 16);
      const pb = typeof b === "number" ? b : parseInt(String(b).slice(1), 16);
      if (!Number.isFinite(pa)) return pb;
      if (!Number.isFinite(pb)) return pa;
      const ch = (v, sh) => (v >> sh) & 0xff;
      const lerp = (x, y) => Math.round(x + (y - x) * t);
      return (lerp(ch(pa, 16), ch(pb, 16)) << 16)
           | (lerp(ch(pa, 8), ch(pb, 8)) << 8)
           |  lerp(ch(pa, 0), ch(pb, 0));
    }

    // PixiJS's container tint, as arithmetic instead of a shader stage.
    //
    // The page used to let the GPU do this: `char.body.tint = tint` multiplied
    // the mood over every pixel the container had already drawn — which, once
    // `paint()` existed, meant it multiplied the mood over the room's LIGHT as
    // well as over the body. The lit band mixes toward `LIGHT.warmth` and the
    // shade band toward `LIGHT.ambient`, so a red mood did not put a red object
    // under the amber lamp; it turned the lamp red. Doing the multiply HERE, on
    // one colour, before any light is applied, is the whole of the change: the
    // product is the body's own colour, and `shade()` then lights it with the
    // room's lamp exactly as it lights every other volume.
    //
    // Guards its own inputs for the same reason `mixHex` does, and to the same
    // rule: `<<`/`|` coerce NaN to 0, so an unparseable colour would come back
    // finite and wrong (black) rather than detectably broken. A side that fails
    // to parse degrades to the other side unmultiplied — "no contribution from
    // the broken side", not a body nobody asked for.
    function mulHex(a, b) {
      const pa = typeof a === "number" ? a : parseInt(String(a).slice(1), 16);
      const pb = typeof b === "number" ? b : parseInt(String(b).slice(1), 16);
      if (!Number.isFinite(pa)) return pb;
      if (!Number.isFinite(pb)) return pa;
      const ch = (v, sh) => (v >> sh) & 0xff;
      const mul = (x, y) => Math.round((x * y) / 255);
      return (mul(ch(pa, 16), ch(pb, 16)) << 16)
           | (mul(ch(pa, 8), ch(pb, 8)) << 8)
           |  mul(ch(pa, 0), ch(pb, 0));
    }

    // A volume's colour at a given light level. `level` is the ramp value for
    // the band being drawn: positive faces the lamp, negative faces away.
    //
    // Lit mixes toward the lamp's OWN warmth and shade toward the room's
    // ambient, rather than toward white and black — a figure that is lit BY
    // THIS ROOM puts amber on one side and the room's cold ambient on the
    // other, the same thing every painted object on the plate already does.
    // `LIGHT` always reaches this page as a complete, validated model
    // (`light_for` never lets a malformed manifest through — see the comment
    // above `const LIGHT`), so this needs no input guard of its own; a
    // non-finite `level` (the one field a caller could still pass wrong) is
    // caught below before it reaches `mixHex`, and a non-finite `LIGHT.warmth`
    // /`LIGHT.ambient` is caught inside `mixHex` itself. Either way the
    // volume draws in its old flat, unshaded colour rather than `g.fill(...)`
    // throwing mid-`character()` and taking the rest of the cast with it —
    // the one path this sprint's "never a blank canvas" rule reaches inside a
    // single figure.
    function shade(baseHex, level) {
      if (!Number.isFinite(level)) return baseHex;
      const toward = level >= 0 ? LIGHT.warmth : LIGHT.ambient;
      return mixHex(baseHex, toward, Math.min(1, Math.abs(level)));
    }

    // The ONE way this file reads the ramp. `LIGHT.ramp.lit` written inline is
    // a `TypeError` the moment `LIGHT` arrives without a `ramp` — and one of
    // those inline reads sits at TOP LEVEL (`BODY_RIM_SHADED` below), which
    // throws before `boot()` is ever called and leaves the page blank with
    // every page-source test still green (the Task 2 failure mode). The inner
    // reads inside `paint()` are the softer version of the same class, so
    // both go through here rather than only the loud one: a missing or
    // non-numeric rung degrades to 0, which `shade()` turns back into the
    // volume's own flat colour — the pre-KI-051 look, not a broken page.
    function rampLevel(rung) {
      const ramp = LIGHT && LIGHT.ramp;
      const level = ramp ? ramp[rung] : undefined;
      return Number.isFinite(level) ? level : 0;
    }

    // The measured direction, normalised, and safe to divide by. Not read raw
    // from `LIGHT.direction` at each draw call, for two reasons: `litCircle`'s
    // no-overshoot property holds EXACTLY only for a unit vector (this plate
    // measures |d| = 1.004, which walks each band's key-facing point outward
    // by 0.4% of its own inset), and a `[0, 0]` direction — which `light_for`
    // accepts, since it validates the ramp and not the vector — would put NaN
    // into every roundRect on the page. Anything unusable falls back to
    // DEFAULT_LIGHT's straight-down axis rather than throwing.
    function keyAxis() {
      const raw = (LIGHT && LIGHT.direction) || [];
      const dx = Number(raw[0]), dy = Number(raw[1]);
      const len = Math.hypot(dx, dy);
      return Number.isFinite(len) && len > 0 ? [dx / len, dy / len] : [0, 1];
    }
    const KEY_AXIS = keyAxis();

    // The measured contact patch — how dark a shadow this room casts, how wide
    // it sits under a body, and how far the lamp's height throws it. Guarded
    // for the same reason `rampLevel` and `keyAxis` above are: `LIGHT.contact
    // .opacity` written inline is a TypeError the moment `LIGHT` arrives
    // without a `contact`, and THIS one is read at top level (`CONTACT`
    // below), which is the flavour that throws before `boot()` is ever called
    // and leaves a blank page every page-source test still passes.
    //
    // The fallback numbers here are deliberately NOT a copy of
    // `DEFAULT_LIGHT`'s: `light_for` always supplies a complete `contact`
    // block, including for a missing or malformed manifest, so what an
    // unmeasured room's shadow looks like is decided in `world/light.py` and
    // nowhere else. What is left here is the structural degrade — no throw,
    // no NaN reaching a sprite — for a state that contract cannot produce.
    function contactLight() {
      const c = (LIGHT && LIGHT.contact) || {};
      const num = (v, dflt) => (Number.isFinite(Number(v)) ? Number(v) : dflt);
      return {
        opacity: Math.min(1, Math.max(0, num(c.opacity, 0))),
        widthScale: Math.max(0, num(c.widthScale, 1)),
        throwScale: Math.max(0, num(c.throwScale, 0)),
      };
    }
    const CONTACT = contactLight();

    // How far this room lays its shadows down, in plate pixels:
    //
    //     throw_px = CONTACT.throwScale * SHADOW_THROW
    //
    // `throwScale` is the plate's measured share, dimensionless and beside
    // `widthScale` for that reason; this constant carries the pixels. It was
    // called `height` until KI-063, which was wrong twice over — not a length,
    // and backwards as physics, since RAISING a lamp shortens a shadow. It is
    // the one number in the shadow that is an art
    // call rather than a measurement, and kept out of the manifest for that
    // reason — a repaint re-measures the lamp, it does not re-decide how far
    // a shadow should read as being thrown. Chosen from frames, not from
    // arithmetic: on a three-point sweep measured off real pixels — each
    // frame's shadow differenced against the painted plate — `1.6` moved the
    // model's centroid only 6px across a 78px patch and still read as a
    // lopsided puddle, `4.5` ran the far tail 41px past the body and detached
    // the mass into a smear, and `3.0` is unmistakably directional with the
    // core still under the feet.
    const SHADOW_THROW = 3.0;

    // How much of a volume each band eats, as a FRACTION of that volume's own
    // extent — never as a fixed number of units.
    //
    // Review round 1's ruling, measured rather than argued: the first version
    // used absolute insets of 0/2/5 against volumes spanning 12 to 66 local
    // units, so a 15-unit bar got a ~1px shade band and a ~4px base band and
    // the remaining ~85% of EVERY figure came out one flat colour. That is a
    // tint, not light — the exact thing KI-051 names as the defect. Raising
    // the absolute numbers cannot fix it either: what shades a torso would
    // collapse or invert a wick.
    //
    // Measured at these values over every volume the page draws — the 66x54
    // chest, the 12x96 bar, the 7x30 wick, the r28 skull, the r46 orb — each
    // one comes out 25-27% lit, 39-43% mid, 30-35% shade by area. One
    // three-tone form shade, the same on the biggest volume and the smallest,
    // which is the whole point of expressing the offsets as fractions. The
    // VALUES are an art call made off a frame, not a derivation; the SHAPE of
    // the rule (proportional, clamped) is the load-bearing part.
    const BAND_INSET = { shade: 0, base: 0.25, lit: 0.70 };
    // No band may eat more than this share of its volume, whatever the
    // fractions above or a future manifest's direction say. A `roundRect` of
    // negative width is a silent geometry failure, not an exception — nothing
    // throws, the volume just stops being drawn — so the clamp is what keeps a
    // retune from quietly deleting the smallest bodies.
    const BAND_MAX = 0.85;

    // The same band, for a circle. A rect loses one linear fraction per axis;
    // a circle shrinks on BOTH axes at once, so the identical fraction costs
    // it far more of itself — at `lit` a rect keeps ~25% of its area and a
    // circle only 9%. Left uncorrected that is a skull visibly darker than the
    // chest under it: head and body disagreeing about the light, which is the
    // the same defect class as the sign error review round 1 shipped. So:
    // solve for the linear inset leaving a circle the AREA share a rect keeps
    // — rect keeps `(1 - band·|dx|)(1 - band·|dy|)`, circle keeps `(1 - f)²`.
    // Derived from the same measured axis rather than hardcoded, so a repaint
    // that moves the lamp keeps the head and the body agreeing.
    function circleBand(band) {
      if (!Number.isFinite(band) || band <= 0) return 0;
      const kept = (1 - band * Math.abs(KEY_AXIS[0]))
                 * (1 - band * Math.abs(KEY_AXIS[1]));
      return 1 - Math.sqrt(Math.max(0, kept));
    }

    // A rim colour shaded toward the lamp's own warmth rather than a fixed
    // hue. It reads as a bright contour where it sits against the volume's
    // own shaded (away-from-key) band — the KI-028 contrast the plain
    // BODY_RIM existed for, now needed most on the side `paint` leaves
    // darkest.
    const BODY_RIM_SHADED = { width: BODY_RIM.width, color: shade(BODY_RIM.color, rampLevel("lit")), alignment: BODY_RIM.alignment };

    // Draw one volume in three bands, lit toward the key. A `volume` is what
    // `litRect`/`litCircle` return: `band(g, inset)` draws the SAME silhouette
    // shrunk to a given band, `rim(g)` strokes its true (un-inset) outline.
    // `paint` supplies the insets and, via `shade`, the colour of each band,
    // so the shape a caller passes in is unchanged — this adds light to the
    // existing rig, it does not redraw it.
    //
    // The brief asks for a rim that "survives only away from the key", and the
    // mechanism for it — draw the rim, then let the lit band overpaint it on
    // the lamp side — does not work here, measured rather than assumed:
    // `BODY_RIM.alignment` is 1, which in PixiJS v8 strokes OUTSIDE the shape
    // (scanned off the delivered frame: on 96 rows through the trader, a rim
    // pixel sat outside the outermost band pixel 192 times and strictly
    // inside it 0). Nothing drawn inside the silhouette can occlude a stroke
    // drawn outside it, and the alternative — moving the rim to an inner
    // alignment — shrinks the very silhouette KI-028's contrast fix was
    // measured against. So the rim stays whole and goes on last, and the
    // measurement lives in the task report instead of an aesthetic claim.
    //
    // Each volume is REMEMBERED on the Graphics it was drawn into, so the same
    // rig can be re-lit in another colour without the call site having to hand
    // its rects over a second time. That is what makes mood a colour `paint()`
    // receives rather than a multiply laid over its output (`repaint` below) —
    // and it is why the nineteen `BODIES.*`/`seatedRig`/`character()` call
    // sites are untouched by this ticket: they still describe the shape once,
    // in `BODY_FILL`, and the mood arrives afterwards.
    // `rim` is the volume's EDGE colour, and it is a second base colour rather
    // than a decoration derived from the first. `world/visuals.py` states the
    // invariant this ticket has to carry: "the rim is drawn brighter than the
    // fill so the difference SURVIVES tinting (both get multiplied by the same
    // tint, so the ratio between them is fixed here and nowhere else)". The
    // container tint used to be what kept that ratio; with the tint gone the
    // mood has to reach the rim's own albedo the same way it reaches the
    // body's, or every figure is outlined in the lamp's cream regardless of
    // what colour it is. Measured on the first frame of this ticket: 11,491
    // pixels of flat `#fbe5c8` keyline, and a 14-unit arm at 1.5px of rim lost
    // its colour almost entirely — a die-cut sticker outline, which is the
    // KI-051 read this whole sprint exists to remove.
    //
    // Omitted, it falls back to `BODY_RIM_SHADED`: the un-mooded edge, which
    // is what the nineteen construction-time call sites want and what a
    // volume drawn outside a character gets.
    // `keepFill` is the human's exemption, and it exists because a person is
    // not one colour. Every volume drawn before the character redesign took
    // the mood as its fill, which is correct for a market glyph and impossible
    // for skin, hair and denim — recolouring those wholesale stops the figure
    // being a person at all. A volume painted with `keepFill` records its own
    // authored colour and keeps it through every `repaint`; what still moves
    // with the mood is its RIM, the lit edge. That is the brief's resolution
    // ("mood has to move to face + posture + a rim light") landing on the seam
    // `paint` already had rather than a second painting path beside it.
    //
    // Default false, so all nineteen pre-existing call sites and every market
    // glyph keep the old behaviour exactly.
    // `opts.noRim` is the second half of the same lesson, and it is the one the
    // first frame of the redesign taught. A rim belongs to a SILHOUETTE, not to
    // every volume that happens to be drawn. While a body was four rectangles
    // that was the same statement; at twenty it stops being one — each interior
    // part came back die-cut in the lamp's cream, which is precisely the
    // "die-cut sticker outline" this file's own `paint` comment names as the
    // KI-051 read to remove. Detail made the figure WORSE, monotonically, until
    // interior volumes could opt out of the edge.
    //
    // So: volumes on the outline keep their rim; volumes that sit inside
    // another (a face inside its hair, a shin between a thigh and a shoe) pass
    // `noRim` and read as shading instead of as separate objects.
    //
    // ...and then the rim came off the PERSON entirely, which is the end of
    // that road rather than a break with it. `noRim` is per-VOLUME, and the
    // defect it could never reach was per-END: the thigh is 4.4 units wider
    // than the shin, so its rim overhung the knee whatever the shin did. The
    // only per-volume cover for that was a disc over the joint, and `paint`
    // bands a circle concentrically, so the disc read as a BALL joint and the
    // trader became a wooden mannequin.
    //
    // A `keepFill` volume gets no rim at all. That is not a new predicate:
    // `keepFill` is this file's own definition of a volume of a PERSON (see
    // above — "a person is not one colour"), and the rule is that a person is
    // not outlined. The machine heads take the other branch (the ball,
    // `paint(skull, litCircle(0, 0, 28), BODY_FILL)`, and the MODEL's box,
    // `boxHead`) and keep their rim, as
    // every market glyph does: a glyph is a shape that needs an edge against a
    // busy room; a face is not.
    //
    // Measured before it was believed (vault `Docs/character-redesign.md`,
    // increment 8). The rim was the human's only COLOUR mood channel, and that
    // channel is CONSTANT in the shipped configuration — `react()` sends a
    // mood to the trader only from `trader_*` events, which exist only when
    // the opt-in freqtrade sidecar runs, and `draw(state)` re-pins him to
    // "idle" every update. What the rim delivered was the LAMP and not the
    // mood: `rimStyle` mixes every rim 30% toward `LIGHT.warmth`, so the
    // trader's edge measured hue 26° / sat 0.16 regardless, against authored
    // tints of sat 0.31–1.00. Mood still reaches him through the other two of
    // the brief's three channels, face and posture.
    //
    // At 1:1 viewer scale the unrimmed figure reads as a painted person and
    // the rimmed one as an assembly of outlined tubes. The lit/shade bands
    // were always doing the separating; the rim competed with them.
    // `test_a_person_is_not_outlined` grades this at the mechanism, because
    // the one thing increment 6 proved is that a rule restated at a call site
    // is a rule the next limb will get wrong.
    function paint(g, volume, fill, rim, opts) {
      const keepFill = opts && opts.keepFill;
      const noRim = !!(opts && opts.noRim);
      // A matte volume takes the BASE rung where the lit one would go, rather
      // than skipping the band: the shoe still needs its brightest face
      // painted, it just must not be painted in the lamp's hue. See `shod`.
      const matte = !!(opts && opts.matte);
      // Anything added here needs a line in `repaint` too — it rebuilds these
      // options field by field, so it is a WHITELIST, and an option it does
      // not name is dropped the moment a mood is applied. `matte` was lost
      // that way when first written: the A/B shot came back pixel-identical
      // to the shipped figure, because `draw()` re-pins the trader to "idle"
      // on every update and repaints him before anything is photographed.
      //
      // `matte` is only meaningful ALONGSIDE `keepFill`, which is how `shod`
      // carries it. `repaint` recovers a volume's authored colour from the
      // stored `fill`, and that is stored only for a `keepFill` volume — so a
      // matte-only volume would keep the rung and take the MOOD as its fill on
      // the next repaint. Nothing draws one; this is the note for whoever adds
      // the next option, not a live defect.
      (g.volumes || (g.volumes = [])).push(
        keepFill || noRim || matte
          ? { volume, fill: keepFill ? fill : undefined, noRim, matte }
          : volume,
      );
      volume.band(g, BAND_INSET.shade);  g.fill(shade(fill, rampLevel("shade")));
      volume.band(g, BAND_INSET.base);   g.fill(shade(fill, rampLevel("base")));
      volume.band(g, BAND_INSET.lit);
      g.fill(matte ? shade(fill, rampLevel("base")) : shade(fill, rampLevel("lit")));
      if (!noRim && !keepFill) volume.rim(g, rimStyle(rim));
    }

    // A rim's stroke style at a given base colour, lit like the volume's own
    // lamp-facing band — the rim IS the lit edge, so it takes `rampLevel("lit")`
    // and nothing else. `BODY_RIM_SHADED` (the same computation over the
    // un-mooded `BODY_RIM.color`) is what a caller with no colour to offer
    // gets, so the constant stays the single definition of the default edge.
    function rimStyle(rim) {
      if (!Number.isFinite(rim)) return BODY_RIM_SHADED;
      return {
        width: BODY_RIM.width,
        color: shade(rim, rampLevel("lit")),
        alignment: BODY_RIM.alignment,
      };
    }

    // The same volumes, lit again in a new colour.
    //
    // `g.clear()` first, so the bands REPLACE the old ones rather than stacking
    // a second opaque set on top of them — and the recorded list is emptied
    // before the re-paint, because `paint` re-records as it goes and an
    // unreset list would double on every mood change for as long as the stream
    // is up. Nothing here touches the Graphics' transform, which is where
    // every animation's state lives (`scale`, `rotation`, `x`/`y`): a mood
    // change mid-gesture re-colours the figure without interrupting it.
    //
    // A Graphics with nothing recorded is left exactly as it is. That is not
    // only defensive: faces (eyes, brows, mouth, visor) are drawn by
    // `setExpression`'s own primitives, never through `paint`, and clearing
    // one of those here would wipe a face and draw nothing back.
    // A `keepFill` volume was recorded as `{ volume, fill }` rather than bare,
    // so it re-paints in the colour it was authored in and takes only the
    // mood's rim. Everything else is a bare volume and re-paints in the mood,
    // exactly as before.
    function repaint(g, fill, rim) {
      // A limb can be a TREE now — the seated forearm is a child of its own
      // upper arm, so that a shoulder swing carries it. `applyMood` walks
      // `char.accents`, which holds the upper arm only, so without this
      // descent a mood change would re-light the sleeve above the elbow and
      // leave the one below it in the previous mood's colour. Silent, and
      // visible only on a mood change, which is exactly the kind of seam this
      // redesign keeps finding.
      for (const child of g.children || []) repaint(child, fill, rim);
      const volumes = g.volumes;
      if (!volumes || !volumes.length) return;
      g.clear();
      g.volumes = [];
      for (const entry of volumes) {
        if (entry.volume) {
          const authored = entry.fill !== undefined;
          paint(g, entry.volume, authored ? entry.fill : fill, rim, {
            keepFill: authored, noRim: entry.noRim, matte: entry.matte,
          });
        } else {
          paint(g, entry, fill, rim);
        }
      }
    }

    // How much of a volume's own extent a band keeps on one axis. `band` is
    // the fraction from `BAND_INSET`; how many UNITS that costs is a property
    // of this volume and this axis, so it is computed where the size is known
    // rather than handed down as a fixed number of pixels. Weighting by the
    // key's own component on the axis is what makes an overhead lamp band a
    // shape across its height and leave its width alone, and a side lamp do
    // the reverse — a light straight down the y axis produces full-width
    // horizontal bands, which is the correct picture and also exactly what the
    // neutral DEFAULT_LIGHT degrades to.
    function bandExtent(size, axisComponent, band) {
      const fraction = Number.isFinite(band) ? Math.max(0, band) : 0;
      return size * (1 - Math.min(fraction * Math.abs(axisComponent), BAND_MAX));
    }

    // Can a `bw × bh` band with corner radius `rb`, sitting `cx, cy` from the
    // volume's own centre, be drawn without any part of it leaving a `w × h`
    // rounded rect of radius `r`?
    //
    // Exact, not a margin heuristic — and the check the FIRST version of this
    // rule was missing. Bands placed flush against the volume's key-facing
    // edges nest correctly in the BOUNDING BOX and still leak out through the
    // rounded corner, because a small band's corner is squarer than the
    // silhouette's: rasterised against the real call sites, the seated chest
    // (48×40, r20 — a stadium) spilled 15.3% of its lit band outside its own
    // outline, which is a figure whose shape changes when the lamp moves.
    //
    // The statement below is the whole of it: a rounded rect contains a
    // rounded rect exactly when each of the inner shape's four corner DISCS
    // lies inside the outer shape eroded by that disc's radius — and the
    // erosion of a rounded rect by a disc is the same rounded rect with both
    // dimensions and the radius reduced by it.
    function bandInside(cx, cy, w, h, r, bw, bh, rb) {
      if (Math.abs(cx) > (w - bw) / 2) return false;
      if (Math.abs(cy) > (h - bh) / 2) return false;
      const room = r - rb;
      if (room <= 0) return true;
      const ax = bw / 2 - rb, ay = bh / 2 - rb;   // the band's own arc centres
      const hx = w / 2 - r, hy = h / 2 - r;       // the volume's arc centres
      for (const sx of [-1, 1]) {
        for (const sy of [-1, 1]) {
          const dx = Math.max(0, Math.abs(cx + sx * ax) - hx);
          const dy = Math.max(0, Math.abs(cy + sy * ay) - hy);
          if (dx * dx + dy * dy > room * room) return false;
        }
      }
      return true;
    }

    // Where a band sits: as far toward the lamp as this volume allows, as an
    // offset from the volume's own centre.
    //
    // The direction is the key axis scaled by how much ROOM each axis has
    // (half the difference between the volume and its band). Walking the raw
    // key vector instead is wrong for anything long and thin, and wrong in a
    // way the frame shows immediately: a 12x96 bar has 2.3 units of
    // horizontal room and 28 of vertical, so a straight diagonal walk runs out
    // of width after 4 units and the band ends up vertically CENTRED — a bar
    // lit from above with its bright part in the middle. Scaling by the room
    // turns that into an almost-vertical walk, while a SQUARE volume (which
    // every circle is, 2R x 2R) still walks exactly along the key axis — which
    // is what keeps `litCircle`'s closed form below the same rule and not a
    // second one.
    //
    // The magnitude is bisected rather than solved: the feasible set is convex
    // (an erosion of one convex shape by another) and contains the centre, so
    // the feasible offsets along a ray are an interval from 0 and bisection
    // lands on its edge — which leaves `bandInside` as the only geometry that
    // has to be right. The centred band always fits, because `rb` is capped at
    // `min(r, bw/2, bh/2)`, which is exactly the condition that makes the
    // centred case pass; the search always has that floor.
    //
    // This is also the ONE place "toward the lamp" is expressed for a rect.
    // Review round 1 shipped a figure lit from two directions at once because
    // that phrase had two separate expressions — a per-axis sign branch for
    // rects and `-LIGHT.direction` for circles — and only one of them was
    // right. There is no sign branch left to get backwards.
    function slideToKey(w, h, r, bw, bh, rb) {
      const ux = -KEY_AXIS[0], uy = -KEY_AXIS[1];
      const scale = Math.max(Math.abs(ux), Math.abs(uy)) || 1;
      const tx = ux * ((w - bw) / 2) / scale;
      const ty = uy * ((h - bh) / 2) / scale;
      let lo = 0, hi = 1;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (bandInside(mid * tx, mid * ty, w, h, r, bw, bh, rb)) lo = mid;
        else hi = mid;
      }
      return [lo * tx, lo * ty];
    }

    // Band edges land on a 1/64 unit — a power of two, so they stay exact in
    // binary floating point against the whole (CELL-snapped) coordinates every
    // call site passes, and the final `Math.max`/`Math.min` below can then
    // pin a band inside its volume's box EXACTLY rather than to within 1e-15.
    // Task 5 measured the seated rig clearing the painted seat by 9px and the
    // backrest by 50px; those checks are worth being able to state without a
    // tolerance.
    const quant = (v) => Math.round(v * 64) / 64;
    // The floor is one quantum, not zero: `band()` must always leave a path
    // for the `g.fill()` that follows it, and a zero-area `roundRect` is a
    // silent no-op rather than an error.
    const MIN_BAND = 1 / 64;

    // A volume for `paint`: the same rounded rect shrunk to each band and slid
    // toward the lamp, plus the rim at its true silhouette. One definition
    // rather than restating the arithmetic at every one of the nineteen call
    // sites.
    const litRect = (x, y, w, h, r) => {
      return {
        band: (g, band) => {
          const x0 = snap(x), y0 = snap(y);
          const bw = bandExtent(w, KEY_AXIS[0], band);
          const bh = bandExtent(h, KEY_AXIS[1], band);
          // A corner cannot stay absolute while the rect shrinks: a radius
          // wider than the band it rounds is where a renderer starts guessing.
          const rb = Math.max(0, Math.min(r, bw / 2, bh / 2));
          const [ox, oy] = slideToKey(w, h, r, bw, bh, rb);
          const bx = Math.min(Math.max(x0, quant(x0 + (w - bw) / 2 + ox)), x0 + w);
          const by = Math.min(Math.max(y0, quant(y0 + (h - bh) / 2 + oy)), y0 + h);
          const bwq = Math.max(MIN_BAND, Math.min(quant(bw), x0 + w - bx));
          const bhq = Math.max(MIN_BAND, Math.min(quant(bh), y0 + h - by));
          return g.roundRect(bx, by, bwq, bhq, Math.min(rb, bwq / 2, bhq / 2));
        },
        rim: (g, style) => rimStroke(g, x, y, w, h, r, style),
      };
    };
    // A circle is the closed-form case of the same rule, not a second one:
    // `slideToKey(2R, 2R, R, 2rb, 2rb, rb)` is exactly `(R - rb)·-KEY_AXIS`,
    // the offset that leaves the band internally tangent to the original
    // circle at its key-facing point — which is why a square volume walking
    // along the key axis matters above. `tests/api/test_world_page.py` asserts
    // that identity rather than leaving it as a claim in a comment. Solving it
    // here keeps the skull exact and saves 24 bisection steps per band.
    const litCircle = (cx, cy, radius) => {
      return {
        band: (g, band) => {
          const kept = radius * (1 - Math.min(circleBand(band), BAND_MAX));
          const rb = Math.max(MIN_BAND, quant(kept));
          const slide = radius - rb;
          return g.circle(
            snap(cx) + slide * -KEY_AXIS[0],
            snap(cy) + slide * -KEY_AXIS[1],
            rb,
          );
        },
        rim: (g, style) => rimStrokeCircle(g, cx, cy, radius, style),
      };
    };

    // A CONVEX outline, for the parts of a person a rect cannot draw without
    // reading as a block: the face, the swept fringe, the hand (increment
    // 18 — "make him look natural without blocks and squares").
    //
    // The same rule as the other two, not a third one: each band is the
    // outline shrunk about its centroid by `circleBand`'s fraction and slid
    // toward the lamp as far as it stays inside. Convex because that is what
    // makes "every vertex inside" the whole containment check — a concave
    // band pokes out through the concavity it was shrunk past, which is the
    // corner leak `bandInside` exists to stop on a rect. The concave details
    // of a profile (nose, lips, the ear's C) are flat features, never paths.
    //
    // `points` are relative to an origin that snaps like `litRect`'s, so a
    // path on a limb keeps the whole-CELL registration of the rects cut into
    // it; the outline itself is unsnapped, which is what lets it be round.
    const litPath = (points, ox = 0, oy = 0) => {
      const x0 = snap(ox), y0 = snap(oy);
      const pts = points.map(([px, py]) => [x0 + px, y0 + py]);
      return {
        band: (g, band) => g.poly(pathBand(pts, band).flat()),
        rim: (g, style) => g.poly(pts.flat()).stroke(style || BODY_RIM_SHADED),
      };
    };

    // Is (px, py) inside (or on) the convex polygon `pts`, either winding?
    function insideConvex(pts, px, py) {
      let sign = 0;
      for (let i = 0; i < pts.length; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
        const cross = (bx - ax) * (py - ay) - (by - ay) * (px - ax);
        if (Math.abs(cross) < 1e-9) continue;
        const s = Math.sign(cross);
        if (sign && s !== sign) return false;
        sign = s;
      }
      return true;
    }

    function pathBand(pts, band) {
      const keep = 1 - Math.min(circleBand(band), BAND_MAX);
      const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
      const shrunk = pts.map(([px, py]) => [cx + (px - cx) * keep, cy + (py - cy) * keep]);
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      const reachMax = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
      const fits = (t) => shrunk.every(([px, py]) =>
        insideConvex(pts, px - KEY_AXIS[0] * t, py - KEY_AXIS[1] * t));
      let lo = 0, hi = reachMax;
      for (let i = 0; i < 24; i++) {
        const mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
      return shrunk.map(([px, py]) => [quant(px - KEY_AXIS[0] * lo), quant(py - KEY_AXIS[1] * lo)]);
    }

    // The rim, kept at the volume's true (un-inset) silhouette so it still
    // outlines the shape `paint` was called with, not one of its bands.
    // Reached only through a volume's own `rim(g)`, never from a body method:
    // a rim is not something a call site can forget, mis-order, or hand the
    // wrong rectangle — `paint` owns the whole fill rule for a volume, which
    // is the one thing this ticket was allowed to change.
    function rimStroke(g, x, y, w, h, r, style) {
      g.roundRect(snap(x), snap(y), w, h, r).stroke(style || BODY_RIM_SHADED);
    }
    function rimStrokeCircle(g, cx, cy, radius, style) {
      g.circle(snap(cx), snap(cy), radius).stroke(style || BODY_RIM_SHADED);
    }
    // -------------------------------------------------------------------

    // The colour a body of this mood is PAINTED in — the thing `paint()` then
    // lights, not a multiplier laid over the result.
    //
    // `BODY_TINT` is the mood palette lifted to `SILHOUETTE_MIN_CONTRAST`
    // (KI-028), and it is still a *tint*: the contrast floor was measured in
    // `world/visuals.py` on `_rendered()`, "what the canvas actually shows: the
    // base fill multiplied by the tint". So the colour that clears the floor is
    // the PRODUCT, and that is what gets painted. Handing `paint()` the raw
    // `BODY_TINT` entry instead would ship every body 1/0.816 = 1.23x brighter
    // than the number `body_contrast()` asserts and a screenshot is compared
    // back to — a measured quantity moved silently, which is exactly the shape
    // of the defect KI-028 was.
    //
    // `MOOD_COLOR` is deliberately NOT what this reads. That map is the
    // identity palette for chrome — labels, the gallery's mood swatch — and it
    // is the pre-lift colour; reaching for it here is KI-028 reverted, which
    // sinks fourteen of the twenty-two moods back under the floor.
    //
    // Unknown moods fall back to NEUTRAL_TINT *inside* the multiply. `neutral`
    // is the live case, not a hypothetical: `character()` builds every figure
    // at mood "neutral", which `visuals.MOOD_COLORS` does not claim, and
    // returning the bare tint there would make un-mooded figures the brightest
    // thing in the room. NEUTRAL_TINT, not NEUTRAL: the identity grey is the
    // pre-lift colour, and painting a body in it lands at 3.05:1 — the only
    // colour in the room under KI-028's floor, which is what KI-060 was.
    function moodTint(mood) {
      const hex = BODY_TINT[mood];
      return hex ? parseInt(hex.slice(1), 16) : NEUTRAL_TINT;
    }
    function moodFill(mood) {
      return mulHex(BODY_FILL, moodTint(mood));
    }
    // The same mood on the RIM's own albedo — not a lighter `moodFill`, but the
    // second base colour the container tint used to multiply alongside the
    // first. `BODY_RIM_FILL` is white, so this comes out as the lifted tint
    // itself, i.e. `BODY_FILL`'s 0xd0 stretched to 0xff: the fixed
    // rim-over-fill ratio `world/visuals.py` says lives "here and nowhere
    // else", preserved by construction instead of by a number restated here.
    function moodRim(mood) {
      return mulHex(BODY_RIM.color, moodTint(mood));
    }

    // Shared severity -> tier bands (mirror the overlay + world/state tiers) so
    // the "swell" reads the same on every surface: tier 0 barely stirs, tier 3
    // leaps. This is the calm-that-swells register in motion.
    // The tier scale is the server's, injected — never restated here. Severity
    // is rule-specific: 1.6 is tier 2 for a `signal_resolved` and tier 0 for a
    // `big_move`. An absolute 2/5/8 scale in this file quietly pinned the most
    // frequent event in the world to tier 0, so the room never swelled for it.
    const TIER_CUTS = __TIER_CUTS_JSON__;

    __TIER_OF_JS__

    // 4px cells at 1920x960. Every coordinate the cast draws or moves to is
    // quantised here, so motion reads as pixel STEPS rather than smooth
    // slides — the one drawing rule the whole cast obeys. Falls back to a
    // literal 4 when there is no plate (PLATE is null): CELL must not throw
    // on the no-manifest path any more than anchorFor does. Top-level scope,
    // not inside boot(), so playAnimation, the cast helpers, and (Tasks 7/8)
    // drawCandles/applyGlow can all reach it.
    const CELL = (PLATE && PLATE.cell) || 4;
    function snap(v) { return Math.round(v / CELL) * CELL; }

    // Declared here, constructed in boot(): character() needs app.screen and
    // the layer containers, neither of which exist until PIXI has initialised.
    let app, layers = {}, world = null, model = null, trader = null;

    // This page is unattended and on air. Every failure below used to latch:
    // the card was painted once and the room stayed blank until a human
    // refreshed the browser source. So a boot failure now reloads on a bounded
    // backoff. The window it covers is small but recurring — a browser source
    // reloading while the API container restarts, i.e. every deploy.
    const RETRY_BACKOFF_MS = [2000, 5000, 15000, 30000, 60000];

    function retryBoot(reason) {
      // The counter rides in the URL, so treat it as untrusted input: anything
      // that is not a clean non-negative integer counts as exhausted rather
      // than as zero. `Number("abc")` is NaN, and NaN fails every comparison
      // below — it would slip past the cap and then increment to NaN forever,
      // which is the reload storm this cap exists to prevent.
      const raw = Number(
        new URLSearchParams(location.search).get("boot_retry") || 0
      );
      const attempt =
        Number.isInteger(raw) && raw >= 0 ? raw : RETRY_BACKOFF_MS.length;
      if (attempt >= RETRY_BACKOFF_MS.length) {
        // Out of retries: say so plainly and stop. A reload storm against an
        // API that is genuinely down helps nobody.
        fallback.textContent = reason + " — the world is still running";
        return;
      }
      fallback.textContent = reason + " — retrying…";
      const next = new URL(location.href);
      next.searchParams.set("boot_retry", String(attempt + 1));
      setTimeout(() => location.replace(next.toString()), RETRY_BACKOFF_MS[attempt]);
    }

    // Called only once the room is fully built. Clearing the counter any
    // earlier defeats the cap: anything that throws *after* the reset but
    // before boot() resolves lands in the catch with a fresh budget, and the
    // page reload-loops forever against the API instead of stopping after
    // five tries. The reset has to be the last thing, not the first.
    function bootSucceeded() {
      if (!new URLSearchParams(location.search).has("boot_retry")) return;
      const clean = new URL(location.href);
      clean.searchParams.delete("boot_retry");
      history.replaceState(null, "", clean.toString());
    }

    // The void is a legitimate question — comparing two silhouettes against
    // each other is easier without a painting behind them — but it is no
    // longer the default. Judging a cast against a background the cast will
    // never stand in is how KI-051 shipped. Top-level, not inside boot():
    // drawGallery and drawAnimationSheet are boot()'s siblings, not its
    // children, and need to read this too.
    const VOID_MODE = new URLSearchParams(location.search).get("void") === "1";

    async function boot() {
      if (typeof PIXI === "undefined") {
        retryBoot("renderer unavailable");
        return;
      }
      app = new PIXI.Application();
      await app.init({ background: 0x131722, resizeTo: window, antialias: false });
      document.getElementById("room").appendChild(app.canvas);
      fallback.textContent = "";

      // KI-046: the room can be dark while every light is green. The count is
      // incremented by the RENDER loop, so a page whose setInterval still fires
      // over a dead renderer reports a frozen frame count rather than health.
      let framesDrawn = 0;
      app.ticker.add(() => { framesDrawn++; });

      // Below the room: the painted backdrop, when there is one.
      layers.plate = new PIXI.Container();
      layers.room = new PIXI.Container();
      // Task 9: additive light (applyGlow) falls ON the room but must never
      // land over the cast's faces, so it sits above layers.room — and,
      // since M2's live chart candles (layers.monitors) must never be washed
      // out by the glow, this sits below that layer too.
      layers.glow = new PIXI.Container();
      // M2: the monitors get their OWN container, a stage sibling exactly
      // like layers.glow — built once (buildMonitorGraphics, called from
      // drawPlate's success path) and never wiped by anyone else. It does
      // NOT share layers.props: that container has a per-cycle
      // wipe-and-rebuild contract (drawPillars calls removeChildren() on
      // every draw()), which is a different lifecycle than "build once,
      // never cleared" — putting both contracts in one container is how a
      // future props consumer forgets to preserve the monitors and the room
      // goes blank on air with no text-reading test able to see it. Placed
      // above layers.glow (so it never washes the candles out) and below props
      // (so pillars/labels still paint over it exactly as before, since they
      // never spatially overlap the painted screens anyway).
      layers.monitors = new PIXI.Container();
      layers.chars = new PIXI.Container();
      layers.props = new PIXI.Container();
      // Sprint 16 Task 10: `name-trader` originally sat on `desk-plate-trader`,
      // real clean desk paint (Task 9 verified it) that the seated rig's own
      // head rendered almost entirely in front of at this cast scale/anchor —
      // a fact nothing had ever rendered the room live enough to see. A
      // surface can be exactly where the plate says and still be unreadable
      // if a layer above it paints over it, which is as much "text where it
      // is not necessary" as hovering in the air was. Fix round: `name-trader`
      // moved to `desk-face-trader` (the desk's front panel, well clear of
      // the rig — see `world/plate.py`'s docstring and
      // `test_the_name_trader_surface_does_not_intersect_the_seated_rig`).
      // `nameplates` stays its own layer, added to `app.stage` LAST (after
      // `layers.chars`) regardless: it is what keeps a label from inheriting
      // a reaction's shake/hop, and it is cheap insurance against the next
      // surface ever landing under a figure again.
      layers.nameplates = new PIXI.Container();
      // Shadows are a *child* of the cast layer, not of any character: they
      // inherit CAST_SCALE and the layer's coordinate space for free, so a
      // shadow's x is just the character's x — but they are siblings of the
      // bodies, so a lean, a squash or a hop moves the body without dragging
      // its shadow off the floor with it. Added first, so they stay behind.
      layers.shadows = new PIXI.Container();
      layers.chars.addChild(layers.shadows);
      // The painted furniture that stands in FRONT of the cast — the chair
      // back the trader sits against. It is a second draw of the plate's own
      // pixels, masked to a polygon the manifest measures, so it lands above
      // `layers.chars` and below the labels. See `drawForeground`.
      layers.foreground = new PIXI.Container();
      app.stage.addChild(
        layers.plate, layers.room, layers.glow, layers.monitors,
        layers.props, layers.chars, layers.foreground, layers.nameplates);
      // Pixel-art rule: no sub-pixel compositing for anything the cast or its
      // furniture draws. The plate and the vignette stay off this list on
      // purpose — they are painted art and a soft light falloff, not part of
      // the grid. The glow layer is additive light too, for the same reason.
      layers.chars.roundPixels = true;
      layers.props.roundPixels = true;
      layers.monitors.roundPixels = true;
      layers.nameplates.roundPixels = true;

      await drawPlate();
      model = character("MODEL");
      trader = character("TRADER");
      // `character()`'s nameTag is shared with the gallery/animation-sheet
      // eval surfaces (`?gallery=1`/`?anims=1`), which legitimately float a
      // label beside a diagnostic specimen — the design rule ("no text in
      // the air") is about the ROOM, never those. The room's own name is
      // drawn separately below, from TEXT_PLACEMENTS, into `layers.nameplates`
      // rather than nested in each character's own (scaled, animated)
      // container — both live on furniture that does not move when a
      // reaction shakes or hops the figure above it, so the label must not
      // inherit that animation either. The constructor's floating copy is
      // blanked here rather than removed from `character()` itself, which
      // both eval surfaces still need. Built ONCE: the content never
      // changes per-frame, unlike the history line below.
      model.nameTag.text = "";
      trader.nameTag.text = "";
      layers.nameplates.addChild(
        ...[
          placedLabel(TEXT_PLACEMENTS["name-model"], "MODEL"),
          placedLabel(TEXT_PLACEMENTS["name-trader"], "TRADER"),
        ].filter(Boolean),
      );
      cast.push(model, trader);
      positionCharacters();
      startAmbient();
      bootSucceeded();

      // M2: polled, not streamed (KI-013 — see pollBars's own comment). Runs
      // regardless of which boot branch follows; pollBars is a no-op with no
      // plate, so this is as safe on the preview/gallery paths as it is live.
      pollBars();
      setInterval(pollBars, BARS_POLL_MS);

      // KI-046: posted every 15s regardless of which boot branch runs below —
      // the beat is about whether the renderer is alive, which is equally true
      // of a preview surface as of the on-air room. Keyed by Host server-side,
      // so a developer tab never covers for a dead on-air shard (see
      // world_heartbeat's docstring).
      setInterval(() => {
        fetch("/world/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ page: "world", frames: framesDrawn }),
        }).catch(() => {});   // a failed beat is the watchdog's problem, not the room's
      }, 15000);

      // scripts/shoot.py polls this instead of guessing a duration — readiness
      // is polled, not timed. That design only holds if the flag actually
      // means "drawn": set it before any gate's own draw call runs and the
      // poll is decorative, the settle sleep becomes the only real guard, and
      // shoot.py can photograph a page that reports ready before it painted
      // anything. So each gate below sets it itself, immediately after ITS
      // OWN drawing call, never here up front.

      // B1 evaluation gate: `?gallery=1` lays out both styles against every
      // mood so the options can be compared in one screenshot. Aesthetics is
      // the thing no assertion grades, so it needs to be *lookable*.
      if (new URLSearchParams(location.search).get("gallery") === "1") {
        drawGallery();
        window.__worldDrawn = true;
        return;
      }
      // `?anims=1` — the other half of the eval gate, and the half that was
      // missing: sixteen named animations shipped without anyone ever seeing
      // one. Every animation, on both cast bodies, looping. LOCAL ONLY — 32
      // characters ticking is not something to point a browser source at.
      if (new URLSearchParams(location.search).get("anims")) {
        drawAnimationSheet();
        window.__worldDrawn = true;
        return;
      }

      // B8's evaluation gate. The plan said "trigger via a synthetic tier-3
      // world event" — but `world_events` is append-only and its entire worth
      // is that it is true, which is the trade B4 already refused. So the
      // choreography runs here instead, on a LOCAL-ONLY surface the way
      // `?anims=1` does: no row is written, and nothing points a browser source
      // at it. Returns before subscribe(), which is also what makes it
      // screenshottable — headless Chrome hangs on this page's SSE.
      //
      // The severity is taken from the injected cuts rather than typed in, so
      // the preview swells for the same reason the live room does.
      if (new URLSearchParams(location.search).get("swell")) {
        const cuts = TIER_CUTS.cuts["model_losing_streak"] ?? TIER_CUTS.generic;
        const rehearse = () => {
          swell.last = -1e9;        // the floor guards the live room, not this
          react({
            event_type: "model_losing_streak",
            symbol: SYMBOLS[0] ?? "BTCUSDT",
            severity: cuts[cuts.length - 1] + 1,
            payload: {},
          });
        };
        rehearse();
        window.__worldDrawn = true;
        setInterval(rehearse, 12000);
        return;
      }

      // Live path: `draw(world)` happens inside refresh(), which already
      // swallows its own fetch/parse failures to keep the last frame on
      // screen (see refresh's own comment) — but the flag has to be honest
      // even if that ever stops being true. A dropped `/world/state` call is
      // a data problem, not a failure to draw the room (the cast is already
      // positioned above), so the flag is set from `finally`, not only on
      // success — otherwise a throwing refresh would leave `__worldDrawn`
      // false forever and shoot.py would spin its full 30s poll on a page
      // that is actually fine.
      try {
        await refresh();
      } finally {
        window.__worldDrawn = true;
      }
      subscribe();
      setInterval(refresh, 60000);   // projection stays authoritative server-side
    }

    function drawGallery() {
      setCharacterVisible(model, false);
      setCharacterVisible(trader, false);
      layers.room.visible = VOID_MODE ? false : true;
      layers.plate.visible = VOID_MODE ? false : true;
      // Live candles drew straight over the specimens (observed 2026-09-01).
      // The monitors are the room's content, not its scenery, so they go in
      // both modes.
      layers.monitors.visible = false;
      // Sprint 16 Task 10: `layers.nameplates` is independent of the room
      // characters `setCharacterVisible` above hides — it is built once at
      // fixed canvas coordinates, so left visible it draws "MODEL"/"TRADER"
      // over whichever grid cell happens to land on that spot (observed
      // 2026-09-07, this ticket's own screenshot). Same "eval surface hides
      // the room's content" rule the monitors line above already follows.
      layers.nameplates.visible = false;
      layers.chars.scale.set(1);     // the gallery does its own fitting
      // A representative spread rather than all 23 moods: every style compared
      // across the emotional range they actually have to carry.
      const moods = ["elated", "focused", "anxious", "dejected", "idle",
                     "startled", "bullish", "bearish"];
      // Derive the pitch instead of hard-coding it: at a fixed one, adding the
      // fifth style pushed it off the bottom of the canvas, and an option that
      // can't be seen is an option that never gets evaluated.
      const top = 56;                                    // clear the banner
      const rowH = (app.screen.height - top) / STYLES.length;
      const colW = app.screen.width / moods.length;
      // A sample is ~220 units tall above its feet (the mood tag) and ~60
      // below (name + style), so 320 per row leaves a margin at any height.
      const fit = Math.min(1, rowH / 320, colW / 200);
      STYLES.forEach((style, row) => {
        moods.forEach((mood, col) => {
          const sample = character(mood, style);
          sample.container.scale.set(fit);
          sample.container.x = colW * (col + 0.5);
          sample.container.y = top + rowH * row + 220 * fit;
          sample.baseX = sample.container.x;
          sample.baseY = sample.container.y;
          sample.headBaseY = sample.head.y;
          setExpression(sample, mood);
          sample.moodTag.text = mood;
          sample.stat.text = style;
        });
      });
    }

    // Sixteen animations went live without anyone seeing one: a still frame
    // can't show motion, and three of them (wave, shake, flicker) are at or
    // near zero displacement at any phase you'd think to freeze. So the sheet
    // LOOPS them, through `advanceCharacters` — a sheet with its own player
    // would be showing me an animation nobody ships.
    // C2 review round 1, Finding 2b: this sheet is the ticket's own
    // prescribed check ("check that in every frame of every trader animation
    // the figure stays in the chair") - the real query param is `?anims=`,
    // not the brief's invented `?sheet=1`. Before this fix it was
    // unperformable: `character(style, style)` passes a BODY-STYLE name
    // ("figure") where `anchorFor` wants a CHARACTER name ("trader"), so
    // every sample resolved pose:"standing" and seatedRig never ran here,
    // and `asleep`/`gesture`/`breathe` aren't ANIM keys at all, so they
    // could not even be listed.
    function drawAnimationSheet() {
      setCharacterVisible(model, false);
      setCharacterVisible(trader, false);
      layers.room.visible = VOID_MODE ? false : true;
      layers.plate.visible = VOID_MODE ? false : true;
      // Live candles drew straight over the specimens (observed 2026-09-01).
      // The monitors are the room's content, not its scenery, so they go in
      // both modes.
      layers.monitors.visible = false;
      // See drawGallery's own comment: `layers.nameplates` is fixed-position
      // and independent of the room characters this sheet already hides.
      layers.nameplates.visible = false;
      // Deliberately not the gallery's scale-1: `slump` moves a head 13.5px,
      // and whether that reads as dejected or as a head in a torso is a
      // question about broadcast size. Tier-3 amplitude, for the same reason.
      layers.chars.scale.set(CAST_SCALE);
      const amp = 0.6 + 3 * 0.25;
      // `?anims=slump` narrows to one animation across every body — iterating
      // on a single pose against 32 looping cells is how you miss things.
      const only = new URLSearchParams(location.search).get("anims");
      // Cells are (character-name, body-style, animation-name) triples, not
      // a name x style cross product: `gesture`/`breathe`/`asleep` only mean
      // anything for the trader, and trying them against the model's bars
      // body would call `SEATED_ANIMATIONS[name] || ANIM[name]` with both
      // sides undefined and throw.
      let cells;
      if (ANIM[only]) {
        // Unchanged from before this fix: one animation surveyed across
        // every candidate body, standing, for comparing body TYPES rather
        // than casting - `style` stays the sample's own name here on purpose.
        cells = STYLES.map((style) => [style, style, only]);
      } else if (SEATED_ANIMATIONS[only] && !ANIM[only]) {
        cells = [["TRADER", CAST.TRADER, only]];
      } else {
        cells = [
          ...Object.keys(ANIM).map((name) => [CAST.MODEL, CAST.MODEL, name]),
          // "TRADER", not CAST.TRADER twice - the one change that makes
          // `anchorFor("trader")` resolve `pose: "seated"` and seatedRig run.
          ...Object.keys(ANIM).map((name) => ["TRADER", CAST.TRADER, name]),
          // The three names ANIM doesn't have at all - otherwise declared
          // and never once seen, the exact defect this ticket is about.
          ...Object.keys(SEATED_ANIMATIONS)
            .filter((name) => !ANIM[name])
            .map((name) => ["TRADER", CAST.TRADER, name]),
        ];
      }
      const total = cells.length;
      const cellW = 250;
      const cols = Math.max(1, Math.floor(app.screen.width / cellW));
      const rows = Math.ceil(total / cols);
      // A cell shorter than this overlaps its neighbour's labels. The sheet is
      // a local page, so it runs off the bottom of a short window rather than
      // shrinking the thing whose size is the question.
      const rowH = Math.max(330, (app.screen.height - 40) / rows);
      cells.forEach(([name, style, anim], idx) => {
        const sample = character(name, style);
        sample.container.x = cellW * ((idx % cols) + 0.5) / CAST_SCALE;
        sample.container.y =
          (40 + rowH * Math.floor(idx / cols) + rowH * 0.86) / CAST_SCALE;
        sample.baseX = sample.container.x;
        sample.baseY = sample.container.y;
        sample.headBaseY = sample.head.y;
        setExpression(sample, "focused");
        sample.moodTag.text = anim;
        sample.stat.text = "";
        sample.loopAnim = anim;
        sample.amp = amp;
        sample.duration = ANIM_DURATION[anim] ?? 0.9;
        sample.phase = (idx * 0.13) % 1;   // stagger, so it isn't a chorus line
        cast.push(sample);
      });
    }

    function label(text, x, y, size, tint) {
      const t = new PIXI.Text({ text, style: {
        fill: tint ?? 0xd1d4dc, fontFamily: "system-ui", fontSize: size,
      }});
      t.x = x; t.y = y;
      return t;
    }

    // Sprint 16 Task 10: the room's own text is never positioned by a
    // literal offset any more (KI-054's sibling failure, one layer up — a
    // label that hovers near a character instead of sitting on the surface
    // the room actually painted for it). `placement` is a resolved
    // `TEXT_PLACEMENTS.*` entry, so the caller always names the const field
    // directly (`TEXT_PLACEMENTS.history`, `TEXT_PLACEMENTS["name-model"]`)
    // rather than routing through a second lookup this function would have
    // to trust. A placement that did not resolve (surface repainted away,
    // manifest missing) is `undefined` here, same contract as `as_json`
    // itself: the label is omitted, never a throw into the render loop.
    function placedLabel(placement, text, tint) {
      if (!placement) return null;
      return label(text, placement.x, placement.y, placement.size, tint);
    }

    // B2: the room is built ONCE and only its alpha and tint are animated.
    // OBS renders this in software on a box that also encodes 1080p, and a
    // full-canvas Graphics rebuilt per frame is the one way this ticket could
    // cost the stream frames — it currently drops zero.
    let floorLine, wall, floorPlane, vignette;

    // Scene-wide lighting per tier, from world/visuals.py — a canvas-shaped
    // ramp, deliberately not the DOM one (see `room_light`). Eased toward,
    // never snapped to: escalate and decay are the *ambient* half of
    // calm-that-swells, so the room brightens over seconds, not on a frame.
    const ROOM_LIGHT = __ROOM_LIGHT_JSON__;

    // The vignette only. PIXI v8 *does* have `FillGradient` (the wall below
    // uses it) — but its radial path cannot express a transparent centre:
    // `buildRadialGradient` pre-fills the whole gradient texture with the LAST
    // colour stop before painting the ramp over it, and our last stop is opaque
    // black, so a source-over ramp of transparent-black changes nothing and the
    // room renders as a solid black rectangle. Measured, not guessed: against
    // the canvas version this came out max delta 255/255, mean 51.5.
    // Faking it with stacked Graphics bands was the other thing tried, and it
    // reads as a wireframe. So: canvas texture, built on layout only (boot +
    // resize), never per frame.
    function gradientSprite(paint, w, h) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(w));
      canvas.height = Math.max(1, Math.ceil(h));
      paint(canvas.getContext("2d"), canvas.width, canvas.height);
      return new PIXI.Sprite(PIXI.Texture.from(canvas));
    }

    let plateReady = false;

    // The plate is a new hard on-air dependency, which is precisely the shape
    // of KI-045 — and KI-047 is the same page going white for 36 hours because
    // nothing noticed a dead renderer. So the failure path is written first and
    // the success path is the special case: no plate, no manifest, or a texture
    // that will not decode all land in the procedural room the stream already
    // ships.
    // A second draw of the plate, masked to the painted furniture that stands
    // between the camera and the cast, parented above `layers.chars`.
    //
    // The plate is ONE flat image, so without this every character is a
    // sticker on the front of the room: measured at the anchor it actually
    // renders at, the trader's torso stopped at screen x 1375 and the painted
    // backrest's left edge starts at 1375 — he was drawn flush against the
    // chair, never into it.
    //
    // It re-draws the WHOLE plate sprite rather than a cropped frame on
    // purpose. Built exactly the way `drawPlate` builds the background one
    // (same texture, same `PLATE.canvas` size, same layer coordinate space),
    // it lands pixel-for-pixel over it BY CONSTRUCTION, with no frame offset
    // to get wrong; the mask is the only thing deciding what shows. A crop
    // would be the same picture plus arithmetic that can drift from the
    // manifest.
    //
    // No `foreground` in the manifest — an older plate, or a repaint that
    // dropped it — means no sprite and no mask, which is the flat room that
    // shipped all sprint. Same degrade rule `text_surfaces` and
    // `ambient_lights` already follow.
    // It carries its OWN try/catch, and that is the most important line in
    // it. It is called from inside `drawPlate`'s try, so without one a
    // malformed polygon would not cost the chair slice — it would cost the
    // glows, the live monitors, the city lights and the plate itself, and
