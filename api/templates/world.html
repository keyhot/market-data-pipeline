    // drop a painted room to the procedural one. A chair back is cosmetic;
    // the room is not. The suite measured exactly that collapse the first
    // time this was wired without the catch (`test_a_throwing_builder_
    // degrades_to_a_clean_procedural_room` went red on the GLOW count).
    function drawForeground(texture) {
      try {
        const regions = (PLATE && PLATE.foreground) || [];
        if (!layers.foreground || !regions.length) return;
        const mask = new PIXI.Graphics();
        for (const region of regions) {
          // A region with no polygon masks nothing rather than masking
          // everything: an unmasked full-plate sprite over `layers.chars`
          // paints the whole room on top of the cast.
          if (!Array.isArray(region.poly) || region.poly.length < 3) continue;
          mask.poly(region.poly.flat());
          mask.fill(0xffffff);
        }
        const sprite = new PIXI.Sprite(texture);
        sprite.width = PLATE.canvas[0];
        sprite.height = PLATE.canvas[1];
        sprite.mask = mask;
        layers.foreground.addChild(mask, sprite);
      } catch (err) {
        console.error("foreground failed; the room keeps its plate", err);
      }
    }

    async function drawPlate() {
      if (!PLATE_SRC) { drawProceduralRoom(); return; }
      try {
        const texture = await PIXI.Assets.load(PLATE_SRC);
        const sprite = new PIXI.Sprite(texture);
        sprite.width = PLATE.canvas[0];
        sprite.height = PLATE.canvas[1];
        // Nearest-neighbour: the plate is pixel art, and smoothing it is the
        // one thing guaranteed to make it look worse than the room it replaces.
        texture.source.scaleMode = "nearest";
        layers.plate.addChild(sprite);
        // The same texture again, above the cast, masked to the painted
        // furniture that stands in front of them.
        drawForeground(texture);
        // Built once, right here — never inside the per-frame ticker. See
        // buildGlows's own comment for why.
        buildGlows();
        // M2: one Graphics per painted monitor, same "build once" rule —
        // never inside drawCandles or the poll loop. See buildMonitorGraphics
        // below.
        buildMonitorGraphics();
        // Task 14: the painted city's window lights, same "build once" rule
        // — never inside the per-frame ticker. See buildAmbientLights above.
        buildAmbientLights();
        // Claimed only once ALL THREE builders have actually succeeded —
        // not before them. Every other read of `plateReady` (the vignette
        // gate, applyGlow, tickAmbientLights, drawCandles) treats it as "the
        // room is safe to light as painted"; claiming it before the builders
        // ran let a throw inside any of them leave the flag true while the
        // catch below drew the procedural room on top of the still-added
        // plate sprite — plate and procedural room composited together, a
        // darkened double-exposure.
        plateReady = true;
        // The plate reserves a quiet strip at the top for the newcomer line.
        // Bind the banner to the measurement so a repaint moves the text with
        // the art instead of hanging it over a painted detail.
        // The bottom band DOES have an element - `#nowband`, the page's
        // largest text - and it is CSS-positioned by decision (KI-070): a
        // flex bar pinned `bottom: 0`, whose cells are laid out by the
        // browser rather than placed from the manifest. So `bands.bottom`
        // binds nothing here, and the two `band-bottom` placements that
        // described it were deleted rather than left to pass a CI check
        // over a layout the page does not draw. `history` is the one thing
        // actually drawn on that band, and it is placed (see `draw()`).
        const banner = document.getElementById("banner");
        const bandHeight = bannerMinHeight();
        if (banner && bandHeight) {
          banner.style.minHeight = bandHeight + "px";
        }
        // Sprint 16 Task 10: the bar's own height above binds to the full
        // quiet strip (a background choice, not text); the READABLE line
        // inside it binds to `TEXT_PLACEMENTS.banner` directly, so the rule
        // ("no text in the air") covers this DOM element the same way it
        // covers every canvas label — a repaint that moved the placement
        // moves where the sentence actually sits, not just how tall its bar is.
        const bannerText = TEXT_PLACEMENTS.banner;
        if (banner && bannerText) {
          // `dx`/`dy`, not `x`/`y`: this bar is pinned to the top-left of
          // the surface and pads its line INSIDE itself, so it wants the
          // offset within the surface, never the absolute canvas point the
          // canvas labels are drawn at (KI-072). The two are the same
          // numbers only while `band-top` sits at the canvas origin.
          banner.style.paddingLeft = bannerText.dx + "px";
          banner.style.paddingTop = bannerText.dy + "px";
          banner.style.fontSize = bannerText.size + "px";
        }
      } catch (err) {
        // Deliberately NOT retryBoot(): a reload cannot conjure a missing
        // texture, and a reload storm against a 404 helps nobody (the cap in
        // retryBoot exists for exactly that). Degrade and carry on.
        console.warn("plate failed to load", err);
        // `plateReady` is still false here by construction (see the comment
        // above) — but the sprite may already be sitting in `layers.plate`
        // if the throw came from a builder rather than the texture load
        // itself. Strip it before drawing the fallback, or the room reads as
        // plate-and-procedural-room composited rather than a clean degrade.
        layers.plate.removeChildren();
        drawProceduralRoom();
      }
    }

    function drawProceduralRoom() {
      wall = new PIXI.Graphics();
      floorPlane = new PIXI.Graphics();
      floorLine = new PIXI.Graphics();
      vignette = new PIXI.Container();
      layers.room.addChild(wall, floorPlane, floorLine);
      // Above everything, including the characters: a vignette the cast stood
      // in front of would be a grey rectangle, not a darkened room.
      app.stage.addChild(vignette);
      layoutRoom();
    }

    // The renderer follows the window (`resizeTo`), and the characters are
    // re-placed on every draw — so a floor drawn once at boot drifts off them
    // and they end up standing through it. Same expression, same moment.
    function layoutRoom() {
      if (!floorLine) return;
      const w = app.screen.width, h = app.screen.height, ground = h * GROUND;
      floorLine.clear().rect(0, ground, w, 3).fill(0x2a2e39);

      // Depth in three pieces: a back wall darkening toward the ceiling, a
      // floor plane a shade lighter, and a vignette closing the corners.
      // `textureSpace: "global"` takes the same pixel coordinates the canvas-2D
      // version did, so this is a straight port — verified pixel-for-pixel
      // against it (max delta 1/255, and that one is a sub-pixel row the canvas
      // version gained by rounding `ground` up).
      wall.clear().rect(0, 0, w, ground).fill(new PIXI.FillGradient({
        textureSpace: "global",
        start: { x: 0, y: 0 },
        end: { x: 0, y: ground },
        colorStops: [
          { offset: 0, color: "rgba(0,0,0,0.42)" },
          { offset: 1, color: "rgba(0,0,0,0)" },
        ],
      }));

      floorPlane.clear().rect(0, ground, w, h - ground)
        .fill({ color: 0xffffff, alpha: 0.022 });

      vignette.removeChildren();
      vignette.addChild(gradientSprite((ctx, cw, ch) => {
        const g = ctx.createRadialGradient(
          cw / 2, ch / 2, Math.min(cw, ch) * 0.32,
          cw / 2, ch / 2, Math.max(cw, ch) * 0.72,
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(0.6, "rgba(0,0,0,0.45)");
        g.addColorStop(1, "rgba(0,0,0,1)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, cw, ch);
      }, w, h));
    }

    // The symbol pillars — and they are pillars now. They were horizontal bars
    // pinned to the top-right at a fixed 140px pitch, which clipped the first
    // one clean off the canvas at 1080p and read as stray UI rather than as
    // anything in the room. Now they stand ON the floor the characters stand
    // on, sized from the canvas, behind the cast (`layers.props`), so the room
    // has a background made of the market itself.
    // --- P5: the layout is read off the plate, not off the canvas ----------
    // With a plate, every position here is a measurement taken from the
    // painted room (world/plate.py, checked against the PNG itself). Without
    // one — a missing manifest, a texture that will not decode, KI-045's shape
    // — they fall back to the canvas fractions the procedural room has always
    // used, so the degraded path stays exactly as watchable as it is today.
    // Both branches are executed in node by tests/api/test_world_page.py;
    // substring checks over the page could not tell them apart.
    const CAST_FRACTIONS = { model: 0.32, trader: 0.62 };

    function anchorFor(name) {
      const painted =
        plateReady && PAINTED_CAST ? PAINTED_CAST.characters[name] : null;
      if (painted) {
        // `pose` is the plate's answer to "is there a chair here" — the trader
        // is seated on this plate. C2 rebuilds the rig around it; it is
        // returned rather than assigned so there is no dead write waiting for
        // that ticket.
        return {
          x: painted.x,
          baseY: painted.base_y,
          pose: painted.pose || "standing",
          // Two more measurements the painted furniture carries, both optional
          // and both degrading to "the figure the page drew before there was a
          // plate": which way the chair points (`seatedRig` turns the whole
          // pose through it) and how big this body is beside it.
          facing: painted.facing || null,
          figureScale: painted.figure_scale || 1,
        };
      }
      return {
        x: app.screen.width * (CAST_FRACTIONS[name] ?? 0.5),
        baseY: app.screen.height * GROUND,
        pose: "standing",
        facing: null,
        figureScale: 1,
      };
    }

    // Where a seated body's HIPS go, which is a different question from where
    // a seated body FITS. `seat` is the fit budget — the cushion's painted
    // span, what the rig's width is checked against. `sit_anchor` is the point
    // the rig's origin is pinned to. Sprint 15 used one number for both, taking
    // the seat rect's centre as the anchor, and the figure still landed beside
    // the chair (KI-054): this plate draws the chair in three-quarter view, so
    // the cushion's centre and the point a sitter's hips occupy are ~7px and
    // ~8px apart in different directions, and the backrest is up-and-right of
    // both. Two measurements now, two fields.
    //
    // Returns null — never a throw and never a guess — when the plate has no
    // `sit_anchor` (an older manifest, a repaint mid-edit). The caller then
    // keeps the standing anchor, which is exactly the placement that shipped
    // before this existed: a degrade to the previous look, not to a blank one.
    function sitAnchorFor(name) {
      const painted =
        plateReady && PAINTED_CAST ? PAINTED_CAST.characters[name] : null;
      const sit = painted ? painted.sit_anchor : null;
      if (!sit || sit.x == null || sit.y == null) return null;
      return { x: sit.x, baseY: sit.y };
    }

    // How tall the newcomer banner must be to sit on the strip the plate left
    // quiet for it. `null` means "no plate — leave the CSS alone". A value
    // rather than a branch inside drawPlate, because a test can only run a
    // value: asserting the manifest key appears in the function passed
    // identically with the height hardcoded.
    function bannerMinHeight() {
      if (!plateReady || !PLATE || !PLATE.bands || !PLATE.bands.top) return null;
      return PLATE.bands.top;
    }

    function tubeFor(symbol) {
      if (!plateReady || !PLATE || !PLATE.tubes) return null;
      return PLATE.tubes.find((tube) => tube.symbol === symbol) || null;
    }

    // Where one pressure pillar goes. Separated from the drawing so it can be
    // run without PIXI: an off-by-tens against the painted bore is the whole
    // risk of this ticket, and it is the kind of thing only arithmetic can
    // catch before X2 puts it on air.
    function pillarGeometry(symbol, pressure, index) {
      const tube = tubeFor(symbol);
      const ground = app.screen.height * GROUND;
      const tallest = Math.min(ground - 120, app.screen.height * 0.42);
      const baseY = tube ? tube.base_y : ground;
      const width = tube ? tube.width : 54;
      // A painted tube is a housing with a visible end: the bar may fill it,
      // never overrun it. Without a plate the old ceiling still applies.
      const maxHeight = tube ? tube.height : tallest;
      // Tall enough to be architecture. At 70px they read as bins next to a
      // 240px cast; a pillar has to give the room a vertical.
      const height = Math.min(190 + Math.abs(Number(pressure) || 0) * 70, maxHeight);
      // Right of the cast and marching off toward the corner when procedural,
      // so they read as depth rather than as a chart; centred in the bore when
      // the plate painted one.
      const x = tube ? tube.x - width / 2 : app.screen.width * 0.80 + index * 132;
      // KI-055: the tube is a cylinder seen slightly from above, so the fill's
      // top and base are ellipses, not flat caps - `bore_ry` is that ellipse's
      // measured squash (KI-055, Docs/known-issues.md). Read here, not re-derived
      // in drawPillars, for the same reason this whole function exists:
      // off-by-tens against the painted bore is arithmetic, checkable without
      // PIXI. No painted tube means no measured squash either, so this falls
      // back to a fixed fraction of the (also-fallback) width rather than
      // reaching into a null tube - the same degrade-not-throw rule
      // rampLevel/CONTACT use above.
      const boreRy = tube && Number.isFinite(tube.bore_ry) ? tube.bore_ry : width * 0.13;
      return { x, baseY, width, height, boreRy };
    }

    function drawPillars(state) {
      // M2: the monitor Graphics live in their OWN layer (layers.monitors),
      // never in layers.props — this removeChildren() only ever touches
      // pillars/caps/labels, the things drawPillars/draw() itself put here.
      layers.props.removeChildren();
      const symbols = Object.entries(state.symbols ?? {})
        .filter(([symbol]) => SYMBOLS.includes(symbol));
      if (!symbols.length) return;
      symbols.forEach(([symbol, data], i) => {
        const geo = pillarGeometry(symbol, data.pressure, i);
        // The tube fill is a column of discrete cells, not a smooth
        // roundRect — decided 2026-08-25 from the reference image, which
        // draws it as stacked units. One cell of gap every two blocks so the
        // column reads as filled units rather than a single bar.
        const pillar = new PIXI.Graphics();
        const blocks = Math.floor(geo.height / (CELL * 2));
        for (let b = 0; b < blocks; b++) {
          pillar.rect(snap(geo.x), snap(geo.baseY - (b + 1) * CELL * 2), geo.width, CELL)
                .fill({ color: color(data.mood), alpha: 0.85 });
        }
        // KI-055: the tubes are painted cylinders seen slightly from above,
        // so the surface of what fills them is an ellipse. A flat cap
        // contradicts the perspective of the art it sits inside — it reads
        // as a bar chart, which is the model's BODY, not the room's
        // furniture. The base gets the same treatment: it is the tube's own
        // floor, always visible under the fill, never a flat edge either.
        const cap = new PIXI.Graphics();
        const fillColour = color(data.mood);
        // Review round 2, MINOR 6: every other draw in this function snaps
        // its POSITION but not its size (`pillar.rect` above snaps `geo.x`,
        // never `geo.width`) — the cap's centre-x is the one coordinate that
        // skipped it, ~2px off the stripes it caps. `snap(geo.x)` is the
        // exact value the stripes themselves are drawn from, so adding half
        // the (unsnapped) width lands the cap dead-centre on the column it
        // caps, not just closer to it. `cy` is deliberately NOT snapped here
        // — review round 2, MINOR 2: the cap already sits a few px above the
        // painted bore's own measured centre (pinned in
        // tests/unit/test_plate_manifest.py), and that gap looked right
        // in-frame; snapping cy would nudge it without anyone having asked
        // to move it.
        const capX = snap(geo.x) + geo.width / 2;
        // Review round 2, finding (d): opaque caps over an alpha:0.85 fill
        // read as a different, harder material sitting on top of the liquid
        // rather than its own surface. Same alpha as the column it caps.
        cap.ellipse(capX, geo.baseY - geo.height, geo.width / 2, geo.boreRy)
           .fill({ color: shade(fillColour, rampLevel("lit")), alpha: 0.85 });
        cap.ellipse(capX, geo.baseY, geo.width / 2, geo.boreRy)
           .fill({ color: shade(fillColour, rampLevel("shade")), alpha: 0.85 });
        // Sprint 16 Task 10: no per-tube symbol/mood label any more — both
        // floated at a fixed offset off the tube's own base, with no
        // declared surface (Task 9 deleted `symbol-BTCUSDT`/`symbol-ETHUSDT`
        // from `text` for exactly that reason), and #nowband already prints
        // every symbol's price and mood on every frame.
        layers.props.addChild(pillar, cap);
      });
    }

    // --- B1: procedural characters ----------------------------------------
    // The inhabitants were colour-swatch circles: the room had a mood but no
    // face, and reactions.py's named animations (jolt/shake/hop/…) existed only
    // as strings. Both are real now. Procedural geometry only — no external
    // assets, so the CSP/SRI rule holds and there is no asset pipeline.
    const REACTIONS = __REACTIONS_JSON__;
    // The bodies are built from the market's own glyphs rather than from
    // anatomy. This world is made of price data; its inhabitants should be
    // too — and a candle or a bar cluster still reads at 120px on a stream,
    // where limbs turn to mush. The face is identical across all of them.
    const STYLES = ["bars", "figure", "candle", "monolith", "orb"];
    // The pick (2026-08-12). Not one style for everyone: the MODEL is a
    // machine, the TRADER is a person. Two events land on two silhouettes you
    // can tell apart at a glance and across the room — which is what makes
    // "they disagreed" legible without labels.
    //
    // The MODEL used to be "a machine built out of the market's own glyphs",
    // and increment 11 (2026-09-21) deliberately gave that up: the user's
    // 2026-09-11 call is a plated robot with no candle glyphs, trading the
    // made-of-the-market link for an unambiguous robot read. `bars` is
    // therefore a LEGACY KEY — it names a body that has no bars in it — and
    // it is kept because `STYLES`, `FACE_KIND`, `HEAD_TRAVEL`, `SHADOW_WIDTH`
    // and `STYLE_OVERRIDE` all spell it, so renaming costs five registry
    // edits and buys no picture.
    const CAST = { MODEL: "bars", TRADER: "figure" };
    // `?style=` overrides the whole cast — it exists for evaluation, so it has
    // to be able to put everyone in the same body for comparison.
    const STYLE_OVERRIDE = new URLSearchParams(location.search).get("style");

    // Where the floor is, and how big the cast stands on it. Both were spelled
    // 0.72 in three places, which is how the floor and its inhabitants came
    // apart in the first place.
    const GROUND = 0.66;
    // The pair read as two small icons on a wide dark plane — about a quarter
    // of the frame, which on a phone-sized YouTube window is nothing. The
    // LAYER carries the scale, not the characters: half the named animations
    // set `container.scale` themselves and would clobber a per-character one.
    //
    // 1.5, not 1.35 (review round 1, Finding 1): `positionCharacters` divides
    // every anchor by CAST_SCALE before assigning it, and this layer then
    // re-multiplies by the same factor — rendered position on the painted
    // plate is provably invariant to CAST_SCALE, so changing it moves nothing
    // and only resizes the cast. What it DOES change is the on-screen size of
    // the cast's own 4px local grid: at 1.35 that renders as 5.4 screen px,
    // which `roundPixels` then rounds to 5 or 6 depending on phase — the step
    // JITTERS, worse than a fixed off-grid value. At 1.5 it renders as an
    // exact 6 screen px: integer, uniform, no jitter, and every `snap()` call
    // site in the cast stays correct with the one CELL/snap definition — no
    // second snap function for a second coordinate space, which is a second
    // definition of the same rule that later tickets would have to choose
    // between.
    //
    // Known residual, left deliberate rather than hidden: the cast now renders
    // on a uniform 6px cell while the props (pillars) render on a true 4px
    // cell — a consistent grid PER SURFACE, not one 4px grid across the whole
    // room. Strict single-grid conformance needs CAST_SCALE = 1, a 26% shrink
    // of the only two figures on screen, which trades this sprint's headline
    // goal (watchability) for a parenthetical. One constant to reverse after
    // a visual check, not a redesign.
    //
    // Sprint 16: the visual check happened, at the 1920x960 the browser source
    // actually is. 1.5 puts a 42px-radius head on the model — over half the
    // height of the painted bonsai beside it — and lifts the trader's crown
    // 67px clear of its own chair's backrest, which is what "standing in front
    // of the chair" turned out to mean. So the size of the cast is a
    // MEASUREMENT against the painted furniture now, not a constant: it lives
    // in the manifest next to the seat and the tubes, and a repaint re-measures
    // it instead of re-coding it. The literal is the no-plate fallback, and it
    // has to keep CELL * CAST_SCALE a whole number of screen pixels (see
    // test_animation_displacement_actually_quantises_to_the_grid, which grades
    // exactly this literal): 1.25 renders the 4px cell as an exact 5px.
    const CAST_SCALE = (PAINTED_CAST && PAINTED_CAST.scale) || 1.25;

    function styleFor(name) {
      const style = STYLE_OVERRIDE || CAST[name];
      return BODIES[style] ? style : "bars";
    }

    // Expression as two axes rather than 19 hand-drawn faces: valence bends
    // the mouth, arousal opens the eyes and lifts the brows. Every mood the
    // reactions registry can emit has an entry (page test enforces it); an
    // unknown one lands on neutral rather than a blank stare.
    const FACE = {
      elated:    { valence:  1.0, arousal: 0.9 },
      relieved:  { valence:  0.7, arousal: 0.2 },
      proud:     { valence:  0.8, arousal: 0.5 },
      eager:     { valence:  0.7, arousal: 0.8 },
      decisive:  { valence:  0.4, arousal: 0.7 },
      focused:   { valence:  0.0, arousal: 0.6 },
      attentive: { valence:  0.1, arousal: 0.5 },
      speaking:  { valence:  0.2, arousal: 0.5 },
      weighing:  { valence: -0.1, arousal: 0.3 },
      idle:      { valence:  0.0, arousal: 0.0 },
      neutral:   { valence:  0.0, arousal: 0.3 },
      surprised: { valence:  0.2, arousal: 1.0 },
      startled:  { valence: -0.2, arousal: 1.0 },
      alert:     { valence:  0.0, arousal: 0.9 },
      anxious:   { valence: -0.5, arousal: 0.8 },
      alarmed:   { valence: -0.7, arousal: 1.0 },
      resigned:  { valence: -0.4, arousal: 0.1 },
      dejected:  { valence: -0.9, arousal: 0.2 },
      grim:      { valence: -0.8, arousal: 0.4 },
      calm:      { valence:  0.1, arousal: 0.2 },
      bullish:   { valence:  0.8, arousal: 0.6 },
      bearish:   { valence: -0.8, arousal: 0.6 },
      panicked:  { valence: -1.0, arousal: 1.0 },
    };

    function faceFor(mood) {
      return FACE[mood];
    }

    // Each body is a market glyph. `accents` are the parts that can move
    // independently of the mass — wicks, bars — which is what gives these
    // silhouettes something to act with in place of limbs.
    const BODIES = {
      // A candlestick: real body between two wicks. The project's own glyph,
      // and the one that reads most instantly as "this thing is the market".
      candle(body, accents) {
        paint(body, litRect(-27, -104, 54, 84, 8), BODY_FILL);
        // Wick thick enough to read as a neck at stream distance, and short
        // enough that the head sits ON the candle rather than floating over it.
        const wickTop = new PIXI.Graphics();
        paint(wickTop, litRect(-3.5, -130, 7, 30, 3.5), BODY_FILL);
        const wickLow = new PIXI.Graphics();
        paint(wickLow, litRect(-3.5, -22, 7, 26, 3.5), BODY_FILL);
        // A wick flicks by lengthening. It cannot swing: it's drawn in the
        // character's own space, so rotating it pivots about the feet.
        wickTop.gestureMode = wickLow.gestureMode = "pump";
        accents.push(wickTop, wickLow);
        return -142;
      },
      // A cluster of bars — volume, an equaliser, a heartbeat. The most
      // animatable body: the bars themselves can jump, ripple and settle.
      // The MODEL: a plated machine. The key is a legacy name — this body was
      // five candlestick glyphs until 2026-09-21, and `CAST.MODEL`,
      // `FACE_KIND`, `HEAD_TRAVEL`, `SHADOW_WIDTH` and `STYLE_OVERRIDE` all
      // spell it, so renaming it would be five registry edits for no picture.
      //
      // The reference art builds this robot out of teal candlesticks and the
      // user's 2026-09-11 call overrides that deliberately — "a plated
      // machine: panelled chassis, visible joints, antenna, glowing eyes. No
      // candle glyphs" — trading the made-of-the-market link for an
      // unambiguous robot read.
      //
      // Every origin below is a whole CELL. `litRect` snaps both coordinates
      // to the 4-unit grid and leaves sizes alone, so an origin off the grid
      // moves when the grid rounds it, and two seams authored less than a
      // cell apart land in the same one — increment 10's surviving mutation,
      // one body over.
      bars(body, accents) {
        // A seam's thickness. Sizes are not snapped, so this is free to be
        // whatever reads: 3 units is 3.75px at the MODEL's 1.25 scale, thin
        // enough to be a gap and thick enough to survive the encoder.
        const cut = 2;
        // Bottom-up, and every part MEETS the next. The candle cluster's real
        // defect was never its vocabulary — it was that five columns touched
        // neither each other nor the head above them, so the silhouette was a
        // lollipop over a picket fence and no amount of shading could join it.
        paint(body, litRect(-24, -48, 16, 48, 3), BODY_FILL);    // leg, near
        paint(body, litRect(8, -48, 16, 48, 3), BODY_FILL);      // leg, far
        paint(body, litRect(-28, -72, 56, 28, 4), BODY_FILL);    // pelvis
        paint(body, litRect(-32, -132, 64, 60, 6), BODY_FILL);   // the chassis
        // Shoulders, which exist so the arms have somewhere to hang FROM: an
        // accent rotates about its own origin, and an arm pivoting inside the
        // chassis tears out of it on the first gesture.
        paint(body, litRect(-48, -120, 16, 20, 4), BODY_FILL);
        paint(body, litRect(32, -120, 16, 20, 4), BODY_FILL);
        // Panelling and joints are CUTS, never separate plates. `paint` lays
        // three banded insets into every volume, and on a small shape those
        // come out as a dark ring round a pale core — the joint cap that made
        // the trader's elbow read as a bolt, which a robot built out of little
        // plates and pins would repeat everywhere. One slab keeps the bands
        // reading as shading; the panels are what is left between the cuts.
        //
        // `{ keepFill, matte }`, the same shape as `shod` and the hand's
        // creases, for the same two reasons: keepFill so a seam is neither
        // recoloured by the mood nor outlined, matte so `shade` does not mix
        // its lit rung 0.3 toward the lamp's hue and turn a gap between two
        // plates into a scratch down the middle of one.
        const seamed = { keepFill: true, matte: true };
        // Kept below y -110, where the skull's own silhouette ends: panelling
        // drawn under the head is panelling nobody sees.
        paint(body, litRect(-32, -104, 64, cut, 1), MACHINE.seam, undefined, seamed);
        paint(body, litRect(0, -104, cut, 32, 1), MACHINE.seam, undefined, seamed);
        // The arms ARE the gesture. `gesture()` only ever moves what is on
        // `accents`; the cluster put five bars there and let the ripple be the
        // animation ("pump"), and a chassis has no ripple. Without these the
        // machine would go inert for every one of `ANIM`'s animations — the
        // detail-versus-animation failure this whole redesign is built to
        // avoid, and the one thing here no screenshot would ever report.
        for (const side of [-1, 1]) {
          const arm = new PIXI.Graphics();
          paint(arm, litRect(-6, -8, 12, 52, 4), BODY_FILL);
          // The visible joints: a shoulder and an elbow, cut into the one
          // slab rather than built as three.
          paint(arm, litRect(-6, 4, 12, cut, 1), MACHINE.seam, undefined, seamed);
          paint(arm, litRect(-6, 24, 12, cut, 1), MACHINE.seam, undefined, seamed);
          arm.x = side * 40;
          arm.y = -108;               // inside the shoulder block, not at the floor
          arm.gestureMode = "swing";  // what hangs from a joint swings
          // Not quite matching, the same two numbers `figure` spends: dead
          // symmetry reads as a mannequin even on a machine.
          arm.restRotation = side < 0 ? -0.06 : 0.10;
          // A lighter value than the chassis, or a resting robot reads as one
          // slab and its arms only appear mid-animation.
          arm.shadeFactor = 1.35;
          accents.push(arm);
        }
        // Unchanged, and deliberately: `HEAD_TRAVEL.bars`, `SHADOW_WIDTH.bars`
        // and the mood tag's own offset are all tuned against this number.
        return -138;
      },
      // A weighted column — deliberate, unhurried, hard to topple. The calm
      // end of the register; a piece that looks like it is thinking.
      monolith(body, accents) {
        paint(body, litRect(-26, -104, 52, 78, 20), BODY_FILL);
        const base = new PIXI.Graphics();
        paint(base, litRect(-38, -30, 76, 30, 14), BODY_FILL);
        base.gestureMode = "shift";   // a weighted column doesn't wave, it leans
        base.restX = 0;
        accents.push(base);
        return -134;
      },
      // A person: torso, two legs, two arms. The one body here that is NOT a
      // market glyph, and that is the point — the trader is the human in the
      // room, so he doesn't get to be made of candles.
      figure(body, accents) {
        // The gap has to be wide enough to survive the stream: at 6 units the
        // two legs merged into one column and he read as a pedestal.
        paint(body, litRect(-19, -56, 13, 56, 6), BODY_FILL);
        paint(body, litRect(6, -56, 13, 56, 6), BODY_FILL);
        // Waist under a broader chest. The taper is what reads as a person —
        // one capsule reads as a pill — and the wider shoulders are what stop
        // the head (28px, shared with every other body) looking oversized.
        paint(body, litRect(-26, -86, 52, 40, 14), BODY_FILL);
        paint(body, litRect(-33, -128, 66, 54, 22), BODY_FILL);
        for (const side of [-1, 1]) {
          const arm = new PIXI.Graphics();
          paint(arm, litRect(-7, -5, 14, 66, 7), BODY_FILL);
          arm.x = side * 36; arm.y = -120;   // pivot at the shoulder
          // Not quite straight and not quite matching: dead-symmetrical arms
          // read as a mannequin, and the asymmetry costs two numbers.
          arm.restRotation = side < 0 ? -0.05 : 0.09;
          // v1's arms were the torso's exact colour, so a resting figure read
          // as a capsule and the arms only appeared mid-animation. A lighter
          // shade separates them from both the body and the dark room.
          arm.shadeFactor = 1.35;
          accents.push(arm);
        }
        // The head overlaps the torso rather than resting on it: a hairline gap
        // at this size reads as a floating head, not as a neck.
        return -152;
      },
      // The original: face on a single disc, no body. Kept as the baseline the
      // others are judged against.
      orb(body) {
        paint(body, litCircle(0, -60, 46), BODY_FILL);
        return -66;
      },
    };

    // The MODEL's head, built where node can run it (increment 13): a
    // style-keyed registry, the shape of `BODIES`, so the one piece of the
    // cast `character()` used to build inline can be graded. Only the MODEL
    // is registered; candle and monolith are gallery bodies and keep the
    // ball. Returns the crown — the highest unit it draws — because the mood
    // tag is placed from it.
    function boxHead(skull, beacon) {
      const { x, y, w, h, depth, radius } = MACHINE.head;
      const cut = 2;
      const seamed = { keepFill: true, matte: true };
      // The far faces first, as ONE plate offset by the depth; the front
      // covers all of it but the top and the near side.
      paint(skull, litRect(x - depth, y - depth, w, h, radius), BODY_FILL);
      paint(skull, litRect(x, y, w, h, radius), BODY_FILL);
      // Both plates are `BODY_FILL` and `paint` bands both toward the one
      // lamp, so without a cut the side comes out the value of the front and
      // the extrusion reads as a notch. The reference draws a dark gap here.
      paint(skull, litRect(x, y, cut, h, 1), MACHINE.seam, undefined, seamed);
      paint(skull, litRect(x, y, w, cut, 1), MACHINE.seam, undefined, seamed);
      // The antenna, on the top face's centre. The mast is a plate like any
      // other; the beacon is a lit fill on its own Graphics, because `repaint`
      // clears the skull on every mood change and replays only what `paint`
      // recorded.
      // The top face spans `x - depth .. x - depth + w`; its centre, less
      // half the mast.
      const mastX = x - depth + w / 2 - 2;
      paint(skull, litRect(mastX, y - depth - 12, 4, 12, 1), BODY_FILL);
      beacon.roundRect(snap(mastX) - 4, snap(y - depth - 20), 12, 8, 2).fill(0xd1d4dc);
      return y - depth - 20;
    }
    const MACHINE_HEADS = {
      bars: boxHead,
    };

    // THE TRADER IN PROFILE (increment 16). The chair faces up-left, away from
    // the camera, and for two increments that bought the back of a head: a
    // hair disc over a nape, which read as a ball on a collar. The user's call
    // was that he should be LOOKING AT THE CHARTS, which is a side view — so
    // the head turns out of the body's three-quarter-back into profile toward
    // the painted chart screens, and the body keeps the chair's measured yaw
    // (`seatedRig`'s bones, lap bracket and seat budget all hang off it).
    //
    // Authored facing +x and mirrored by `side`; every coordinate is a whole
    // CELL so the mirror lands on the grid `litRect` snaps to. Big masses go
    // through `paint` (hair, face); the small features are FLAT fills on their
    // own Graphics — a 4-unit nose through `paint` is three concentric bands,
    // the joint-cap "dark ring" a fourth time.
    // The seated trader's hand as a convex outline in its own frame (the
    // forearm's: +y runs heel to fingertip, x across the four fingers), 16
    // across by 20 along — `ARM.hand`'s numbers. Authored with the flare on
    // +x; `seatedRig` mirrors it to whichever side faces the floor. The heel
    // is 11, a little inside the sleeve's 12, so the wrist does not step out
    // into a box;
    // the outer fingers' outside corners round off over 5 units (15 → 20)
    // where a rect's r2 corner turned a mitten's; the heel's back corner is
    // rounded where it leaves the cuff. The tips stay flat across the three
    // separations, so each one still reaches the silhouette and opens the
    // fingers at their ends (`test_the_hand_carries_on_the_line_of_the_forearm`).
    // (One line, so the suite's `_js_const` can lift it.)
    const HAND_OUTLINE = [[0, 1], [2, 0], [11, 0], [14, 3], [16, 8], [16, 15], [15.4, 17.6], [14, 19.3], [12, 20], [4, 20], [2, 19.3], [0.6, 17.6], [0, 15]];

    // How far down (+y) the outline reaches at x: the lowest crossing of the
    // vertical line through x. -Infinity where x misses the outline.
    function outlineDepthAt(pts, x) {
      let depth = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
        if (x < Math.min(ax, bx) || x > Math.max(ax, bx)) continue;
        const y = ax === bx ? Math.max(ay, by) : ay + (by - ay) * (x - ax) / (bx - ax);
        depth = Math.max(depth, y);
      }
      return depth;
    }

    const PROFILE_HEAD = {
      // The cranium: hair, back of the head and the crown. Painted first.
      skull: [-4, -8, 18],
      // Skin under the back of the skull: the jaw's back and the nape. Hair
      // hanging to the jaw behind a profile reads as a BEARD, so the hair
      // stops at the ear and this is what shows below it. Painted OVER the
      // skull, from the ear's bottom down: laid under it, the skull's lower
      // arc still hung a tuft of hair below the ear (the user's catch), and
      // no circle ends on a straight line. Square-cornered: its back-top
      // corner sits right under the ear's back edge, and any rounding there
      // lets a speck of the skull through. `test_no_hair_shows_below_the_ear`.
      nape: [-8, 8, 16, 12, 0],
      // The face, as one CONVEX outline (increment 18): forehead rounding
      // into the brow, a straight front for the nose and lips to sit on, a
      // chin, a jaw angle, and the back edge running up the cheek to the
      // temple on a DIAGONAL. That diagonal is the haircut: the old face was
      // a rect whose back edge stopped 8 units short of the ear, so a column
      // of hair ran from the fringe to the jaw in front of it — "too much
      // hair on the left of the ear" (the user's catch). Now the cheek is
      // skin all the way back to the ear's FRONT, and the hair keeps the
      // head above and behind the ear, where a tapered Ivy League cut leaves
      // it. (A first cut carried the cheek back UNDER the ear too; the head
      // read as a bald egg with a cap on, and the ear vanished into skin.)
      face: [[6, -21], [14, -21], [18, -17], [20, -10], [20, 10], [18, 16],
             [13, 20], [2, 20], [-3, 16], [-3, -6], [0, -13]],
      // The top: longer than the sides and swept up and back off the brow,
      // overlapping the face by 2 so no seam of skull shows between them.
      // Its underside is the HAIRLINE, and it sits at -19 where it used to
      // sit at -12 — the forehead the head did not have.
      fringe: [[-6, -20], [-2, -26], [6, -28], [14, -27], [19, -24],
               [20, -21], [15, -19], [4, -19]],
      // Flat features, [x, y, w, h] from the head's origin, facing +x. The
      // face is in thirds — hairline -19 to brow -7, brow to nose base 6,
      // nose base to chin 20 — `test_the_profile_face_is_in_thirds`.
      //
      // The nose is a small rounded wedge, [x, y] points: it used to start at
      // eye level and hang 14 units, a third of the head.
      nose: [[20, -2], [22, 1], [24, 4], [23, 5], [20, 6]],
      // The eye is a white with a pupil in it, and WHERE the pupil sits is
      // the other half of the look: the head nods only `GAZE_HEAD_SHARE` of
      // the way, and the pupil rides the front-upper corner for the rest.
      // Drawn as an ellipse inside this box.
      eye: [13, -4, 4, 4],
      // The shadow under it: wider than the eye and hanging 3 units below
      // it, since anything under 2 is lost to the keyline's 2px grid.
      eyeBag: [12, -1, 6, 4],
      // Inside the white's oval, so half a unit in from the box's corner:
      // the box corner is outside an ellipse, and a pupil there sits on skin.
      pupil: [14.5, -3.5, 2, 2],
      brow: [11, -7, 8, 2],
      // The ear, an ellipse in this box from brow to nose base, and its
      // bottom is where the nape starts. It sits ON the cheek now.
      ear: [-8, -6, 6, 14],
      // The short sideburn a taper leaves in front of the ear: from the
      // temple hair down to mid-ear, no further.
      sideburn: [-2, -12, 2, 8],
      mouth: [16, 11, 4, 2],
      // The joint the head nods about: the top of the neck, under the jaw.
      pivot: [4, 20],
    };

    // A rect mirrored about x = 0 when the head faces -x.
    function mirrorRect([x, y, w, h, ...rest], side) {
      return [side < 0 ? -(x + w) : x, y, w, h, ...rest];
    }

    function profileHead(skull, features, side) {
      const P = PROFILE_HEAD;
      const [cx, cy, r] = P.skull;
      const hair = { keepFill: true, noRim: true, matte: true };
      const skin = { keepFill: true, noRim: true };
      const mirror = (pts) => pts.map(([x, y]) => [side * x, y]);
      paint(skull, litCircle(side * cx, cy, r), HUMAN.hair, undefined, hair);
      paint(skull, litRect(...mirrorRect(P.nape, side)), HUMAN.skin, undefined, skin);
      paint(skull, litPath(mirror(P.face)), HUMAN.skin, undefined, skin);
      paint(skull, litPath(mirror(P.fringe)), HUMAN.hair, undefined, hair);
      // Not snapped: the pupil is half a CELL by design, and snapping its
      // mirrored x rounds it OUT of the eye on one side — which
      // `test_the_profile_is_one_head_mirrored` caught.
      const flat = (rect, colour) => {
        const [x, y, w, h] = mirrorRect(rect, side);
        features.rect(x, y, w, h).fill(colour);
      };
      // An ellipse inscribed in a feature box: an ear or an eye drawn as a
      // rect is a block, which is the whole of increment 18's brief.
      const oval = (rect, colour) => {
        const [x, y, w, h] = mirrorRect(rect, side);
        features.ellipse(x + w / 2, y + h / 2, w / 2, h / 2).fill(colour);
      };
      const skinBase = shade(HUMAN.skin, rampLevel("base"));
      const skinShade = shade(HUMAN.skin, rampLevel("shade"));
      flat(P.sideburn, HUMAN.hair);
      oval(P.ear, skinBase);
      // The ear's hollow: a shadowed oval set toward the FACE side, so the
      // rim of the ear reads as a C round it rather than as a flat disc.
      const [ex0, ey0, ew, eh] = P.ear;
      oval([ex0 + ew / 2, ey0 + eh / 4, ew / 3, eh / 2], skinShade);
      features.poly(mirror(P.nose).flat()).fill(skinBase);
      flat(P.brow, HUMAN.hair);
      // A tired shadow under the eye (increment 19): an oval the white laps
      // the top of, so what shows is a crescent below it. Halfway between the
      // skin's base and the mouth's shade — at the mouth's own value it reads
      // as a bruise. Tied to the eye box, never the pupil, which moves with
      // the gaze. `test_the_profile_eye_is_tired`.
      oval(P.eyeBag, mixHex(skinBase, skinShade, 0.5));
      oval(P.eye, 0xd8c6b0);
      flat(P.pupil, 0x1b1716);
      flat(P.mouth, skinShade);
      const eye = mirrorRect(P.eye, side);
      return {
        crown: Math.min(cy - r, ...P.fringe.map((p) => p[1])),
        chin: Math.max(...P.face.map((p) => p[1])),
        eye: [eye[0] + eye[2] / 2, eye[1] + eye[3] / 2],
        pivot: [side * P.pivot[0], P.pivot[1]],
      };
    }

    // Where the charts are: the centre of every painted screen whose role is
    // `chart`, averaged. Null with no plate — a head with nothing to look at
    // looks level.
    function chartTarget(screens) {
      const charts = (screens || []).filter((s) => s.role === "chart" && s.quad);
      if (!charts.length) return null;
      let x = 0, y = 0;
      for (const s of charts) {
        for (const [px, py] of s.quad) { x += px / s.quad.length; y += py / s.quad.length; }
      }
      return { x: x / charts.length, y: y / charts.length };
    }

    // Which way a profile faces: toward the charts, or with no charts to
    // look at, the way the chair points. Never 0 — a profile has a front.
    function gazeSide(target, x, facing) {
      if (target && target.x !== x) return Math.sign(target.x - x);
      return (facing && Math.sign(facing[0])) || -1;
    }

    // How far up a head facing `side` must tilt for its eye to point at
    // `target`, both in screen pixels. Level when there is no target or the
    // target is behind him; never past GAZE_MAX, a neck's comfortable range.
    const GAZE_MAX = 0.6;
    // How much of that the NECK does. People look up at a screen with the
    // eyes as much as with the head; a head nodding the whole 28 degrees to
    // the charts reads as a man studying the ceiling.
    const GAZE_HEAD_SHARE = 0.5;
    function gazePitch(eye, target, side) {
      if (!target) return 0;
      const ahead = side * (target.x - eye.x);
      if (ahead <= 0) return 0;
      return Math.max(0, Math.min(GAZE_MAX, Math.atan2(eye.y - target.y, ahead)));
    }

    // A machine and a person shouldn't wear the same face. The bodies built
    // out of market glyphs get a readout — visor, LED eyes, a stepped mouth,
    // and no brows, because a brow is a muscle. The figure keeps the human
    // one, and so does the orb, which is a face and nothing else.
    const FACE_KIND = {
      bars: "machine", candle: "machine", monolith: "machine",
      figure: "human", orb: "human",
    };

    // One inhabitant: a body whose colour is its mood, a face that reads at a
    // glance, and a label carrying the numbers.
    // How wide a body's contact patch is, per style — the same registry shape
    // as HEAD_TRAVEL, and checked against STYLES for the same reason: a new
    // body that silently inherits someone else's footprint reads as floating.
    //
    // `bars: 34` was tuned against the candle cluster's five splayed columns.
    // Increment 11 replaced those with two legs, and the stance was MEASURED
    // rather than left open: they plant x -24..24, i.e. 48 units apart,
    // against the figure's 38. The 34 was kept — a contact patch narrower
    // than the stance is what a shadow under two feet looks like — but it is
    // now a number with a measurement behind it rather than an inheritance.
    const SHADOW_WIDTH = { bars: 34, figure: 30, candle: 22, monolith: 26, orb: 20 };

    // How tall a contact patch is against its own width: a roughly circular
    // patch on the floor, seen from the room's viewpoint. So this number is
    // not just the ellipse's proportions — it IS this room's foreshortening,
    // the factor by which the floor squashes anything measured across it. The
    // shadow's height and the y half of its throw both read it, because they
    // are the same fact, and writing the throw's squash as its own literal is
    // how the two would silently drift apart.
    //
    // Taken against the patch's own 2:1 base, NOT against its drawn width:
    // `CONTACT.widthScale` widens the blob that is DRAWN — an art call about
    // how far a body's contact spills — while the floor's foreshortening is a
    // property of the room, unchanged by how wide the plate wants the smudge.
    const SHADOW_ASPECT = 0.46;

    // One soft blob, built once and shared. A hard ellipse reads as a sticker
    // and three stacked ellipses band visibly (the same thing that made the
    // first vignette look like a wireframe) — and `FillGradient` cannot do a
    // radial alpha ramp, which is exactly the limitation the wall port found.
    let shadowTexture = null;
    function softShadow() {
      if (!shadowTexture) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(0,0,0,0.85)");
        g.addColorStop(0.5, "rgba(0,0,0,0.42)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        shadowTexture = PIXI.Texture.from(canvas);
      }
      const sprite = new PIXI.Sprite(shadowTexture);
      sprite.anchor.set(0.5);
      return sprite;
    }

    // Light is overhead, so height off the floor spreads the shadow and
    // thins it. This is the whole grounding cue: without it a jump is a body
    // sliding up the screen, and with it the floor is somewhere real.
    // A shadow lives on its own layer, so hiding a character's container does
    // *not* hide it. The animation sheet caught two of them hanging in mid-air
    // where MODEL and TRADER had been. Visibility is a property of the
    // character; both eval surfaces go through here.
    function setCharacterVisible(char, visible) {
      char.container.visible = visible;
      if (char.shadow) char.shadow.visible = visible;
    }

    function shadowTick(char) {
      // First, always: `CONTACT` is a top-level read, so a character with no
      // shadow must leave before anything touches it.
      if (!char.shadow) return;
      const lift = Math.max(0, char.baseY - char.container.y);
      const spread = 1 + lift * 0.004;
      // Thrown AWAY from the key, which is `+KEY_AXIS`. `-KEY_AXIS` is where
      // the lamp is — it is the direction every lit band slides in
      // (`litCircle`'s `slide * -KEY_AXIS[i]` above) — so a shadow goes the
      // other way, and on this plate that is down and to the LEFT. Centred,
      // which is what this did until Sprint 16, a figure the room lights hard
      // from one side gets a puddle under its feet; a puddle is the loudest
      // "pasted on" cue in the before-frame, and the whole of KI-051's
      // complaint about the cast not belonging to its room.
      //
      // The y half is squashed by `SHADOW_ASPECT / 2` because the throw lies
      // ON the floor, and the floor is exactly that foreshortened — it is the
      // same fact that makes a round contact patch draw as a flat ellipse, so
      // it is read from the same constant rather than restated as a number of
      // its own. Unsquashed, the measured direction (steeply downward) walks
      // the shadow clear of the feet and the figure floats again, having
      // gained a direction and lost its floor.
      const throwX = KEY_AXIS[0] * CONTACT.throwScale * SHADOW_THROW;
      const throwY =
        KEY_AXIS[1] * CONTACT.throwScale * SHADOW_THROW * (SHADOW_ASPECT / 2);
      // The throw moves the patch AND grows it by the same amount, so the
      // half-extent gains exactly what the centre gave up: the lamp-side edge
      // stays where the foot is and only the far edge travels. Offsetting
      // alone is the trade this ticket would most easily make by accident —
      // a shadow that no longer touches the body it belongs to reads as a
      // second figure, which is a worse floating than the one being fixed.
      char.shadow.x = char.container.x + throwX;
      char.shadow.y = char.baseY + 3 + throwY;
      char.shadow.width =
        (char.shadowW * 2 * CONTACT.widthScale + 2 * Math.abs(throwX)) * spread;
      char.shadow.height =
        (char.shadowW * SHADOW_ASPECT + 2 * Math.abs(throwY)) * spread;
      char.shadow.alpha = CONTACT.opacity / (1 + lift * 0.014);
    }

    // Which side of the body an accent composites on. `near` means "on the
    // camera side" — a forearm that comes forward over the lap, not one
    // hanging behind a torso that is 48 units wide.
    //
    // KI-084: every accent used to go on before the body, and the seated
    // torso spans ±24, so the seated arms were invisible at rest from the day
    // the seated rig shipped. The fix is deliberately NOT a change to the
    // `accents` array — `restAccents`, `gesture()`, the seat-fit drivers and
    // `character()`'s own `accents[0]`/`accents[1]` arm aliases all index it,
    // and a partition applied in place would have moved all four of them.
    // Only the parenting changes; rotation still comes from `restRotation`
    // regardless of which side of `body` a Graphics is parented on.
    //
    // Untagged is FAR, which is the pre-KI-084 behaviour: every standing
    // `BODIES.*` style tags nothing, and a wick reading as emerging from the
    // candle depends on staying behind it.
    // Is this body turned far enough from the camera to have no face left?
    //
    // The facing is a screen vector measured off the painted furniture, and
    // its y component alone answers this: negative means the body points UP
    // the screen, which in this projection is away from the camera. The 2px
    // deadband is for a re-measured plate — a chair painted in dead profile
    // should not flip the head around on a pixel of dithering.
    function facesAway(facing) {
      return !!facing && facing.length === 2 && facing[1] < -2;
    }

    function depthOrder(accents, which) {
      return accents.filter((a) => (a.depth === "near") === (which === "near"));
    }

    // THE KEYLINE (increment 15): one dark contour round the whole person,
    // at the plate's own pixel pitch — the thing that makes every object in
    // this painted room read as pixel art, and the one thing the trader never
    // had. The reference trader carries it; the chair he sits in carries it.
    //
    // This is NOT the rim increment 8 took off the person, and the difference
    // is the whole design. That rim was a stroke PER VOLUME, so an arm came
    // out as two outlined sausages and a leg as three links of a chain. This
    // is drawn on the ALPHA of the assembled figure, after every limb has
    // composited, so it can only ever trace the silhouette: where two limbs
    // overlap there is no edge to find. `paint` still strokes no rim for a
    // `keepFill` volume, and `test_a_person_is_not_outlined` still holds.
    //
    // Two jobs in one pass, because they share the grid:
    //   * every pixel takes the colour of one texel inside its `block` cell,
    //     snapped in GLOBAL coordinates — so breathing and gestures move the
    //     figure across a fixed grid instead of dragging the grid with it,
    //     which would shimmer. The texture's global origin is
    //     `uOutputFrame.xy + uGlobalFrame.xy`: in Pixi 8.19 `uGlobalFrame.xy`
    //     is the PARENT filter's offset (0 here) and `uOutputFrame.xy` is
    //     this filter's bounds. Using `uGlobalFrame` alone anchored the grid
    //     to the figure's bounds, and a 10-frame capture measured the cell
    //     phase flipping on x and y as he breathed;
    //   * alpha is hard (the room has no soft edges), and an empty cell with
    //     a filled neighbour becomes the keyline.
    //
    // `color` is sampled, not picked: the most common near-black on the
    // chair's own contours in the plate is (20, 24, 36). `block` is the
    // plate's keyline width in frame pixels.
    const KEYLINE = { color: 0x121622, block: 2 };

    const KEYLINE_FRAGMENT = `in vec2 vTextureCoord;
out vec4 finalColor;
uniform sampler2D uTexture;
uniform highp vec4 uInputSize;
uniform highp vec4 uInputClamp;
uniform highp vec4 uOutputFrame;
uniform highp vec4 uGlobalFrame;
uniform vec3 uKeyline;
uniform float uBlock;

highp vec2 origin() { return uOutputFrame.xy + uGlobalFrame.xy; }

vec4 cell(highp vec2 g) {
  highp vec2 c = floor(g / uBlock) * uBlock + floor(uBlock * 0.5) + 0.5;
  highp vec2 uv = clamp((c - origin()) * uInputSize.zw, uInputClamp.xy, uInputClamp.zw);
  return texture(uTexture, uv);
}

void main() {
  highp vec2 g = vTextureCoord * uInputSize.xy + origin();
  vec4 s = cell(g);
  if (s.a >= 0.5) { finalColor = vec4(s.rgb / s.a, 1.0); return; }
  float n = max(max(cell(g + vec2(uBlock, 0.0)).a, cell(g - vec2(uBlock, 0.0)).a),
                max(cell(g + vec2(0.0, uBlock)).a, cell(g - vec2(0.0, uBlock)).a));
  finalColor = n >= 0.5 ? vec4(uKeyline, 1.0) : vec4(0.0);
}
`;

    // Built once and PROVEN once, then shared. A filter is the one thing on
    // this page that can fail after it has been attached: a shader that does
    // not compile is not an exception at construction, it is a program that
    // draws nothing at the first frame — the blank-figure failure (KI-050's
    // class) that no node test can see. So before any figure wears it, the
    // filter draws a known square off-screen and the pixels are read back:
    // it must leave the square's colour inside and put the keyline outside.
    // Anything else — no WebGL, a throw, a wrong pixel — and every figure
    // draws exactly as it did before this existed. The outcome is recorded
    // on `window.__keyline` so a frame can be asked which one it got.
    let keylineCache;
    function keylineFilter() {
      if (keylineCache !== undefined) return keylineCache;
      keylineCache = null;
      try {
        if (!app || !app.renderer || app.renderer.type !== PIXI.RendererType.WEBGL) {
          window.__keyline = "off: not webgl";
          return null;
        }
        const k = KEYLINE.color;
        const filter = new PIXI.Filter({
          glProgram: PIXI.GlProgram.from({
            vertex: PIXI.defaultFilterVert, fragment: KEYLINE_FRAGMENT, name: "keyline",
          }),
          resources: {
            keylineUniforms: {
              uKeyline: { value: new Float32Array([((k >> 16) & 255) / 255, ((k >> 8) & 255) / 255, (k & 255) / 255]), type: "vec3<f32>" },
              uBlock: { value: KEYLINE.block, type: "f32" },
            },
          },
          padding: KEYLINE.block * 2,
          resolution: 1,
          antialias: "off",
        });
        if (!keylineProves(filter)) {
          window.__keyline = "off: probe failed";
          return null;
        }
        window.__keyline = "on";
        keylineCache = filter;
      } catch (err) {
        window.__keyline = "off: " + (err && err.message);
      }
      return keylineCache;
    }

    // The off-screen proof: a 12x12 white square at (11, 11) in a 32x32
    // target: an ODD origin, so the filter's own bounds start off the global
    // grid. A grid anchored to the screen puts pixels 10 and 11 in one cell,
    // so column/row 10 must come out white and 9 must be the keyline; a grid
    // anchored to the bounds (the shimmer bug) paints 10 as the keyline.
    function keylineProves(filter) {
      const probe = new PIXI.Container();
      const inner = new PIXI.Container();
      const square = new PIXI.Graphics().rect(11, 11, 12, 12).fill(0xffffff);
      inner.addChild(square);
      inner.filters = [filter];
      probe.addChild(inner);
      const target = PIXI.RenderTexture.create({ width: 32, height: 32, resolution: 1 });
      try {
        app.renderer.render({ container: probe, target, clear: true });
        const { pixels, width } = app.renderer.extract.pixels(target);
        const at = (x, y) => Array.from(pixels.slice((y * width + x) * 4, (y * width + x) * 4 + 4));
        const k = KEYLINE.color;
        const near = (a, b) => Math.abs(a - b) <= 8;
        const white = ([r, g, b, a]) => a > 200 && r > 200 && g > 200 && b > 200;
        const keyed = ([r, g, b, a]) => a > 200
          && near(r, (k >> 16) & 255) && near(g, (k >> 8) & 255) && near(b, k & 255);
        return white(at(16, 16)) && white(at(10, 16)) && white(at(16, 10))
          && keyed(at(9, 16)) && keyed(at(16, 9));
      } finally {
        inner.filters = null;
        probe.destroy({ children: true });
        target.destroy(true);
      }
    }

    function character(name, style) {
      style = BODIES[style] ? style : styleFor(name);
      const container = new PIXI.Container();
      container.y = app.screen.height * GROUND;
      // C2: which anchor this name paints against decides the rig. Only the
      // trader is ever seated — the plate's `pose` is the one thing that says
      // so, not a second decision made here. Every other `name` this function
      // is ever called with (moods and styles, from the gallery/sheet eval
      // surfaces) misses PLATE.cast entirely and gets "standing" back.
      const anchor = anchorFor(name.toLowerCase());
      container.pose = anchor.pose;
      // How big this figure is drawn against the furniture it uses, and which
      // way that furniture points. Both are measurements off the plate
      // (`scripts/measure_chair.py`), so both arrive as manifest data rather
      // than as page constants — the same rule the seat rect and the tube
      // bores already follow. A body with no painted furniture keeps 1 and a
      // camera-facing pose, which is every standing style.
      const figureScale = anchor.figureScale || 1;

      const body = new PIXI.Graphics();
      const head = new PIXI.Container();
      // The head's resting nod, on its own node: `head.rotation` belongs to
      // the animations (`setGaze`, `restSeatedCharacter` zero it every tick),
      // so a gaze parked there would render one frame and snap level.
      const aim = new PIXI.Container();
      const skull = new PIXI.Graphics();
      // A profile's small features: flat fills `repaint` never touches.
      const features = new PIXI.Graphics();
      let profile = null;
      const eyeL = new PIXI.Graphics();
      const eyeR = new PIXI.Graphics();
      const mouth = new PIXI.Graphics();
      const browL = new PIXI.Graphics();
      const browR = new PIXI.Graphics();
      const visor = new PIXI.Graphics();
      const beacon = new PIXI.Graphics();
      const accents = [];

      const headY = container.pose === "seated"
        ? seatedRig(body, accents, anchor.facing)
        : BODIES[style](body, accents);
      // The orb *is* the face; every other body carries a head above it.
      // Not one of BODIES.*: the orb IS its own face and skips a head
      // entirely, but every other style's head is built here rather than in
      // its body method. Shaded the same way as the rest of the cast — the
      // head is the single largest surface carrying mood (`FACE`/`setExpression`
      // paint eyes, brows and mouth onto it), and a flat head on an otherwise
      // lit body is the one inconsistency a gallery grid would show first.
      // The orb IS its own face and takes no head at all. Everything else gets
      // one here — but a machine's head and a person's are no longer the same
      // circle in two colours. `FACE_KIND` already decides which FACE the style
      // wears (`machineFace` vs `humanFace`); the head under that face now
      // follows the same decision instead of being uniform beneath it, which is
      // what made the trader read as a bauble with features painted on.
      //
      // The human head is two authored volumes, not one: hair sitting high and
      // a slightly smaller face dropped below it, so the crown reads as hair
      // rather than as a hairline drawn on a ball. Both `keepFill`, so the mood
      // reaches them as a rim and leaves skin looking like skin. The face
      // circle is r24 at y+2 — every feature `humanEyes`/`humanFace` draws
      // (eyes at y-4 ±10, brows above them, mouth at y+12) stays well inside
      // it, and they are separate Graphics added after the skull, so the hair
      // can never cover them.
      // The crown every head but the box keeps: the ball's r28.
      let crown = -28;
      if (style === "orb") {
        // no head
      } else if (MACHINE_HEADS[style]) {
        crown = MACHINE_HEADS[style](skull, beacon);
      } else if (FACE_KIND[style] === "human") {
        // r22/r19, not the machine's r28. The first frame of the redesign had
        // a head 56 units across on a torso 48 across — a head wider than the
        // shoulders under it, which is the single loudest "this is not a
        // person" cue a figure can have, and one no test was ever going to
        // report. The machine keeps r28: a blocky chassis carries a big head,
        // and `SHADOW_WIDTH`/`HEAD_TRAVEL` are tuned to it.
        //
        // Turned away from the camera, the same two circles go on in the
        // opposite order: hair OVER skin is the back of a head, and hair under
        // skin is a face. It is two lines rather than a second head because
        // that is genuinely all the difference there is at this size — and the
        // features below are hidden for the same reason, not tuned. (The user
        // asked for the turn knowing the face goes with it: "I do not care
        // about his mimics and that face is not visible".)
        const away = facesAway(anchor.facing);
        if (away) {
          // Turned from the camera, the head turns to the CHARTS instead of
          // showing its back (increment 16, `profileHead`). The side is the
          // one the charts are on; with no plate, the chair's own.
          const side = gazeSide(chartTarget(PLATE && PLATE.screens), anchor.x, anchor.facing);
          profile = profileHead(skull, features, side);
          profile.side = side;
          crown = profile.crown;
          for (const part of [eyeL, eyeR, mouth, browL, browR]) part.visible = false;
        } else {
          // Facing the camera: hair behind, face in front. Hair is matte
          // (increment 15) — a lamp band on a dark disc reads as a bald spot.
          paint(skull, litCircle(0, -4, 22), HUMAN.hair, undefined,
                { keepFill: true, noRim: false, matte: true });
          paint(skull, litCircle(0, 2, 19), HUMAN.skin, undefined,
                { keepFill: true, noRim: true, matte: false });
        }
      } else {
        paint(skull, litCircle(0, 0, 28), BODY_FILL);
      }
      head.y = headY;
      aim.addChild(skull, features, beacon, visor, browL, browR, eyeL, eyeR, mouth);
      if (profile) {
        // Nod about the top of the neck, so the chin stays on it.
        aim.pivot.set(...profile.pivot);
        aim.position.set(...profile.pivot);
      }
      head.addChild(aim);

      const nameTag = label(name, -40, 22, 18);
      const stat = label("", -80, 46, 14, NEUTRAL);
      // The mood tag rides above the head, so it has to follow the SCALED
      // head: `headY` is in rig units and the rig is drawn `figureScale`
      // bigger than them.
      // Lifted by however far a head stands above the ball's crown, so the
      // box head's antenna does not run through its own tag.
      const moodTag = label("", -40, (headY + crown + 28) * figureScale - 56, 16, NEUTRAL);
      // Accents go behind the mass, so a wick reads as emerging from it —
      // all but the ones tagged `near`, which are on the camera side and
      // composite in front of it (KI-084, see `depthOrder`). Labels stay
      // last: a name tag a forearm can cover is the same defect as an arm
      // the torso covers.
      //
      // The body is scaled as ONE node, with the labels deliberately outside
      // it — type at 1.7x is a separate decision from a figure at 1.7x. It
      // cannot be `container.scale`: `playAnimation`'s pulse/cheer/flicker and
      // `resetIdle` write that every tick, so a per-figure scale parked there
      // would render for one frame and then be overwritten — the same failure
      // `bone()`'s `restRotation` comment describes. One container in between
      // survives both, and every animation below keeps writing rig-local units
      // to `body`/`head`/the accents exactly as it did.
      const rig = new PIXI.Container();
      rig.scale.set(figureScale);
      rig.addChild(...depthOrder(accents, "far"), body, head, ...depthOrder(accents, "near"));
      // The person wears the keyline; the labels beside him do not, and
      // neither does his shadow (it lives on `layers.shadows`). Only the
      // seated figure: the machine keeps its rim, a glyph's own edge.
      const keyline = container.pose === "seated" ? keylineFilter() : null;
      if (keyline) rig.filters = [keyline];
      container.addChild(rig, nameTag, stat, moodTag);
      layers.chars.addChild(container);

      // Seeded off the name, so MODEL and TRADER don't blink in unison — two
      // characters sharing a timer read as one animation on two puppets.
      let seed = 0;
      for (const ch of name) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;

      const shadow = softShadow();
      layers.shadows.addChild(shadow);

      const char = {
        container, body, head, skull, eyeL, eyeR, mouth, browL, browR, visor,
        accents, style, stat, moodTag, nameTag, faceKind: FACE_KIND[style],
        aim, profile, figureScale,
        baseY: container.y, mood: "neutral", anim: null, phase: 0,
        rand: rng32(seed || 1),
        // The shadow is cast by the figure, so it grows with it — a 1.7x body
        // over a 1x smudge is a figure standing on someone else's shadow.
        shadow, shadowW: SHADOW_WIDTH[style] * figureScale,
      };
      // The two arms `seatedRig` pushed onto `accents` are real Graphics,
      // already children of `container` — aliased under their own names so
      // the seated animations below have one to reach for by name instead of
      // indexing into the array.
      if (container.pose === "seated") {
        char.armNear = accents[0];
        char.armFar = accents[1];
      }
      // Two characters breathing on one clock read as one animation played on
      // two puppets — the exact thing the blink seed already avoids. Offset
      // the phase *and* vary the period, so they never drift into step either.
      char.phaseOffset = char.rand();
      char.breath = 3.2 * (0.85 + char.rand() * 0.3);
      setExpression(char, "neutral");
      restAccents(char);   // arms hang from their resting angle, not from zero
      return char;
    }

    // Limb-less bodies still need a gesture — but not the same one. Rotating a
    // bar about its own base swings it like a felled tree, and at tier-3
    // amplitude the cluster came apart on cheer/wave/shrug; the candle's wicks
    // were worse, pivoting about the character's *feet*. Only what hangs from
    // a joint swings. Everything else pumps or shifts its weight.
    const GESTURE = {
      swing: (a, amt) => { a.rotation = (a.restRotation ?? 0) + amt * 0.35; },
      pump: (a, amt) => { a.scale.y = 1 + Math.abs(amt) * 0.55; },
      shift: (a, amt) => { a.x = snap((a.restX ?? 0) + amt * 6); },
      // A seated figure gestures with its arms. The leg bones are accents too
      // — they have to be, since each carries its own rotation — but swinging
      // a thigh, a shin and a shoe independently about their own joints does
      // not animate a leg, it dismantles one. Opting out by name beats
      // special-casing `limb` here: `gesture()` already dispatches on
      // `gestureMode`, so this needs no new branch.
      still: () => {},
    };

    function gesture(char, amount, stagger) {
      char.accents.forEach((accent, i) => {
        const offset = stagger ? Math.sin(amount * Math.PI * 2 + i * 0.9) : 1;
        const amt = amount * (i % 2 ? 1 : -1) * (stagger ? offset : 1);
        (GESTURE[accent.gestureMode] ?? GESTURE.swing)(accent, amt);
      });
    }

    function restAccents(char) {
      for (const accent of char.accents) {
        // Rest is not necessarily zero: dead-straight symmetrical arms read as
        // a mannequin, so the figure's hang at a slight, uneven angle.
        accent.rotation = accent.restRotation ?? 0;
        accent.x = snap(accent.restX ?? accent.x);
        accent.scale.set(1, 1);
      }
    }

    // Lighten or darken a mood colour without leaving its hue. Accents that
    // sit ON the body (arms) need to be a different value from it, or they
    // vanish into the mass at stream distance.
    //
    // Renamed from `shade` (KI-051): that name now belongs to the room-light
    // mix defined near `BODY_RIM` (`shade(baseHex, level)`, blends toward
    // `LIGHT.warmth`/`LIGHT.ambient`). This one is unrelated — a flat
    // channel-wise multiply against `factor` — and the two are NOT
    // interchangeable: `accent.shadeFactor` (`1.35`, a multiplier) fed to
    // the room-light `shade()` would clamp to a full-strength mix toward
    // `LIGHT.warmth` instead of a gentle lighten. Kept as its own function
    // under its own name rather than merged, so `applyMood`'s per-accent
    // lighten and `paint`'s per-band light direction stay two independent
    // knobs.
    //
    // It is now applied to a body's own FILL rather than to a tint (Task 8),
    // which is a rename of what it receives and not a change to what it does:
    // the arm is a lighter version of whatever colour the torso is painted,
    // and `paint()` lights both from the same lamp afterwards.
    function lightenTint(tint, factor) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v * factor)));
      return (clamp((tint >> 16) & 0xff) << 16)
           | (clamp((tint >> 8) & 0xff) << 8)
           | clamp(tint & 0xff);
    }

    // `liftDark` used to live here: a luminance floor applied to the TINT.
    // It was the right instinct aimed one step short of the pixel — the tint is
    // multiplied by the base fill before anyone sees it, so a tint comfortably
    // above the floor still rendered a body at 1.19:1. It also used the NTSC
    // luma weights on raw sRGB rather than WCAG relative luminance, so its
    // "floor" was not the quantity anyone measures. Both are now done in
    // world/visuals.py against the rendered colour, and the answer arrives
    // precomputed in BODY_TINT (KI-028).
    //
    // Task 8 finished the same thought one step further along: the rendered
    // colour is no longer something the GPU arrives at per pixel, it is what
    // `moodFill()` computes and `paint()` is handed. Nothing on this page
    // multiplies a mood over a drawn figure any more.

    // Faces are redrawn rather than tweened: a handful of primitives per mood
    // change is far cheaper than keeping a rig, and OBS renders in software.
    function setExpression(char, mood) {
      char.mood = mood;
      const { valence, arousal } = faceFor(mood);
      // Remembered so a blink can redraw the eyes alone and put them back
      // exactly as the mood had them.
      char.face = { valence, arousal };
      char.blinkClosed = false;
      const fill = moodFill(mood);
      char.visor.clear();
      if (char.faceKind === "machine") {
        machineFace(char, valence, arousal, fill);
      } else {
        humanFace(char, valence, arousal);
      }
      applyMood(char, mood);
    }

    // A readout, not an expression: the same two axes, computed. Arousal lights
    // more of the LED; valence steps the mouth. No brows — a brow is a muscle.
    function machineFace(char, valence, arousal, fill) {
      // 0.14, not 0.35: a dark inset of the head's own colour. The original
      // number was picked when the skull was a 0x545862 fill being *tinted*,
      // so it rendered at roughly a third of the mood colour and a 0.35 visor
      // came out the same value as the head — invisible on the real page.
      // KI-028 raised the base fill and this ticket replaced the tint with a
      // paint, so the head now renders at ~0.82 of the mood colour and 0.14
      // sits further below it than it ever did. Kept, deliberately: the visor
      // reads as a recess, and moving it is an art call with no frame behind it.
      char.visor.roundRect(snap(-21), snap(-16), 42, 23, 8).fill(lightenTint(fill, 0.14));
      machineEyes(char, arousal);
      char.browL.clear();
      char.browR.clear();
      const w = 10 + arousal * 3;
      const step = valence * 6;
      char.mouth.clear()
        .moveTo(snap(-w), snap(12)).lineTo(snap(-w / 3), snap(12 + step))
        .lineTo(snap(w / 3), snap(12 + step)).lineTo(snap(w), snap(12))
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    // Eyes are drawn on their own so a blink can close them without disturbing
    // the mood: `arousal` is passed in rather than read, and a blink passes 0.
    function machineEyes(char, arousal) {
      const lit = 2 + arousal * 5;
      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        eye.roundRect(snap(side * 10 - 6), snap(-5 - lit / 2), 12, lit, 1.5).fill(0xd1d4dc);
      }
    }

    function humanEyes(char, arousal) {
      const open = 2.2 + arousal * 4.2;            // eyelid opening
      const eyeY = -4;
      const dx = char.style === "orb" ? 15 : 10;
      for (const [eye, side] of [[char.eyeL, -1], [char.eyeR, 1]]) {
        eye.clear();
        if (arousal < 0.08) {
          // Nearly asleep: a closed lid line reads better than a tiny dot.
          eye.roundRect(snap(side * dx - 5), snap(eyeY), 10, 2, 1).fill(0xd1d4dc);
        } else {
          eye.ellipse(snap(side * dx), snap(eyeY), 3.4, open / 2).fill(0xd1d4dc);
        }
      }
    }

    function drawEyes(char, arousal) {
      if (char.faceKind === "machine") machineEyes(char, arousal);
      else humanEyes(char, arousal);
    }

    function humanFace(char, valence, arousal) {
      const eyeY = -4;
      const dx = char.style === "orb" ? 15 : 10;
      humanEyes(char, arousal);
      for (const [brow, side] of [[char.browL, -1], [char.browR, 1]]) {
        brow.clear();
        // Worry raises the INNER brow (y grows downward). Positive moods stay
        // level — angling them the other way reads as anger, which is how the
        // first pass made every happy face look stern.
        const worry = valence < 0 ? -valence : 0;
        const lift = arousal * 3;
        const inner = eyeY - 9 - lift - worry * 4;
        const outer = eyeY - 9 - lift + worry * 3;
        brow.moveTo(snap(side * (dx - 7)), snap(inner))
            .lineTo(snap(side * (dx + 7)), snap(outer))
            .stroke({ width: 2, color: 0x9aa4b2 });
      }
      char.mouth.clear();
      const curve = valence * 7;
      const width = 9 + arousal * 3;
      char.mouth
        .moveTo(snap(-width), snap(10))
        .quadraticCurveTo(snap(0), snap(10 + curve), snap(width), snap(10))
        .stroke({ width: 2.5, color: 0xd1d4dc });
    }

    // A mood, applied to every volume the figure is made of.
    //
    // This used to be three container-tint assignments — `char.body.tint =
    // tint` and friends. A container tint is a shader multiply over pixels
    // that have ALREADY been drawn, so once `paint()` started mixing the lit
    // band toward `LIGHT.warmth` and the shade band toward `LIGHT.ambient`,
    // the tint multiplied the room's own lamp along with the body. Every mood
    // came out as the same figure under a differently coloured light, which is
    // precisely why the gallery read as "the same figure, but red".
    //
    // Now the mood goes in as `paint()`'s own colour argument — the seam Task 6
    // built and, until this ticket, only ever handed `BODY_FILL`. The lamp stays
    // amber and the room stays cold in every mood; what changes is the colour
    // they fall on. Nothing here writes `.tint` any more, on purpose.
    // Takes the MOOD, not two colours. Both surfaces are derived here, in one
    // place, because a call site that can pass a fill and forget a rim is a
