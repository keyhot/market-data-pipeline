name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: market_data
          POSTGRES_USER: market_data
          POSTGRES_PASSWORD: market_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_data"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Apply database schema
        run: psql -f db/init.sql "postgresql://market_data:market_data@localhost:5432/market_data"

      - name: Run tests
        run: poetry run pytest -q
