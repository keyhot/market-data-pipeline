<!doctype html>
<meta charset="utf-8">
<title>Trader model sheet — proportions</title>
<style>
  html, body { margin: 0; background: #131722; }
  canvas { display: block; }
</style>
<!-- An explicit <body> before the scripts, not decoration: with only <style>
     and <script> above them the parser has not opened one yet, so
     `document.body` is null and BOTH the canvas append and the error handler
     that should have reported it fail. The page then looks like a silent
     nothing — the failure shape this whole harness exists to make impossible. -->
<body>
<script src="/api/static/pixi-8.19.0.min.js"></script>
<!-- GENERATED by scripts/sheet_build.py: the room's own shading, light,
     palette, head and measured chair, sliced out of api/templates/world.html
     and api/static/world-plate-btc-eth.png. Never hand-edited. -->
<script src="prelude.js"></script>
<script>
// The model sheet. Increment 2: three columns, and no `k`.
//
// The sheet exists because no assertion grades a look, and because every round
// of this redesign has been decided by a picture placed beside another picture.
// So the subject is never shown alone:
//
//   SHIPPED   `seatedRig` exactly as it goes out today — imported, not retyped.
//   TRACED    the reference slump, the provenance of every bone length here.
//   RE-POSED  those same bones at the angle the PAINTED CHAIR actually holds.
//
// Increment 1 asked "are these the right proportions?" and shipped a frame
// whose two columns differed in size by an amount its own comment admitted was
// arbitrary. That is fixed here, structurally rather than by picking a better
// number — see THE UNIT below.
//
// Nothing here is placed in the room. There is deliberately no chair drawn and
// no plate coordinate used for position; the chair enters only as the one
// number that was measured off it, its rake.

const W = SHEET_W, H = SHEET_H;
const ZOOM = 2.5;                 // exactly 2x ship (CAST_SCALE 1.25), so the
                                  // 4-unit CELL lands on 10 crisp screen px.
const INK = 0xd7dce5, DIM = 0x5b6577, WARN = 0xf0a848;

// ---------------------------------------------------------------------------
// THE UNIT: one head.
//
// Increment 1 drew at `k = 2/3` rig-units per reference pixel and said in its
// own comment that the number was a convention with a circular argument behind
// it. Two later attempts to measure it honestly both failed, and the failures
// are worth more than the number would have been:
//
//   - anthropometry (call the seat 45cm) needs a floor line, and the floor
//     under this chair is painted in shadow; estimates ranged 2.7-4.4 px/cm
//     and the answer tracked the guess.
//   - chair-to-chair scaling gave 0.64 against the head's 0.74, and that is
//     not a noisy measurement of one thing — it measures the WRONG thing.
//     `Docs/character-redesign.md` had already found out why: the reference
//     chair is high-backed WITH A HEADREST and the plate's is a mid-back
//     without one, so their spans are not the same anatomical distance.
//
// So there is no `k` on this sheet. The figure is authored in HEAD DIAMETERS.
// `scripts/sheet_build.py` extracts `HEAD_RADIUS` from the same two lines of
// `character()` that draw the head, so the unit is literally the head the user
// has already graded and approved — the one number here that cannot be wrong
// without being visibly wrong.
//
// Everything else is a RATIO measured off the trace. `U()` is the only place
// reference pixels are ever converted, and it converts through the head.
const J = SKELETON.joints;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const HEAD_D = HEAD_RADIUS * 2;
const REF_HEAD_D = dist(J.head, J.crown) * 2;   // `head`->`crown` is the skull radius
const U = (refPx) => (refPx / REF_HEAD_D) * HEAD_D;

// Bone lengths and widths, both straight off the trace. The 4th element of
// each `bones` entry is the limb's measured width, which until now no code
// read — the sheet authored widths by eye instead. The `spine` pair is the
// exception and is NOT used: 34/28 ref px is the spinal column, not the
// silhouette of a torso, and a 25-unit-wide torso is a broom handle.
const BONE = {}, WIDTH = {};
for (const [a, b, , w] of SKELETON.bones) {
  BONE[a + ">" + b] = U(dist(J[a], J[b]));
  WIDTH[a + ">" + b] = U(w);
}
// Authored, because the trace does not record it: the torso tapers 46 -> 38.
// One capsule hip-to-neck read as a slab (48 wide over a 62-unit run is nearly
// square and stops being a body); the taper is what puts shoulders on it.
// Extents still answer to the shipped +/-24 that the two seat-fit tests
// measure — the trace settles the POSE here, not the breadth.
const TORSO_LOWER_W = 46, TORSO_UPPER_W = 38;

// The figure's length, in heads, along the body — so it is a property of the
// BONES and not of the pose, and TRACED and RE-POSED necessarily report the
// same number. Crown to ankle: the trace's `ankle`->`toe` runs mostly sideways
// and would add length the figure does not have vertically.
const CHAIN = ["pelvis>chest", "chest>neck", "neck>head", "head>crown",
               "hip_near>knee_near", "knee_near>ankle_near"];
const HEADS_TRACED = CHAIN.reduce((s, k) => s + BONE[k], 0) / HEAD_D;
// The shipped figure, from the literals in `seatedRig` + `character()`:
// crown = headY(-108) - 4 - 22 = -134; ankle = where the shin rect
// `litRect(-20, 6, 15, 20, 5)` meets the shoe `litRect(-23, 24, 18, 8, 3)`.
const HEADS_SHIPPED = (24 - -134) / HEAD_D;

// ---------------------------------------------------------------------------
// Rim the silhouette, not every volume. v1 of this redesign died of giving
// each new part its own cream keyline — the exact "die-cut sticker" read the
// work exists to remove — and at ~20 volumes it recurs instantly. A segment
// that runs BETWEEN two others of the same limb (a shin, a forearm) is an
// interior seam and opts out; the parts that make the outline keep their edge.
const EDGE  = { keepFill: true };
const INNER = { keepFill: true, noRim: true };

/** One bone as a lit capsule, laid along a->b.
 *
 * The rect is authored from its own corner (x=0, y=0) and centred with
 * `pivot`, never with a negative x: `litRect` snaps x to the 4-unit CELL, so
 * `litRect(-w/2, ...)` with an odd half-width silently lands off-centre and
 * the limb thickens on one side. `pivot` is a transform and is not snapped.
 */
function bone(parent, a, b, width, fill, opts) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const g = new PIXI.Graphics();
  // A true capsule: the rect runs half a width PAST the joint at each end and
  // is rounded to w/2, so consecutive bones interlock instead of meeting at a
  // corner. Butt-jointed rects leave a notch on the outside of every bend, and
  // a dozen notches is exactly the "chain of links" read the shipped rig's own
  // shins were made `noRim` to avoid.
  paint(g, litRect(0, 0, width, len + width, width / 2), fill, undefined, opts);
  g.pivot.x = width / 2;            // pivot, never a negative x: `litRect`
  g.pivot.y = width / 2;            // snaps x/y to CELL and would shift these
  g.x = a.x; g.y = a.y;
  g.rotation = Math.atan2(dy, dx) - Math.PI / 2;   // the rect runs +y
  parent.addChild(g);
  return g;
}

/** The same bone, pushed away from the camera.
 *
 * The joint table says which limbs are far; this is what says so on screen.
 * Mixing the fill toward the room's own ambient is the cheap, principled read
 * — the far side of a body catches less of the key light — and it uses
 * `LIGHT.ambient` from the manifest rather than a second darkness constant
 * invented for the sheet. Without it a correct depth ORDER still renders as a
 * flat person, which is the failure the trace's `depth` tags exist to prevent.
 */
function farBone(parent, a, b, width, fill, opts) {
  return bone(parent, a, b, width, mixHex(fill, LIGHT.ambient, 0.3), opts);
}

// ---------------------------------------------------------------------------
// ONE figure, drawn from a joint table. TRACED and RE-POSED call this with
// different tables and nothing else — which is what makes the pose the only
// variable between those two columns, in code and not just in a caption.
function figure(root, P) {
  const far  = new PIXI.Container();
  const body = new PIXI.Graphics();
  const near = new PIXI.Container();
  root.addChild(far, body, near);

  const seg = (parent, a, b, fill, opts, draw) =>
    draw(parent, P[a], P[b], WIDTH[a + ">" + b], fill, opts);

  // Far side first, behind everything.
  seg(far, "shoulder_far", "elbow_far", HUMAN.sweater, EDGE,  farBone);
  seg(far, "elbow_far",    "wrist_far", HUMAN.sweater, INNER, farBone);
  seg(far, "wrist_far",    "hand_far",  HUMAN.skin,    EDGE,  farBone);
  seg(far, "hip_far",      "knee_far",  HUMAN.jeans,   EDGE,  farBone);
  seg(far, "knee_far",     "ankle_far", HUMAN.jeans,   INNER, farBone);
  seg(far, "ankle_far",    "toe_far",   HUMAN.shoes,   EDGE,  farBone);

  // The torso follows the spine in TWO segments, pelvis->chest->neck.
  bone(body, P.pelvis, P.chest, TORSO_LOWER_W, HUMAN.sweater, EDGE);
  bone(body, P.chest,  P.neck,  TORSO_UPPER_W, HUMAN.sweater, INNER);
  // The neck. Without it the skull hangs clear of the collar with background
  // showing through — the figure reads as decapitated, which is what the first
  // frame of increment 1 showed.
  seg(body, "neck", "head", HUMAN.skin, INNER, bone);

  // Near side in front. This is also the principled form of the KI-084 fix:
  // the near arm clears the silhouette because it is NEARER, not because its
  // x was nudged outward until it showed.
  seg(near, "hip_near",      "knee_near",  HUMAN.jeans,   EDGE,  bone);
  seg(near, "knee_near",     "ankle_near", HUMAN.jeans,   INNER, bone);
  seg(near, "ankle_near",    "toe_near",   HUMAN.shoes,   EDGE,  bone);
  seg(near, "shoulder_near", "elbow_near", HUMAN.sweater, EDGE,  bone);
  seg(near, "elbow_near",    "wrist_near", HUMAN.sweater, INNER, bone);
  // The hand is the wrist->hand BONE, not a circle parked at the hand joint:
  // drawing only its far endpoint left a skin dot hanging clear of the sleeve,
  // which reads as a dropped prop rather than a hand.
  seg(near, "wrist_near",    "hand_near",  HUMAN.skin,    EDGE,  bone);

  const skull = new PIXI.Graphics();
  humanSkull(skull);              // extracted from character(), never retyped
  skull.x = P.head.x; skull.y = P.head.y;
  root.addChild(skull);
}

/** The traced pose: the reference's own joints, converted through the head. */
function tracedJoints() {
  const P = {}, o = J.pelvis;
  for (const name of Object.keys(J)) {
    P[name] = { x: U(J[name].x - o.x), y: U(J[name].y - o.y) };
  }
  return P;
}

// ---------------------------------------------------------------------------
// THE RE-POSED FIGURE.
//
// Same bones, new angles. Angles are degrees in screen space: 0 is +x (right),
// +90 is +y (down), so straight up is -90.
//
// Which way is "back"? On this plate the backrest is to the RIGHT of the seat
// and the desk is to the LEFT, so leaning back is leaning +x and a head
// dropping forward tips -x. The reference figure has the same handedness —
// head up-right, legs down-left — because it is the same room and the same
// camera. That much of the reference transfers; the ANGLE does not.
const SEATED = {
  // The lean is the chair's, measured off the painted art by
  // `scripts/measure_chair.py` and carried in through the prelude. The
  // reference leans ~50 degrees because it is resting on a headrest; this
  // chair has none, and a figure at 50 degrees in it reads as reclining in
  // mid-air — which is exactly what increment 1's frame showed.
  spineLower: -90 + CHAIR.rake_deg + 6,   // lumbar slid forward: a slump
  spineUpper: -90 + CHAIR.rake_deg - 3,   // upper back rounds back toward upright
  headAxis:   -90 - 14,                   // chin down, toward the desk
  thigh_near: 150, thigh_far: 159,        // forward-left, the far leg further out
  shin_near:   98, shin_far:   90,        // very nearly straight down
  foot_near:  166, foot_far:  174,        // splayed, so the two feet do not
                                          // stack into one shapeless wedge
  upper_near: 100, upper_far: 105,        // upper arms hang, tipped forward:
                                          // the figure faces LEFT, so an arm
                                          // at 78 deg hangs behind its own back
  // Forearms fall toward the lap and the armrest, not straight out. Held level
  // they read as reaching for something that is not there — the arms of a
  // sleepwalker — and this figure is slumped, which is an arm that has given
  // up rather than an arm at work.
  fore_near:  158, fore_far:  155,
};

// Where the shoulders and the hips sit across the body: the traced offsets,
// carried over UNROTATED.
//
// That looks like laziness and is the opposite. Reclining is a rotation about
// the body's own lateral axis — the left-right line through the hips — so that
// axis is precisely the thing a recline does NOT move. Shoulder-to-neck and
// hip-to-pelvis are dominantly along it, and the camera has not moved either,
// so their screen offsets survive the change of pose unchanged.
//
// Two wrong versions came first and both are worth naming, because both
// produced a figure whose arms grew out of the air behind its own back:
//
//   1. rotating the offsets rigidly with the spine, through the 40 degrees
//      between the traced slump and this pose. That over-rotates: it turns the
//      depth component too, and depth does not turn when the spine does.
//   2. treating the offsets as perpendicular-to-spine plus a measured skew.
//      Same error, expressed more elaborately — it still hangs the axis off
//      the spine, and a 40-degree straightening flipped the near shoulder from
//      below the neck to above it.
const CARRY = {};
for (const [joint, root] of [["shoulder_near", "neck"], ["shoulder_far", "neck"],
                             ["hip_near", "pelvis"], ["hip_far", "pelvis"]]) {
  CARRY[joint] = { root, x: U(J[joint].x - J[root].x), y: U(J[joint].y - J[root].y) };
}

function posedJoints(spec) {
  const rad = (d) => (d * Math.PI) / 180;
  const step = (from, deg, len) => ({
    x: from.x + Math.cos(rad(deg)) * len,
    y: from.y + Math.sin(rad(deg)) * len,
  });

  const P = { pelvis: { x: 0, y: 0 } };
  P.chest = step(P.pelvis, spec.spineLower, BONE["pelvis>chest"]);
  P.neck  = step(P.chest,  spec.spineUpper, BONE["chest>neck"]);
  P.head  = step(P.neck,   spec.headAxis,   BONE["neck>head"]);
  P.crown = step(P.head,   spec.headAxis,   BONE["head>crown"]);

  const carried = (joint) => {
    const c = CARRY[joint];
    return { x: P[c.root].x + c.x, y: P[c.root].y + c.y };
  };

  for (const s of ["near", "far"]) {
    P["hip_" + s]      = carried("hip_" + s);
    P["shoulder_" + s] = carried("shoulder_" + s);
    P["knee_" + s]  = step(P["hip_" + s],      spec["thigh_" + s], BONE[`hip_${s}>knee_${s}`]);
    P["ankle_" + s] = step(P["knee_" + s],     spec["shin_" + s],  BONE[`knee_${s}>ankle_${s}`]);
    P["toe_" + s]   = step(P["ankle_" + s],    spec["foot_" + s],  BONE[`ankle_${s}>toe_${s}`]);
    P["elbow_" + s] = step(P["shoulder_" + s], spec["upper_" + s], BONE[`shoulder_${s}>elbow_${s}`]);
    P["wrist_" + s] = step(P["elbow_" + s],    spec["fore_" + s],  BONE[`elbow_${s}>wrist_${s}`]);
    P["hand_" + s]  = step(P["wrist_" + s],    spec["fore_" + s],  BONE[`wrist_${s}>hand_${s}`]);
  }
  return P;
}

/** The trader as it ships today, drawn by the page's own `seatedRig`. */
function shippedRig(root) {
  const body = new PIXI.Graphics();
  const accents = [];
  const headY = seatedRig(body, accents);
  // `character()` adds the accents BEFORE the body, which is why these arms
  // are invisible on air (KI-084). The sheet reproduces that order rather than
  // quietly fixing it: a control column that flatters the current state is not
  // a control.
  root.addChild(...accents, body);
  const skull = new PIXI.Graphics();
  humanSkull(skull);
  skull.y = headY;
  root.addChild(skull);
}

// ---------------------------------------------------------------------------
function label(parent, text, x, y, size, color, anchor) {
  const t = new PIXI.Text({
    text,
    style: { fill: color ?? INK, fontFamily: "monospace", fontSize: size ?? 15 },
  });
  t.x = x; t.y = y;
  if (anchor) t.anchor.set(anchor, 0);
  parent.addChild(t);
  return t;
}

/** The ruler, in the MARGIN, ticked in HEADS.
 *
 * Reading coordinates off a grid drawn OVER pixel art put the face 30px from
 * where it actually was and cost a whole round, so ticks live beside the art
 * and never across it. They are ticked in heads rather than units because the
 * head is what the figure is authored in, and because "3.6 heads vs 5.5" is
 * the entire finding this frame is carrying.
 */
function ruler(stage, baselineY, top, bottom) {
  const g = new PIXI.Graphics();
  // Stepped in HEADS, not in units, and iterated over head counts rather than
  // over unit positions: the first version of this walked `u` from -160 in
  // steps of HEAD_D/2 and tested `u % HEAD_D`, which never once landed on a
  // whole head, so every tick drew minor and not a single label appeared. A
  // ruler with no numbers on it still looks like a ruler.
  for (let i = -4; i <= 3; i += 0.5) {
    const y = baselineY + i * HEAD_D * ZOOM;
    if (y < top || y > bottom) continue;
    const major = Number.isInteger(i);
    g.moveTo(34, y).lineTo(major ? 62 : 48, y)
     .stroke({ width: 1, color: major ? DIM : 0x394152, alpha: major ? 1 : 0.55 });
    if (major) label(stage, `${-i === 0 ? 0 : -i}h`, 66, y - 8, 11, DIM);
  }
  g.moveTo(34, top).lineTo(34, bottom).stroke({ width: 1, color: DIM });
  stage.addChild(g);
  label(stage, "heads above /", 34, bottom + 8, 11, DIM);
  label(stage, "below the hip", 34, bottom + 22, 11, DIM);
}

/** A width budget drawn as a bracket under a column — a number, not a chair. */
function bracket(stage, cx, y, units, text) {
  const half = (units * ZOOM) / 2;
  const g = new PIXI.Graphics();
  g.moveTo(cx - half, y).lineTo(cx - half, y + 8).lineTo(cx + half, y + 8)
   .lineTo(cx + half, y).stroke({ width: 1, color: DIM });
  stage.addChild(g);
  label(stage, text, cx, y + 12, 11, DIM, 0.5);
}

function column(app, cx, baselineY, title, note, heads, build) {
  const root = new PIXI.Container();
  root.x = cx; root.y = baselineY;
  root.scale.set(ZOOM);
  build(root);
  app.stage.addChild(root);
  label(app.stage, title, cx, 86, 16, INK, 0.5);
  label(app.stage, note, cx, 108, 12, DIM, 0.5);
  // Computed from the bones, never typed: TRACED and RE-POSED are the same
  // skeleton, so they MUST print the same number, and if they ever do not the
  // sheet is lying about what it is comparing.
  label(app.stage, `${heads.toFixed(2)} heads, crown to ankle`,
        cx, 126, 12, heads < 4.5 ? WARN : INK, 0.5);
}

async function boot() {
  const app = new PIXI.Application();
  await app.init({
    width: W, height: H,
    background: 0x131722,     // the room's own ground, not black: a sheet on
                              // black can fall under `frame_is_blank`'s mean
                              // floor and be refused for being correct.
    antialias: false,         // pixel art
  });
  document.body.appendChild(app.canvas);

  const baselineY = 500;      // the hip, for ALL THREE columns — a shared
                              // origin is what makes the silhouettes comparable.
                              // 500, not 470: the shipped figure's crown sits
                              // 3.05 heads above the hip and was landing in
                              // the column titles.

  label(app.stage, "TRADER — MODEL SHEET · increment 2, the pose", 34, 18, 18, INK);
  label(app.stage,
        `sheet 2.5x = exactly 2x ship (CAST_SCALE 1.25) · CELL 4u = 10px here, 5px on air`,
        34, 40, 12, DIM);
  label(app.stage,
        `1 head = ${HEAD_D}u, extracted from character()'s own litCircle — `
        + `there is no scale factor on this sheet`,
        34, 56, 12, DIM);

  ruler(app.stage, baselineY, 150, H - 190);

  column(app, 300, baselineY,
         "SHIPPED  ·  seatedRig()",
         "what goes out today — arms behind the torso (KI-084)",
         HEADS_SHIPPED,
         shippedRig);

  column(app, 720, baselineY,
         "TRACED  ·  reference slump",
         `the provenance of every bone — reclined ~50° on a headrest`,
         HEADS_TRACED,
         (root) => figure(root, tracedJoints()));

  column(app, 1250, baselineY,
         "RE-POSED  ·  the proposal",
         `same bones, leaning at the painted chair's measured ${CHAIR.rake_deg.toFixed(1)}°`,
         HEADS_TRACED,
         (root) => figure(root, posedJoints(SEATED)));

  // Torso-only, and labelled so. The painted seat caps what sits ON it; a
  // slumped person's legs necessarily leave the seat. The seat-fit invariant
  // is already down to be SPLIT at placement (torso/pelvis on the seat, limbs
  // free) rather than satisfied, so a bracket implying the whole pose must fit
  // inside it would invite the wrong comparison. Drawn under the two columns
  // that are in rig coordinates; the traced column is a reference, not a
  // candidate for the room.
  bracket(app.stage, 300, H - 150, 63.2, "seat 63.2u — torso only");
  bracket(app.stage, 1250, H - 150, 63.2, "seat 63.2u — torso only");

  label(app.stage,
        "No chair is drawn and no plate coordinate is used: nothing here is placed in the room.",
        34, H - 62, 12, DIM);
  label(app.stage,
        `The chair enters as ONE measured number — its ${CHAIR.rake_deg.toFixed(1)}° rake `
        + `(scripts/measure_chair.py, read off the painted art by pixel predicate).`,
        34, H - 46, 12, DIM);
  label(app.stage,
        "The head is already the right size. The torso is within 3%. The legs are 3.5x short — that is the defect.",
        34, H - 30, 12, WARN);

  // The readiness flag `scripts/shoot.py` polls. Set after a real render, not
  // on DOM-ready: the canvas-exists fallback reports ready before anything is
  // drawn, which is exactly the empty-frame failure CDP was adopted to end.
  app.render();
  window.__worldDrawn = true;
}

boot().catch((err) => {
  // A boot that throws must not leave a plausible empty canvas behind. Say so
  // on the page, loudly enough that `frame_is_blank` sees structure and a human
  // sees the reason.
  (document.body || document.documentElement).innerHTML =
    '<pre style="color:#ff6b6b;background:#131722;font:14px monospace;padding:24px">'
    + "model sheet failed to boot:\n\n" + (err && err.stack || err) + "</pre>";
});
</script>
