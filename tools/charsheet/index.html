<!doctype html>
<meta charset="utf-8">
<title>Trader model sheet — proportions</title>
<style>
  html, body { margin: 0; background: #131722; }
  canvas { display: block; }
</style>
<!-- An explicit <body> before the scripts, not decoration: with only <style>
     and <script> above them the parser has not opened one yet, so
     `document.body` is null and BOTH the canvas append and the error handler
     that should have reported it fail. The page then looks like a silent
     nothing — the failure shape this whole harness exists to make impossible. -->
<body>
<script src="/api/static/pixi-8.19.0.min.js"></script>
<!-- GENERATED by scripts/sheet_build.py: the room's own shading, light and
     palette, sliced out of api/templates/world.html. Never hand-edited. -->
<script src="prelude.js"></script>
<script>
// The model sheet. Increment 1: one figure, one pose, two columns.
//
// The sheet exists because no assertion grades a look, and because the last
// three rounds of this redesign were all decided by a picture placed beside
// another picture. So the subject is never shown alone: the LEFT column is the
// trader exactly as it ships today (`seatedRig`, imported, not retyped) and the
// RIGHT column is the traced reference pose. Same lighting, same palette, same
// grid, same zoom — the only difference is the proportions, which is the one
// question this increment asks.
//
// Nothing here is placed in the room. The chair in the reference is different
// furniture from the chair on the plate (high-backed with a headrest vs
// mid-back without), so there is deliberately no chair on this sheet and no
// mapping to plate coordinates. That mapping was tried once and stopped.

const W = 1280, H = 900;
const ZOOM = 2.5;                 // exactly 2x ship (CAST_SCALE 1.25), so the
                                  // 4-unit CELL lands on 10 crisp screen px.
const INK = 0xd7dce5, DIM = 0x5b6577, ACCENT = 0xf0a848;

// The reference frame is 1376x768 and the trace is in its pixel coordinates.
// k converts those to rig units, and it is NOT a taste decision:
//
//   crown y=398 -> toe_near y=668  =  270 reference px
//   270 * 2/3   =  180 units       =  PLATE.cast.rig_height, exactly
//
// Two quantities derived from different places agreeing to the unit is the
// same corroboration the bone-length symmetry check gave (both legs 78/84
// traced independently). The head corroborates a third time: the skull's
// traced radius is ~30px, and 30 * 2/3 = 20, within two units of the r22 the
// user graded and approved in v3.
const K = 2 / 3;

const J = SKELETON.joints;
const ORIGIN = J.pelvis;          // the rig's local origin is the hip, which is
                                  // where `seatedRig` puts y=0 too.
const at = (name) => ({
  x: (J[name].x - ORIGIN.x) * K,
  y: (J[name].y - ORIGIN.y) * K,
});

// Rim the silhouette, not every volume. v1 of this redesign died of giving
// each new part its own cream keyline — the exact "die-cut sticker" read the
// work exists to remove — and at ~20 volumes it recurs instantly. A segment
// that runs BETWEEN two others of the same limb (a shin, a forearm) is an
// interior seam and opts out; the parts that make the outline keep their edge.
const EDGE  = { keepFill: true };
const INNER = { keepFill: true, noRim: true };

/** One bone as a lit capsule, laid along a->b.
 *
 * The rect is authored from its own corner (x=0, y=0) and centred with
 * `pivot`, never with a negative x: `litRect` snaps x to the 4-unit CELL, so
 * `litRect(-w/2, ...)` with an odd half-width silently lands off-centre and
 * the limb thickens on one side. `pivot` is a transform and is not snapped.
 */
function bone(parent, a, b, width, fill, opts) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const g = new PIXI.Graphics();
  // A true capsule: the rect runs half a width PAST the joint at each end and
  // is rounded to w/2, so consecutive bones interlock instead of meeting at a
  // corner. Butt-jointed rects leave a notch on the outside of every bend, and
  // a dozen notches is exactly the "chain of links" read the shipped rig's own
  // shins were made `noRim` to avoid.
  paint(g, litRect(0, 0, width, len + width, width / 2), fill, undefined, opts);
  g.pivot.x = width / 2;            // pivot, never a negative x: `litRect`
  g.pivot.y = width / 2;            // snaps x/y to CELL and would shift these
  g.x = a.x; g.y = a.y;
  g.rotation = Math.atan2(dy, dx) - Math.PI / 2;   // the rect runs +y
  parent.addChild(g);
  return g;
}

/** The same bone, pushed away from the camera.
 *
 * The joint table says which limbs are far; this is what says so on screen.
 * Mixing the fill toward the room's own ambient is the cheap, principled read
 * — the far side of a body catches less of the key light — and it uses
 * `LIGHT.ambient` from the manifest rather than a second darkness constant
 * invented for the sheet. Without it a correct depth ORDER still renders as a
 * flat person, which is the failure the trace's `depth` tags exist to prevent.
 */
function farBone(parent, a, b, width, fill, opts) {
  return bone(parent, a, b, width, mixHex(fill, LIGHT.ambient, 0.3), opts);
}

/** The head, exactly as the page builds it for a `FACE_KIND` of "human".
 *  Copied in shape from `character()` (hair r22 at -4, skin r19 at +2) because
 *  that head is already graded and approved — the sheet is not re-asking it. */
function head(parent, x, y) {
  const g = new PIXI.Graphics();
  paint(g, litCircle(0, -4, 22), HUMAN.hair, undefined, EDGE);
  paint(g, litCircle(0,  2, 19), HUMAN.skin, undefined, INNER);
  g.x = x; g.y = y;
  parent.addChild(g);
  return g;
}

/** The traced reference pose, fleshed.
 *
 * Depth is read off the joint table, not guessed: every limb joint carries
 * `depth: near|far`, so the far arm and far leg go BEHIND the torso and the
 * near ones in FRONT. That is the principled form of the KI-084 fix — the near
 * arm clears the silhouette because it is nearer, not because its x was nudged
 * outward until it showed.
 */
function tracedRig(root) {
  const far  = new PIXI.Container();
  const body = new PIXI.Graphics();
  const near = new PIXI.Container();
  root.addChild(far, body, near);

  // Far side first, behind everything.
  farBone(far, at("shoulder_far"), at("elbow_far"), 12, HUMAN.sweater, EDGE);
  farBone(far, at("elbow_far"),    at("wrist_far"), 10, HUMAN.sweater, INNER);
  farBone(far, at("hip_far"),      at("knee_far"),  18, HUMAN.jeans,   EDGE);
  farBone(far, at("knee_far"),     at("ankle_far"), 14, HUMAN.jeans,   INNER);
  farBone(far, at("ankle_far"),    at("toe_far"),   10, HUMAN.shoes,   EDGE);

  // The torso follows the traced spine in TWO segments, pelvis->chest->neck,
  // tapering 46 to 38. One capsule hip-to-neck was the first thing tried and
  // it read as a slab: upright, 48 wide by 72 tall is a torso, but laid along
  // this slump's 40-degree spine the same width over a 62-unit run is nearly
  // square and stops being a body. The taper is what puts shoulders on it.
  // Width still answers to the shipped +/-24 the seat-fit tests measure — the
  // trace settles the POSE here, not the breadth.
  bone(body, at("pelvis"), at("chest"), 46, HUMAN.sweater, EDGE);
  bone(body, at("chest"),  at("neck"),  38, HUMAN.sweater, INNER);
  // The neck. Without it the skull hangs 4 units clear of the collar with
  // background showing through — the figure reads as decapitated, which is
  // what the first frame showed.
  bone(body, at("neck"), at("head"), 16, HUMAN.skin, INNER);

  // Near side in front.
  bone(near, at("hip_near"),      at("knee_near"),  18, HUMAN.jeans,   EDGE);
  bone(near, at("knee_near"),     at("ankle_near"), 14, HUMAN.jeans,   INNER);
  bone(near, at("ankle_near"),    at("toe_near"),   10, HUMAN.shoes,   EDGE);
  bone(near, at("shoulder_near"), at("elbow_near"), 12, HUMAN.sweater, EDGE);
  bone(near, at("elbow_near"),    at("wrist_near"), 10, HUMAN.sweater, INNER);

  // The hands are the wrist->hand BONE, not a circle parked at the hand joint.
  // The trace records that bone (12-14px of it) for both arms; drawing only
  // its far endpoint left a skin dot hanging a dozen units clear of the sleeve
  // on each side, which reads as a dropped prop rather than a hand.
  bone(near, at("wrist_near"), at("hand_near"), 12, HUMAN.skin, EDGE);
  farBone(far, at("wrist_far"), at("hand_far"), 12, HUMAN.skin, EDGE);

  const h = at("head");
  head(root, h.x, h.y);
}

/** The trader as it ships today, drawn by the page's own `seatedRig`. */
function shippedRig(root) {
  const body = new PIXI.Graphics();
  const accents = [];
  const headY = seatedRig(body, accents);
  // `character()` adds the accents BEFORE the body, which is why these arms
  // are invisible on air (KI-084). The sheet reproduces that order rather than
  // quietly fixing it: a control column that flatters the current state is not
  // a control.
  root.addChild(...accents, body);
  head(root, 0, headY);
}

function label(parent, text, x, y, size, color, anchor) {
  const t = new PIXI.Text({
    text,
    style: { fill: color ?? INK, fontFamily: "monospace", fontSize: size ?? 15 },
  });
  t.x = x; t.y = y;
  if (anchor) t.anchor.set(anchor, 0);
  parent.addChild(t);
  return t;
}

/** The vertical ruler, in the MARGIN.
 *
 * Reading coordinates off a grid drawn OVER pixel art put the face 30px from
 * where it actually was, and cost a whole round. Ticks live beside the art and
 * never across it; the art is only ever used to confirm what the numbers said.
 */
function ruler(stage, baselineY) {
  const g = new PIXI.Graphics();
  for (let u = -120; u <= 140; u += 10) {
    const y = baselineY + u * ZOOM;
    const major = u % 50 === 0;
    g.moveTo(34, y).lineTo(major ? 60 : 48, y)
     .stroke({ width: 1, color: major ? DIM : 0x394152, alpha: major ? 1 : 0.55 });
    if (major) label(stage, String(u), 64, y - 8, 11, DIM);
  }
  g.moveTo(34, baselineY - 120 * ZOOM).lineTo(34, baselineY + 140 * ZOOM)
   .stroke({ width: 1, color: DIM });
  stage.addChild(g);
  label(stage, "units", 34, baselineY + 148 * ZOOM, 11, DIM);
}

/** A width budget drawn as a bracket under a column — a number, not a chair. */
function bracket(stage, cx, y, units, text) {
  const half = (units * ZOOM) / 2;
  const g = new PIXI.Graphics();
  g.moveTo(cx - half, y).lineTo(cx - half, y + 8).lineTo(cx + half, y + 8)
   .lineTo(cx + half, y).stroke({ width: 1, color: DIM });
  stage.addChild(g);
  label(stage, text, cx, y + 12, 11, DIM, 0.5);
}

function column(app, cx, baselineY, title, note, build) {
  const root = new PIXI.Container();
  root.x = cx; root.y = baselineY;
  root.scale.set(ZOOM);
  build(root);
  app.stage.addChild(root);
  label(app.stage, title, cx, 62, 16, INK, 0.5);
  label(app.stage, note, cx, 84, 12, DIM, 0.5);
}

async function boot() {
  const app = new PIXI.Application();
  await app.init({
    width: W, height: H,
    background: 0x131722,     // the room's own ground, not black: a sheet on
                              // black can fall under `frame_is_blank`'s mean
                              // floor and be refused for being correct.
    antialias: false,         // pixel art
  });
  document.body.appendChild(app.canvas);

  const baselineY = 400;      // the hip, for BOTH columns — a shared origin is
                              // what makes the two silhouettes comparable.

  label(app.stage, "TRADER — MODEL SHEET", 34, 22, 18, INK);
  label(app.stage,
        "sheet 2.5x = exactly 2x ship (CAST_SCALE 1.25) · CELL 4u = 10px here, 5px on air",
        34, 44, 12, DIM);

  ruler(app.stage, baselineY);

  column(app, 330, baselineY,
         "SHIPPED  ·  seatedRig()",
         "what goes out today — arms behind the torso (KI-084)",
         shippedRig);

  column(app, 850, baselineY,
         "TRACED  ·  reference slump",
         "k = 2/3 u/px · crown..toe 180u = manifest rig_height",
         tracedRig);

  // Torso-only, and labelled so. The painted seat caps what sits ON it; the
  // whole-figure span is 149 units and a slumped person's legs necessarily
  // leave the seat. The seat-fit invariant is already down to be SPLIT at
  // placement (torso/pelvis on the seat, limbs free) rather than satisfied,
  // so a bracket implying the whole pose must fit inside it would invite the
  // wrong comparison — the one this increment deferred on purpose.
  bracket(app.stage, 330, baselineY + 128 * ZOOM, 63.2, "seat 63.2u — torso only");
  bracket(app.stage, 850, baselineY + 128 * ZOOM, 63.2, "seat 63.2u — torso only");

  label(app.stage,
        "no chair is drawn: the reference's is high-backed with a headrest, the",
        34, H - 46, 12, DIM);
  label(app.stage,
        "plate's is mid-back without one. Nothing here is placed in the room.",
        34, H - 30, 12, DIM);

  // The readiness flag `scripts/shoot.py` polls. Set after a real render, not
  // on DOM-ready: the canvas-exists fallback reports ready before anything is
  // drawn, which is exactly the empty-frame failure CDP was adopted to end.
  app.render();
  window.__worldDrawn = true;
}

boot().catch((err) => {
  // A boot that throws must not leave a plausible empty canvas behind. Say so
  // on the page, loudly enough that `frame_is_blank` sees structure and a human
  // sees the reason.
  (document.body || document.documentElement).innerHTML =
    '<pre style="color:#ff6b6b;background:#131722;font:14px monospace;padding:24px">'
    + "model sheet failed to boot:\n\n" + (err && err.stack || err) + "</pre>";
});
</script>
